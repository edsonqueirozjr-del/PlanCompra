  opcoes: (col) => opcoesDoFunil(col),
  repintar: (col, desmarcado) => redesenharSemFecharFunil(col, desmarcado),
};

function abrirFunil(col, botao, desmarcado, ctx) {
  ctx = ctx || CTX_GRADE;
  fecharFunil();
  funilAberto = col.id;
  /* Depois do `fecharFunil`, que limpa: e ele que garante que o apagado nao vaze
     de uma coluna para a outra. */
  funilDesmarcadoDe = desmarcado ? col.id : null;
  botao.classList.add("aberto");

  const painel = document.createElement("div");
  painel.className = "painel-funil";
  painel.id = "painel-funil";

  const opcoes = ctx.opcoes(col);

  /* A BUSCA DENTRO DO PAINEL. Ela peneira a LISTA, não a tabela: são coisas
     diferentes, e é o que permite achar um provedor entre vinte para marcá-lo. */
  const caixaBusca = document.createElement("div");
  caixaBusca.className = "funil-busca";
  const lupa = document.createElement("span");
  lupa.className = "lupa";
  lupa.setAttribute("aria-hidden", "true");
  const busca = document.createElement("input");
  busca.type = "text";
  busca.className = "campo";
  busca.placeholder = t("buscarNaLista");
  caixaBusca.append(lupa, busca);

  const lista = document.createElement("div");
  lista.className = "funil-lista";

  const contagem = document.createElement("div");
  contagem.className = "funil-pe";

  /**
   * O que está MARCADO agora, em valores.
   *
   * Lista vazia no estado quer dizer "sem restrição", e na tela isso se desenha
   * como TODAS as caixas marcadas — porque é o que a tabela está mostrando.
   */
  const marcadasAgora = () => {
    if (String(funilDesmarcadoDe) === String(col.id)) return new Set();
    const salvas = ctx.selecoes()[String(col.id)] || [];
    return new Set(salvas.length ? salvas : opcoes.map((o) => o.chave));
  };

  /** Grava a escolha, normalizando "todas marcadas" para "sem restrição". */
  const definir = (conjunto) => {
    const todas = conjunto.size === opcoes.length;
    if (todas || conjunto.size === 0) delete ctx.selecoes()[String(col.id)];
    else ctx.selecoes()[String(col.id)] = [...conjunto];
    guardarVista();
    /* Marcou algo: as caixas voltam a dizer a verdade. */
    ctx.repintar(col, false);
  };

  function pintar() {
    const marcadas = marcadasAgora();
    const termo = semAcento(busca.value.trim());
    const visiveis = termo
      ? opcoes.filter((o) => semAcento(o.chave).includes(termo))
      : opcoes;

    lista.replaceChildren();

    /* O (TODOS) É UM INTERRUPTOR DE VERDADE, e não um rótulo.
       Por baixo, "nada escolhido" É "sem restrição": a tabela mostra tudo. Isso
       resolve o dado e não resolve o GESTO — quem quer marcar dois de vinte abre o
       funil, vê os vinte marcados e procura como limpar antes de marcar. Clicar
       direto num deles já fazia o certo (deixa só ele), mas ninguém arrisca um
       clique que parece uma desmarca.
       Então clicar no (Todos) marcado APAGA as caixas. Nada sai da tabela, porque
       não há como excluir tudo; o que muda é o desenho, para o próximo clique ser
       uma marca e não parecer uma desmarca. */
    const todosMarcado = marcadas.size === opcoes.length;
    const linhaTodos = itemDoFunil(t("todosDaLista"), todosMarcado, true);
    linhaTodos.onclick = () => {
      /* Nos dois casos a RESTRICAO cai (a tabela volta a mostrar tudo). O que muda
         e so o desenho das caixas: marcado -> apaga, apagado -> marca. */
      delete ctx.selecoes()[String(col.id)];
      guardarVista();
      ctx.repintar(col, todosMarcado);
    };
    lista.appendChild(linhaTodos);

    if (!visiveis.length) {
      const vazio = document.createElement("div");
      vazio.className = "funil-vazio";
      vazio.textContent = t("nadaNaLista");
      lista.appendChild(vazio);
    }

    for (const o of visiveis) {
      const item = itemDoFunil(o.chave === "" ? t("vazioDaLista") : o.chave,
                               marcadas.has(o.chave), false);
      item.onclick = () => {
        const nova = new Set(marcadasAgora());
        if (nova.has(o.chave)) nova.delete(o.chave); else nova.add(o.chave);
        definir(nova);
      };
      lista.appendChild(item);
    }

    contagem.textContent = fmtInteiro().format(marcadas.size) + " "
      + t("escolhidasDe") + " " + fmtInteiro().format(opcoes.length);
  }

  busca.oninput = pintar;

  painel.append(caixaBusca, lista, contagem);
  document.body.appendChild(painel);
  pintar();
  posicionarFunil(painel, botao);
  busca.focus();
}

/** Uma linha do painel: caixa de marcar e rótulo. */
function itemDoFunil(rotulo, marcado, ehTodos) {
  const item = document.createElement("button");
  item.type = "button";
  item.className = "funil-item" + (ehTodos ? " funil-todos" : "");
  item.setAttribute("aria-pressed", String(marcado));

  const caixa = document.createElement("span");
  caixa.className = "caixa" + (marcado ? " marcada" : "");

  const texto = document.createElement("span");
  texto.className = "rot";
  texto.textContent = rotulo;
  texto.title = rotulo;

  item.append(caixa, texto);
  return item;
}

/**
 * Põe o painel embaixo do funil, preso DENTRO da janela.
 *
 * Sem prender, o funil da última coluna abriria um painel com metade fora da tela
 * pela direita — e ali não há como trazê-lo de volta, porque não se rola para fora
 * da janela. Passando do rodapé, ele sobe e abre PARA CIMA do botão.
 */
function posicionarFunil(painel, botao) {
  const r = botao.getBoundingClientRect();
  const p = painel.getBoundingClientRect();
  const margem = 8;

  let x = r.left;
  if (x + p.width > innerWidth - margem) x = innerWidth - p.width - margem;
  if (x < margem) x = margem;

  let y = r.bottom + 4;
  if (y + p.height > innerHeight - margem) {
    const acima = r.top - p.height - 4;
    y = acima >= margem ? acima : Math.max(margem, innerHeight - p.height - margem);
  }
  painel.style.left = Math.round(x) + "px";
  painel.style.top = Math.round(y) + "px";
}

/**
 * Redesenha a grade e reabre o funil no mesmo lugar.
 *
 * Marcar um valor muda a tabela, e a tabela é refeita — o que destrói o botão que
 * abriu o painel. Sem reabrir, o painel fecharia a cada clique e escolher três
 * valores exigiria abrir o funil três vezes.
 */
function redesenharSemFecharFunil(col, desmarcado) {
  const guardado = funilAberto;
  const painel = $("painel-funil");
  const rolagem = painel ? painel.querySelector(".funil-lista").scrollTop : 0;
  const termo = painel ? painel.querySelector(".funil-busca input").value : "";

  redesenhar();

  const cols = colunasAVista();
  const pos = cols.findIndex((c) => String(c.id) === String(guardado));
  const botao = pos >= 0
    ? $("th-cabecalho").children[pos].querySelector(".funil") : null;
  if (!botao) return;

  abrirFunil(cols[pos], botao, desmarcado);

  const novo = $("painel-funil");
  if (novo && termo) {
    const campo = novo.querySelector(".funil-busca input");
    campo.value = termo;
    campo.dispatchEvent(new Event("input"));
  }
  if (novo) novo.querySelector(".funil-lista").scrollTop = rolagem;
}

/**
 * O TRAÇO DO DESTINO, desenhado no cabeçalho alvo.
 *
 * Mexe no DOM direto e NÃO redesenha a grade, e é obrigatório que seja assim:
 * refazer a tabela durante um arrasto destrói o elemento sobre o qual o mouse
 * está, o navegador perde o alvo e o gesto morre no meio.
 *
 * O LADO sai da direção: indo para a direita a coluna entra DEPOIS do alvo, para a
 * esquerda ANTES. É o mesmo cálculo do `moverColuna`, para o traço prometer onde a
 * coluna vai realmente cair.
 */
function marcarAlvo(id) {
  for (const th of $("th-cabecalho").children) th.classList.remove("alvo-antes", "alvo-depois");
  if (id === null || colunaNaMao === null) return;

  /* AQUI SÃO AS COLUNAS À VISTA, e não as da ordem: o índice serve para achar o
     `<th>` em `th-cabecalho.children`, e o cabeçalho só desenha as que se veem.
     Contando na lista completa, uma coluna escondida antes do alvo deslocava o
     traço uma posição para o lado. */
  const ids = colunasAVista().map((c) => String(c.id));
  const de = ids.indexOf(String(colunaNaMao));
  const para = ids.indexOf(String(id));
  const th = $("th-cabecalho").children[para];
  if (th) th.classList.add(de < para ? "alvo-depois" : "alvo-antes");
}

/* ---------------------------------------------------------------------------
   A VISTA GUARDADA: ordenação, funis e busca.

   Tudo o que a pessoa escolhe sobre COMO OLHAR volta na próxima abertura, junto do
   que ela já tinha: as correções (IndexedDB), a ordem das colunas e a coluna do PMK
   (`localStorage`). A tela reabre exatamente como foi deixada, que é o mínimo de
   uma ferramenta que se usa toda semana.

   `localStorage`, e não IndexedDB: é preferência de quem olha, não dado. Muda de
   máquina para máquina, e apagar as planilhas não a leva.

   A PENEIRA É NA LEITURA, e é obrigatória: o armazém é texto que qualquer um edita,
   e é de uma sessão passada — a planilha de hoje pode ter outras colunas. Uma chave
   de ordenação que não existe mais cai para o padrão, e uma seleção de funil que
   não é lista de texto é descartada. No pior caso a pessoa perde o recorte; nunca
   vê fila errada.
--------------------------------------------------------------------------- */

const CHAVE_VISTA = "pc.vista";

/* ---------------------------------------------------------------------------
   O DIÁRIO: as dez últimas coisas feitas.

   Ele responde a pergunta que se faz ao abrir a página — "isto está atualizado?" —
   e depois a seguinte, "atualizado com o quê?". Numa ferramenta que roda no
   navegador de uma pessoa e guarda tudo localmente, sem esta lista não há como
   saber se o estoque entrou hoje ou há três semanas.

   DEZ, e não tudo: é um lembrete de trabalho, não uma auditoria. Uma lista que
   cresce sem fim precisa de busca, e aí ela é outra tela.

   NÃO ENTRA AQUI o que muda só a VISTA (ordenar, filtrar, esconder o PMK): são
   gestos de olhar, dezenas por sessão, e eles afogariam as três ações que de fato
   mexem no dado. O diário é sobre o que mudou, não sobre como se olhou.
--------------------------------------------------------------------------- */

const CHAVE_DIARIO = "pc.diario";
const DIARIO_MAX = 10;

/**
 * Anota uma ação.
 *
 * `detalhe` é o complemento livre (o nome do produto, quantas filas entraram).
 * `campos` são OS NOMES DO QUE MUDOU — e não os valores. "Produto editado" sozinho
 * não diz nada a quem volta na segunda-feira: o que se quer saber é se foi o `A
 * Comprar` ou o mês. Os VALORES ficam de fora de propósito: eles estão na tabela,
 * que é onde se leem, e na lista virariam três números sem coluna.
 */
function anotar(chave, detalhe, campos) {
  estado.diario.unshift({
    em: Date.now(), chave, detalhe: detalhe || "",
    campos: Array.isArray(campos) ? campos : [],
  });
  estado.diario.length = Math.min(estado.diario.length, DIARIO_MAX);
  try {
    localStorage.setItem(CHAVE_DIARIO, JSON.stringify(estado.diario));
  } catch { /* navegação privada: o diário vale só nesta sessão */ }
  desenharDiario();
}

function lerDiario() {
  try {
    const lido = JSON.parse(localStorage.getItem(CHAVE_DIARIO) || "[]");
    /* PENEIRA: o armazém é texto que qualquer um edita. Uma anotação sem hora ou
       sem chave de texto é descartada em silêncio — o diário é conveniência, e
       conveniência não derruba a tela. */
    estado.diario = Array.isArray(lido)
      ? lido.filter((a) => a && typeof a.em === "number" && typeof a.chave === "string")
            .map((a) => ({ ...a, campos: Array.isArray(a.campos)
              ? a.campos.filter((c) => typeof c === "string") : [] }))
            .slice(0, DIARIO_MAX)
      : [];
  } catch { estado.diario = []; }
}

const fmtQuando = () => new Intl.DateTimeFormat(idioma === "pt" ? "pt-BR" : "es-PY",
  /* 24 HORAS, SEMPRE. O espanhol do Paraguai formata "02:49 p. m.", e numa lista de
     dez horários empilhados o "p. m." atrasa a leitura de todas — a hora ali é para
     comparar, não para narrar. */
  { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });

/** O relógio da linha do título e o painel das dez últimas ações. */
function desenharDiario() {
  const botao = $("btn-diario");
  if (!botao) return;
  botao.hidden = !estado.diario.length;
  if (estado.diario.length) {
    $("rotulo-diario").textContent =
      t("atualizado") + " " + fmtQuando().format(new Date(estado.diario[0].em));
  }

  const painel = $("menu-diario");
  painel.replaceChildren();
  const cabeca = document.createElement("b");
  cabeca.textContent = t("ultimasAcciones");
  painel.appendChild(cabeca);

  if (!estado.diario.length) {
    const p = document.createElement("p");
    p.className = "diario-vazio";
    p.textContent = t("semAtividade");
    painel.appendChild(p);
    return;
  }
  for (const a of estado.diario) {
    const item = document.createElement("div");
    item.className = "diario-item";

    const quando = document.createElement("span");
    quando.className = "quando";
    quando.textContent = fmtQuando().format(new Date(a.em));

    const oque = document.createElement("span");
    oque.className = "oque";
    const b = document.createElement("b");
    b.textContent = t(a.chave);
    oque.appendChild(b);

    /* O DETALHE E AS PASTILHAS DIVIDEM UMA LINHA.
       Eram duas: o nome do produto numa, o que mudou na de baixo — e com o título
       em cima davam TRÊS linhas por anotação. Numa lista de dez, isso é trinta
       linhas para uma coisa que existe para se ler de relance.
       Na mesma linha elas se leem como uma frase só ("BRAVONIL - 20 Lt · A
       Comprar"), e a anotação volta a caber em duas. */
    if (a.detalhe || a.campos.length) {
      const linha = document.createElement("span");
      linha.className = "diario-linha";
      if (a.detalhe) {
        const d = document.createElement("span");
        d.className = "diario-detalhe";
        d.textContent = a.detalhe;
        linha.appendChild(d);
      }
      /* Nome de coluna numa PASTILHA se lê como referência à coluna, e não como
         mais uma palavra da frase — mesma peça da conta do saldo. */
      for (const c of a.campos) linha.appendChild(parcelaDaConta(c));
      oque.appendChild(linha);
    }

    item.append(quando, oque);
    painel.appendChild(item);
  }
}

/**
 * A lista de colunas: uma linha por coluna, com a caixa de marcar.
 *
 * A ORDEM É A DA GRADE, inclusive as escondidas — quem procura uma coluna na lista
 * a procura onde ela fica na tabela. Por isso ela sai de `colunasNaOrdem`, que é a
 * lista completa, e não de `colunasAVista`.
 */
function desenharListaDeColunas() {
  const painel = $("menu-colunas");
  if (!painel) return;
  painel.replaceChildren();

  const cabeca = document.createElement("b");
  cabeca.textContent = t("colunasTitulo");
  painel.appendChild(cabeca);

  const lista = document.createElement("div");
  lista.className = "lista-colunas";
  const todas = colunasNaOrdem().filter((c) => c.tipo !== "acoes");
  const aVista = todas.filter((c) => !c.oculta).length;

  for (const col of todas) {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "funil-item";
    item.setAttribute("role", "menuitemcheckbox");
    item.setAttribute("aria-checked", String(!col.oculta));
    const caixa = document.createElement("span");
    caixa.className = "caixa" + (col.oculta ? "" : " marcada");
    const rot = document.createElement("span");
    rot.className = "rot";
    rot.textContent = col.titulo;
    item.append(caixa, rot);
    /* A ÚLTIMA À VISTA FICA DESABILITADA, em vez de o clique não fazer nada: um
       clique que não responde lê como defeito, e o cinza diz por quê antes de
       alguém tentar. */
    if (!col.oculta && aVista <= 1) item.disabled = true;
    else item.onclick = () => alternarColuna(col.id);
    lista.appendChild(item);
  }
  painel.appendChild(lista);

  /* SEM NOTA DE PÉ. Houve um "uma tem de ficar à vista" embaixo da lista, e ele
     saiu: a linha desabilitada já diz isso no lugar em que a pessoa tentaria
     clicar, e um aviso permanente para uma situação que acontece uma vez em cem
     ocupa o painel todas as outras noventa e nove. */
}

function irParaTela(qual) {
  estado.tela = qual;
  fecharFunil();
  redesenhar();
}

function fecharListaDeColunas() {
  $("menu-colunas").hidden = true;
  $("btn-colunas").setAttribute("aria-expanded", "false");
}

function fecharDiario() {
  $("menu-diario").hidden = true;
  $("btn-diario").setAttribute("aria-expanded", "false");
}

function guardarVista() {
  try {
    localStorage.setItem(CHAVE_VISTA, JSON.stringify({
      ordem: estado.ordem,
      selecoes: estado.selecoes,
      busca: estado.busca,
    }));
  } catch { /* navegação privada: a vista vale só nesta sessão */ }
}

function lerVista() {
  let lido = null;
  try {
    const bruto = localStorage.getItem(CHAVE_VISTA);
    lido = bruto ? JSON.parse(bruto) : null;
  } catch { lido = null; }
  if (!lido || typeof lido !== "object") return;

  const o = lido.ordem;
  if (o && typeof o === "object" && (typeof o.chave === "string" || typeof o.chave === "number"
                                     || o.chave === null)) {
    estado.ordem = { chave: o.chave, desc: Boolean(o.desc) };
  }
  if (lido.selecoes && typeof lido.selecoes === "object") {
    const limpo = {};
    for (const [id, valores] of Object.entries(lido.selecoes)) {
      if (Array.isArray(valores) && valores.length && valores.every((v) => typeof v === "string")) {
        limpo[id] = valores;
      }
    }
    estado.selecoes = limpo;
  }
  if (typeof lido.busca === "string") estado.busca = lido.busca;
}

/** A ordem escolhida vive no navegador desta máquina. Texto ruim não derruba nada. */
function guardarOrdemColunas() {
  try {
    if (estado.ordemColunas) localStorage.setItem(CHAVE_ORDEM, JSON.stringify(estado.ordemColunas));
    else localStorage.removeItem(CHAVE_ORDEM);
  } catch { /* navegação privada: a ordem vale só nesta sessão */ }
}

function lerOrdemColunas() {
  try {
    const bruto = localStorage.getItem(CHAVE_ORDEM);
    const lido = bruto ? JSON.parse(bruto) : null;
    /* A peneira de verdade é `aplicarOrdemEscolhida`, que compara com as colunas de
       hoje. Aqui só se recusa o que não é nem lista. */
    estado.ordemColunas = Array.isArray(lido) ? lido : null;
  } catch { estado.ordemColunas = null; }
}

/* ── AS CÉLULAS DAS COLUNAS DE DECISÃO ─────────────────────────────────────
   Elas NÃO se editam no lugar. A edição inteira mudou de forma: era um botão que
   abria campo em todas as filas ao mesmo tempo (mil e um campos para corrigir um
   produto), e passou a ser uma tela por produto, aberta no lápis da fila.

   Com isso saiu bastante código, e vale dizer o que era: a gravação por campo, a
   atualização pontual de totais e a refeitura de uma célula só existiam para não
   redesenhar a grade a cada tecla — o redesenho destruía o campo para onde o Tab
   ia levar. Sem campo na grade, o problema não existe: a tela de edição grava uma
   vez e a grade se refaz inteira, que é simples e sempre certo.

   O que sobrou aqui é o DESENHO dos três estados que a célula ainda tem. */

/** Uma célula de número de coluna de decisão: valor, marca de corrigido, trava. */
function desenharCelulaEditada(td, col, g) {
  if (col.tipo === "mes") return desenharCelulaDeMes(td, col, g);

  const valor = g.valores[col.id] || 0;
  const trava = colunasDaTrava();
  const travado = Boolean(trava.aComprar) && col.id === trava.aComprar.indice
                  && g.travadoPorFaltarPmk;

  td.textContent = numero(valor);
  if (!valor) td.classList.add("zero");

  if (travado) {
    /* `A Comprar` SEM PMK: o valor é zero, e a célula fica IGUAL às outras.
       Ela já teve fundo cinza e contorno (os tokens `travado-*` do Plan de Ventas,
       feitos para o campo cujo valor vem de uma regra), e saiu a pedido: numa
       coluna em que a maior parte das filas não tem PMK, aquilo virava uma coluna
       inteira de caixinhas cinzas — mais forte que o dado que devia apresentar.
       O que sobra é a DICA DO MOUSE, que explica o zero a quem o questionar. */
    td.title = t("sinPmk");
  } else if (!g.editavel) {
    td.title = t("noEditableAgrupado");
  } else if (g.corrigidas[col.id]) {
    /* CORRIGIDA À MÃO: sem marca na tela, só a dica do mouse. O ponto verde que
       ficava no canto saiu a pedido — numa coluna em que se corrige metade das
       filas ele virava uma fileira de pontos. */
    td.title = t("corregidoAca") + " " + numero(valorDaPlanilha(g, col));
  }
}

/** A chegada estimada, em leitura: o mês escolhido, pelo nome. */
function desenharCelulaDeMes(td, col, g) {
  const mes = g.chegada || 0;
  td.textContent = nomeDoMes(mes);
  if (!mes) td.classList.add("zero");
  if (!g.editavel) td.title = t("noEditableAgrupado");
}

/** O valor que a PLANILHA traz para esta célula, ignorando a correção. */
function valorDaPlanilha(g, col) {
  const fila = filaDaPlanilha(g);
  const bruto = fila ? fila[col.id] : null;
  return typeof bruto === "number" && Number.isFinite(bruto) ? bruto : 0;
}

/** A fila da planilha por trás de um grupo editável. */
function filaDaPlanilha(g) {
  if (!g.chaveEdicao) return null;
  return uniaoDasFilas().porChave.get(g.chaveEdicao) || null;
}

/** O lápis da fila. Só desenha; quem abre a tela é o clique na fila. */
function desenharLapis(td, g) {
  if (!g.editavel) return;
  const b = document.createElement("span");
  b.className = "lapis";
  b.title = t("editarFila");
  b.innerHTML = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'"
    + " stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>"
    + "<path d='M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7'/>"
    + "<path d='M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z'/></svg>";
  td.appendChild(b);
}

/* ── A TELA DE EDITAR UM PRODUTO ────────────────────────────────────────────
   Três coisas, decididas juntas: quanto o comercial planejou, quanto se compra e
   quando chega. Elas vivem numa tela só porque a decisão é uma: mexer no PMK sem
   olhar o A Comprar, ou definir o mês sem saber a quantidade, é decidir metade.

   Os NÚMEROS DE FATO (estoque, pedido, total) aparecem em leitura no alto: é
   contra eles que a decisão se toma, e sem tê-los à vista quem edita fecharia a
   tela para consultá-los. */

let editandoChave = null;
/* Os campos da tela de editar, por nome. Eles sao MONTADOS a cada abertura (quais
   existem depende das colunas da planilha), entao nao ha id fixo para buscar: quem
   grava pega deste mapa. */
let camposDoEditor = {};

/**
 * Os VALORES que uma coluna de texto já tem, em toda a base.
 *
 * É o que faz o campo de grupo oferecer só grupos que existem, e o de provedor
 * sugerir os que já foram cadastrados: nomes digitados à mão em cento e sete filas
 * viram cento e sete grafias do mesmo fornecedor, e aí nenhum filtro fecha.
 *
 * Sai da GRADE e não do arquivo, então já inclui o que foi corrigido à mão: um
 * provedor escrito uma vez passa a ser sugestão para os outros produtos.
 */
function valoresJaUsados(indiceColuna) {
  const vistos = new Set();
  for (const g of montarGrade().filas) {
    const v = String(g.textos[indiceColuna] ?? "").trim();
    if (v) vistos.add(v);
  }
  return [...vistos].sort((a, b) => a.localeCompare(b, idioma === "pt" ? "pt-BR" : "es-PY"));
}

/** Uma etiqueta com rótulo e um campo dentro, do jeito da tela de editar. */
function campoDoEditor(rotulo, largo) {
  const caixa = document.createElement("label");
  caixa.className = "campo-rotulado" + (largo ? " largo" : "");
  const rot = document.createElement("span");
  rot.textContent = rotulo;
  caixa.appendChild(rot);
  return caixa;
}

function abrirEditor(chave) {
  if (!chave) return;
  const g = montarGrade().filas.find((f) => f.chaveEdicao === chave);
  if (!g) return;

  editandoChave = chave;
  const trava = colunasDaTrava();
  const correcoes = correcoesDe(chave);
  const campos = $("editar-campos");
  campos.replaceChildren();
  camposDoEditor = {};

  $("editar-produto").textContent = g.rotulo;
  $("editar-codigo").textContent = g.codigo;

  /* ── 1. O CÓDIGO ─────────────────────────────────────────────────────────
     Editável, e é o único campo cuja gravação pede confirmação: o cruzamento com
     a planilha de estoque acontece por código, então trocá-lo troca com que item
     este produto casa. Ver `salvarEditor`. */
  const colCodigo = colunasDe("codigo")[0] || null;
  if (colCodigo) {
    const caixa = campoDoEditor(rotuloDaColuna(colCodigo.titulo));
    const linha = document.createElement("div");
    linha.className = "campo-com-botao";
    const inp = document.createElement("input");
    inp.type = "text";
    inp.className = "campo campo-codigo";
    /* VEM COM O CÓDIGO DE VERDADE ESCRITO, e travado.
       O campo era vazio, com o código só no texto de exemplo: quem abria a tela
       para conferir o código lia um campo em branco, e um campo em branco ao lado
       de "Codigo" convida a digitar. Escrito, ele mostra o que vale; travado, ele
       diz que trocar aquilo não é coisa que se faça de passagem.
       O valor é o EFETIVO (o corrigido se houver, senão o do arquivo), e é por isso
       que salvar sem mexer não grava correção nenhuma: `salvarEditor` compara o que
       está no campo com o efetivo, e igual não é correção. */
    inp.value = g.codigo || "";
    inp.readOnly = true;
    camposDoEditor.codigo = inp;

    /* O BOTÃO DESTRAVA, e é uma parada a mais de propósito: o cruzamento com a
       planilha de estoque é POR CÓDIGO, então trocá-lo troca estoque, pedido e
       saldo daquela fila. Depois de destravado, salvar ainda pergunta. */
    /* DESTRAVAR e GRAVAR são O MESMO BOTÃO, em dois estados, e ele não desaparece:
       o código é a única coisa desta tela que se resolve sozinha, e quem abriu para
       corrigir um código não quer percorrer os outros sete campos até o Guardar do
       pé. Gravando aqui, a tela fica aberta e o campo trava de volta — com o lápis
       de novo, porque quem errou a digitação corrige na hora.
       O Guardar do pé continua gravando TUDO; este só adianta esta linha. */
    const botao = document.createElement("button");
    botao.type = "button";
    botao.className = "btn-destravar";
    const LAPIS = "<path d='M12 20h9'/><path d='M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z'/>";
    const TIQUE = "<path d='M20 6L9 17l-5-5'/>";
    const desenhar = (traco, rotulo) => {
      botao.title = rotulo;
      botao.setAttribute("aria-label", rotulo);
      botao.innerHTML = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor'"
        + " stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'"
        + " aria-hidden='true'>" + traco + "</svg>";
    };
    const travar = () => {
      inp.readOnly = true;
      botao.classList.remove("gravar");
      desenhar(LAPIS, t("editarCodigo"));
      botao.onclick = destravar;
    };
    const destravar = () => {
      inp.readOnly = false;
      botao.classList.add("gravar");
      desenhar(TIQUE, t("guardarCodigo"));
      botao.onclick = salvarCodigoAqui;
      inp.focus();
      inp.select();
    };
    travar();
    camposDoEditor.travarCodigo = travar;
    linha.append(inp, botao);
    caixa.appendChild(linha);
    campos.appendChild(caixa);
  }

  /* ── 2. AS COLUNAS DE TEXTO da planilha, uma por campo ───────────────────
     GRUPO é uma LISTA FECHADA: só os grupos que já existem. Grupo é classificação,
     e classificação com valor novo a cada digitação deixa de classificar.
     O RESTO (provedor e o que mais vier) é campo aberto COM SUGESTÃO: um provedor
     novo aparece de verdade, e os que já existem vêm prontos para não virarem três
     grafias do mesmo nome. */
  for (const col of colunasDe("texto")) {
    const caixa = campoDoEditor(rotuloDaColuna(col.titulo));
    const usados = valoresJaUsados(col.indice);
    const atual = String(g.textos[col.indice] ?? "");
    const fechado = /grupo/i.test(col.titulo);

    if (fechado) {
      const sel = document.createElement("select");
      sel.className = "campo";
      const nada = document.createElement("option");
      nada.value = "";
      nada.textContent = t("semvalor");
      sel.appendChild(nada);
      for (const v of usados) {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = v;
        sel.appendChild(o);
      }
      sel.value = atual;
      camposDoEditor["texto:" + col.titulo] = sel;
      caixa.appendChild(sel);
    } else {
      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "campo";
      inp.value = atual;
      /* A LISTA é SUGESTÃO, não restrição: `datalist` abre as opções e continua
         aceitando texto novo. É a diferença entre "escolha um" e "escolha um ou
         escreva outro", e o provedor é o segundo caso. */
      const lista = document.createElement("datalist");
      lista.id = "usados-" + col.indice;
      for (const v of usados) {
        const o = document.createElement("option");
        o.value = v;
        lista.appendChild(o);
      }
      inp.setAttribute("list", lista.id);
      camposDoEditor["texto:" + col.titulo] = inp;
      caixa.append(inp, lista);
    }
    campos.appendChild(caixa);
  }

  /* ── 3. A MÁSCARA DO NOME, atravessando a largura ────────────────────────
     Ela é a mais comprida das identidades (um nome de produto inteiro), e num
     terço da linha não se leria o que está escrito. */
  const parMasc = document.createElement("div");
  parMasc.className = "par-mascara";

  /* À ESQUERDA, O NOME DA PLANILHA, travado. Ele existe para ser COMPARADO: a
     máscara é o nome que vai aparecer na tabela e nos relatórios, e escolher um
     apelido sem ver o original ao lado é escolher de memória. Travado porque o
     nome do arquivo não se edita aqui — o que se edita é o que se mostra dele. */
  const caixaReal = campoDoEditor(t("nombreDelArchivo"));
  const real = document.createElement("input");
  real.type = "text";
  real.className = "campo";
  real.value = g.nomeDoArquivo || "";
  real.readOnly = true;
  real.tabIndex = -1;
  caixaReal.appendChild(real);

  const caixaMasc = campoDoEditor(t(COLUNA_MASCARA.chave));
  const masc = document.createElement("input");
  masc.type = "text";
  masc.className = "campo";
  masc.value = String(correcoes[COLUNA_MASCARA.id] ?? "");
  masc.placeholder = g.nomeDoArquivo || "";
  camposDoEditor.mascara = masc;
  caixaMasc.appendChild(masc);

  parMasc.append(caixaReal, caixaMasc);
  campos.appendChild(parMasc);

  /* ── 4. AS TRÊS DECISÕES, no fim ─────────────────────────────────────────
     E ELAS NÃO APARECEM NO CADASTRO. A tela de produtos responde "quem é este
     produto"; PMK, A Comprar e o mês respondem "quanto comprar", que é a outra
     tela. Abrindo a mesma edição dos dois lugares, os campos de compra ali eram
     um convite a decidir compra numa tela que não mostra estoque nem pedido — a
     decisão sem os números que a justificam.
     O QUE JÁ FOI DIGITADO NELES NÃO SE PERDE: `salvarEditor` só mexe no campo que
     existe na tela, e o que não está aqui fica exatamente como estava. */
  if (estado.tela === "produtos") {
    $("fundo-editar").hidden = false;
    const primeiro = camposDoEditor.codigo || masc;
    primeiro.focus();
    return;
  }

  /* O CAMPO VAZIO NÃO QUER DIZER ZERO: quer dizer "sem correção", e aí volta a
     valer o número da planilha. Num formulário com botão Salvar isso lê como
     "deixei vazio", então o valor do arquivo vai no TEXTO DE EXEMPLO: apagando, a
     pessoa vê ali o número que vai voltar. */
  const numerico = (rotulo, col, guarda) => {
    const caixa = campoDoEditor(rotulo);
    const inp = document.createElement("input");
    inp.type = "text";
    inp.inputMode = "decimal";
    inp.className = "campo campo-numero";
    if (col) {
      const daPlanilha = valorDaPlanilha(g, { id: col.indice });
      inp.value = g.valores[col.indice] ? numero(g.valores[col.indice]) : "";
      inp.placeholder = daPlanilha ? numero(daPlanilha) : "0";
    }
    camposDoEditor[guarda] = inp;
    caixa.appendChild(inp);
    campos.appendChild(caixa);
    return inp;
  };
  const cPmk = numerico(trava.pmk ? rotuloDaColuna(trava.pmk.titulo) : "PMK",
                        trava.pmk, "pmk");
  numerico(trava.aComprar ? rotuloDaColuna(trava.aComprar.titulo) : "A Comprar",
           trava.aComprar, "comprar");

  const caixaMes = campoDoEditor(t(COLUNA_CHEGADA.chave));
  const sel = document.createElement("select");
  sel.className = "campo";
  const nada = document.createElement("option");
  nada.value = "";
  nada.textContent = t("sinFecha");
  sel.appendChild(nada);
  for (let m = 1; m <= 12; m++) {
    const o = document.createElement("option");
    o.value = String(m);
    o.textContent = nomeDoMes(m);
    sel.appendChild(o);
  }
  sel.value = g.chegada ? String(g.chegada) : "";
  camposDoEditor.mes = sel;
  caixaMes.appendChild(sel);
  campos.appendChild(caixaMes);

  /* SEM FRASE DE AVISO NA TELA DE EDITAR.
     Havia um "Sem PMK não há nada a comprar: fica em zero" embaixo dos campos, e
     ele saiu a pedido. A regra continua de pé, e continua explicada onde ela de
     fato aparece: a DICA DO MOUSE na célula de A Comprar, que só é lida por quem
     estranhou o zero. Uma frase permanente no formulário avisa sobre uma regra
     todas as vezes em que ela não está atrapalhando ninguém. */
  $("fundo-editar").hidden = false;
  cPmk.focus();
  cPmk.select();
}

function fecharEditor() {
  editandoChave = null;
  $("fundo-editar").hidden = true;
}

/**
 * Grava SÓ O CÓDIGO, sem fechar a tela.
 *
 * É a mesma regra do Guardar do pé, com o mesmo pedido de confirmação e pelo mesmo
 * motivo: o cruzamento com a planilha de estoque é POR CÓDIGO, então trocá-lo troca
 * o estoque, o pedido e o saldo daquela fila de uma vez. A pergunta mostra OS DOIS
 * códigos, porque "tem certeza?" sem dizer de quê não é pergunta.
 *
 * IGUAL AO EFETIVO NÃO É MUDANÇA: aí ele só trava de volta, sem perguntar nada.
 */
function salvarCodigoAqui() {
  if (!editandoChave || !camposDoEditor.codigo) return;
  const campo = camposDoEditor.codigo;
  const g = montarGrade().filas.find((f) => f.chaveEdicao === editandoChave);
  const daBase = g ? g.codigoDoArquivo : "";
  const efetivo = g ? g.codigo : "";
  const novo = campo.value.trim();
  const vaiVirar = novo || daBase;

  if (vaiVirar !== efetivo) {
    const pergunta = t("confirmarCodigo")
      .replace("{de}", efetivo || "—")
      .replace("{para}", vaiVirar || "—");
    if (!confirm(pergunta)) return;
    /* Vazio, ou igual ao que o arquivo traz, APAGA a correção: guardar uma correção
       que repete a origem seria guardar nada, e faria a fila parecer corrigida sem
       nada ter mudado. */
    guardarCorrecao(editandoChave, CORRECAO_CODIGO,
                    vaiVirar === daBase ? null : vaiVirar);
    anotar("logEdicao", g ? g.rotulo : vaiVirar, [t("colCodigo")]);
  }

  /* A TELA CONTINUA ABERTA, e o campo volta a travar: o gesto acabou, e o que fica
     à vista é o código que agora vale.
     E NÃO SE REMONTA A TELA. Chamar `abrirEditor` aqui seria mais curto e apagaria o
     que a pessoa já digitou nos outros campos sem ter salvado — gravar o código não
     pode custar o resto do formulário. O resto continua no Guardar do pé. */
  campo.value = vaiVirar;
  if (camposDoEditor.travarCodigo) camposDoEditor.travarCodigo();
  $("editar-codigo").textContent = vaiVirar;
  redesenhar();
}

/**
 * O nome legível de uma chave de correção, para o diário.
 *
 * As correções são guardadas por TÍTULO DE COLUNA DO ARQUIVO (é a identidade que
 * sobrevive a renomear), e as três sintéticas por id — daí os dois caminhos.
 */
function rotuloDaCorrecao(chave) {
  if (chave === CORRECAO_CODIGO) return t("colCodigo");
  if (chave === COLUNA_MASCARA.id) return t(COLUNA_MASCARA.chave);
  if (chave === COLUNA_CHEGADA.id) return t(COLUNA_CHEGADA.chave);
  return rotuloDaColuna(chave);
}

/** Quais chaves mudaram entre as correções de antes e as de agora. */
function correcoesQueMudaram(antes, depois) {
  const mudou = [];
  for (const chave of new Set([...Object.keys(antes), ...Object.keys(depois)])) {
    if (String(antes[chave] ?? "") !== String(depois[chave] ?? "")) {
      mudou.push(rotuloDaCorrecao(chave));
    }
  }
  return mudou;
}

function salvarEditor() {
  if (!editandoChave) return;
  const trava = colunasDaTrava();
  const g = montarGrade().filas.find((f) => f.chaveEdicao === editandoChave);
  const atual = { ...correcoesDe(editandoChave) };

  /* Guarda um texto: vazio, ou IGUAL ao que o arquivo traz, remove a chave. Guardar
     uma correção que repete a origem seria guardar nada, e faria a fila parecer
     corrigida sem nada ter mudado. */
  const guardarTexto = (id, valor, doArquivo) => {
    const texto = String(valor ?? "").trim();
    if (texto && texto !== String(doArquivo ?? "").trim()) atual[id] = texto;
    else delete atual[id];
  };

  /* ── O CÓDIGO, com CONFIRMAÇÃO ────────────────────────────────────────────
     É a única gravação desta tela que pergunta antes, e a razão é a consequência:
     o cruzamento com a planilha de estoque é POR CÓDIGO, então trocar o código
     troca o estoque, o pedido e o saldo daquela fila de uma vez. A pergunta mostra
     os dois códigos, porque "tem certeza?" sem dizer de quê não é pergunta. */
  if (camposDoEditor.codigo) {
    const novo = camposDoEditor.codigo.value.trim();
    const daBase = g ? g.codigoDoArquivo : "";
    const efetivo = g ? g.codigo : "";
    const vaiVirar = novo || daBase;

    if (vaiVirar !== efetivo) {
      const pergunta = t("confirmarCodigo")
        .replace("{de}", efetivo || "—")
        .replace("{para}", vaiVirar || "—");
      if (!confirm(pergunta)) return;
    }
    guardarTexto(CORRECAO_CODIGO, novo, daBase);
  }

  /* ── AS COLUNAS DE TEXTO da planilha ─────────────────────────────────────── */
  for (const col of colunasDe("texto")) {
    const campo = camposDoEditor["texto:" + col.titulo];
    if (!campo) continue;
    const fila = filaDaPlanilha(g || { chaveEdicao: editandoChave });
    const doArquivo = fila ? fila[col.indice] : "";
    guardarTexto(col.titulo, campo.value, doArquivo);
  }

  /* ── A MÁSCARA DO NOME ──────────────────────────────────────────────────── */
  guardarTexto(COLUNA_MASCARA.id, camposDoEditor.mascara.value,
               g ? g.nomeDoArquivo : "");

  /* ── AS TRÊS DECISÕES ───────────────────────────────────────────────────── */
  /* IGUAL AO ARQUIVO NÃO É CORREÇÃO. Sem este teste, salvar sem mexer em nada
     gravava o valor que já estava lá como se fosse uma decisão — e a fila passava a
     aparecer como corrigida (com a dica do mouse dizendo isso) sem ninguém ter
     corrigido. Correção guardada tem de significar "alguém mudou". */
  const guardarNumero = (col, campo) => {
    /* SEM CAMPO, NÃO SE MEXE: o `return` aqui é o que protege o número digitado na
       grade quando se salva pela tela do cadastro, onde a coluna não aparece. */
    if (!col || !campo) return;
    const n = paraNumeroDigitado(campo.value);
    const doArquivo = valorDaPlanilha(g || { chaveEdicao: editandoChave }, { id: col.indice });
    if (n === null || n === doArquivo) delete atual[col.titulo];
    else atual[col.titulo] = n;
  };
  guardarNumero(trava.pmk, camposDoEditor.pmk);
  guardarNumero(trava.aComprar, camposDoEditor.comprar);

  /* O MÊS: escolher "sem mês" tem de VENCER o mês que a planilha trouxe, e por isso
     o zero é guardado explicitamente quando existe mês no arquivo. Ver
     `mesQueVale`.
     SEM O CAMPO NA TELA, o mês NÃO É TOCADO — é a tela do cadastro, que não mostra
     mês. Sem este teste, salvar ali apagava a chegada que alguém tinha escolhido na
     grade: o campo ausente lê como "vazio", e vazio quer dizer "sem mês". */
  if (camposDoEditor.mes) {
    const escolhido = Number(camposDoEditor.mes.value);
    if (escolhido) atual[COLUNA_CHEGADA.id] = escolhido;
    else if (mesDaPlanilha(editandoChave)) atual[COLUNA_CHEGADA.id] = 0;
    else delete atual[COLUNA_CHEGADA.id];
  }

  const mudou = correcoesQueMudaram(correcoesDe(editandoChave), atual);
  if (Object.keys(atual).length) estado.edicoes[editandoChave] = atual;
  else delete estado.edicoes[editandoChave];
  guardarEdicoes();
  /* SÓ ANOTA SE MUDOU ALGO. Abrir a tela, olhar e apertar Guardar é o gesto mais
     comum de todos, e ele não é uma alteração — anotado, encheria o diário de dez
     linhas iguais e empurraria para fora a importação de estoque de ontem. */
  if (mudou.length) anotar("logEdicao", (g ? g.rotulo : "") || editandoChave, mudou);

  fecharEditor();
  redesenhar();
}

/** Grava (ou remove) a correção de uma célula de número. */
function guardarCorrecao(chaveEd, titulo, n) {
  const atual = { ...correcoesDe(chaveEd) };
  if (n === null) delete atual[titulo]; else atual[titulo] = n;

  if (Object.keys(atual).length) estado.edicoes[chaveEd] = atual;
  else delete estado.edicoes[chaveEd];

  guardarEdicoes();
}

/* ── A GRADE ─────────────────────────────────────────────────────────────── */

/**
 * As colunas à vista, na ordem em que se leem: o eixo (nome), o código, as
 * outras colunas de texto e por fim as MEDIDAS.
 *
 * Os números vão todos juntos na direita porque é assim que se varre uma grade:
 * um bloco de texto que identifica a fila, um bloco de número que a mede. Texto
 * intercalado entre duas medidas obriga o olho a pular por cima dele.
 */
/* ---------------------------------------------------------------------------
   QUAIS COLUNAS SE VEEM.

   Começou como um interruptor de uma coluna só — mostrar ou esconder o PMK — e
   virou uma lista: qualquer coluna se esconde. A razão é a mesma que valia para o
   PMK, e ela não é exclusiva dele: numa tela de onze colunas, quem está decidindo
   compra não quer as onze ao mesmo tempo, e a coluna que sobra é diferente para
   cada pessoa e cada semana. Escondida, ela devolve a largura dela para as que
   ficaram.

   O PMK CONTINUA OCULTO POR PADRÃO, porque continua sendo o número de planejamento
   e a leitura de todo dia é outra: o que tem, o que pediram, o que comprar.

   E AS REGRAS NÃO DEPENDEM DA VISTA: sem PMK, `A Comprar` é zero — escondendo a
   coluna, a trava segue de pé, porque ela mora em `montarGrade`, que lê as colunas
   da BASE. O mesmo vale para o Saldo Virtual: ele soma três colunas do dado, e não
   três colunas da tela.

   `null` quer dizer NUNCA ESCOLHIDO, e é diferente de conjunto vazio: no primeiro
   caso vale o padrão (o PMK fora), no segundo alguém pediu todas à vista.

   Vive no `localStorage`, como o tema e a ordem das colunas: é preferência de quem
   olha, não dado, e some com o navegador e não com a base.
--------------------------------------------------------------------------- */

const CHAVE_OCULTAS = "pc.ocultas";
let colunasOcultas = null;

function lerColunasOcultas() {
  try {
    const bruto = localStorage.getItem(CHAVE_OCULTAS);
    if (bruto) {
      const lido = JSON.parse(bruto);
      if (Array.isArray(lido)) {
        colunasOcultas = new Set(lido.filter((x) => typeof x === "string"));
        return;
      }
    }
    /* A CHAVE DO INTERRUPTOR ANTIGO É APAGADA, e não herdada.
       Ela chegou a valer aqui — "quem já tinha pedido para ver o PMK continua
       vendo" —, e o efeito prático foi o contrário do combinado: quem tinha
       experimentado o botão antigo abria a lista nova com TODAS as colunas
       marcadas, PMK inclusive. O padrão é o PMK fora, e ele tem de valer para quem
       nunca escolheu — e quem experimentou um botão que não existe mais não
       escolheu nada. Apagada, ela não volta a decidir nada em nenhuma abertura. */
    localStorage.removeItem("pc.mostrarPmk");
  } catch { colunasOcultas = null; }
}

function guardarColunasOcultas() {
  try {
    if (colunasOcultas) localStorage.setItem(CHAVE_OCULTAS, JSON.stringify([...colunasOcultas]));
    else localStorage.removeItem(CHAVE_OCULTAS);
  } catch { /* navegação privada: a escolha vale só nesta sessão */ }
}

/** O padrão: só o PMK nasce fora. */
function ocultaPorPadrao(id) {
  const pmk = colunasDaTrava().pmk;
  return Boolean(pmk) && String(id) === String(pmk.indice);
}

function estaOculta(id) {
  return colunasOcultas ? colunasOcultas.has(String(id)) : ocultaPorPadrao(id);
}

/**
 * Mostra ou esconde uma coluna.
 *
 * A ÚLTIMA NÃO SE ESCONDE. Sem esse piso, um clique a mais deixava a tabela com a
 * coluna de ações e nada mais — uma tela vazia sem nada na tela explicando por quê,
 * e a única saída seria adivinhar que a lista de colunas ainda estava ali.
 */
function alternarColuna(id) {
  const chave = String(id);
  if (!colunasOcultas) {
    colunasOcultas = new Set(colunasNaOrdem()
      .filter((c) => c.oculta).map((c) => String(c.id)));
  }
  if (colunasOcultas.has(chave)) colunasOcultas.delete(chave);
  else {
    const aVista = colunasNaOrdem().filter((c) => !c.oculta && c.tipo !== "acoes");
    if (aVista.length <= 1) return;
    colunasOcultas.add(chave);
  }
  guardarColunasOcultas();
  redesenhar();
}

function colunasNaOrdem() {
  /* A ORDEM: identificação primeiro, do mais curto ao mais longo — CÓDIGO, depois
     GRUPO (e o que mais houver de texto), e só então o NOME do produto.
     É a ordem de uma ficha, e não de uma frase: o código é o que se confere contra
     o ERP e o que se copia para o pedido, e ele estava atrás de um nome de quarenta
     caracteres, na segunda coluna, onde a vista não bate. O nome é o mais comprido
     dos três, e coluna comprida no meio empurra tudo o que vem depois. */
  const cols = [];

  /* `tituloArquivo` acompanha toda coluna da planilha: o `titulo` pode ter sido
     renomeado para a tela, e é o do arquivo que casa com as correções guardadas. */
  for (const c of colunasDe("codigo")) {
    cols.push({ id: c.indice, titulo: rotuloDaColuna(c.titulo), tituloArquivo: c.titulo, tipo: "cod" });
  }
  for (const c of colunasDe("texto")) {
    cols.push({ id: c.indice, titulo: rotuloDaColuna(c.titulo), tituloArquivo: c.titulo, tipo: "txt" });
  }

  /* A COLUNA DO PRODUTO. Ela vem depois
     da identificação e antes dos números, que é onde a leitura vira da esquerda
     (quem é) para a direita (quanto é). */
  cols.push({ id: -1, titulo: t("ejeProducto"), tipo: "txt", eixo: true });

  /* ── AS COLUNAS DE NÚMERO, NA ORDEM DA DECISÃO ────────────────────────────
     Elas seguiam a ordem do ARQUIVO, com o estoque encaixado antes do PMK e o mês
     e o saldo no fim. A ordem de hoje é a que a pessoa pediu, e ela pareia o
     PLANEJADO com o REAL em vez de agrupar por procedência:

         PMK Compra · En Stock · A Comprar · Pedido Cartera · Saldo Virtual · Mês

     Lida em pares, a fila conta a compra: planejei tanto / tenho tanto → vou
     comprar tanto / me pediram tanto → sobra tanto, e chega em tal mês. Cada
     decisão fica ao lado do fato que a justifica, que é o que se procurava ao
     ter de comparar duas colunas separadas por três outras.

     COMO: as colunas são todas reunidas e depois ORDENADAS POR PAPEL. Não é uma
     lista fixa de títulos — o arquivo pode trazer outras colunas de número, e uma
     lista fixa as deixaria de fora ou no lugar errado. O que não tem papel
     conhecido cai num degrau só (`OUTROS`), e a ordenação é ESTÁVEL, então essas
     mantêm entre si a ordem do arquivo. */
  /* O TÍTULO DO ARQUIVO, e não o traduzido: aqui se compara com as colunas da BASE,
     que trazem o nome como a planilha o escreveu. */
  const titulosDeStock = new Set(colunasDeStock().map((c) => c.tituloArquivo));
  const travaPmk = colunasDaTrava().pmk;
  const numeros = [];
  for (const c of colunasNumericas()) {
    /* AS QUE O ARQUIVO DE ESTOQUE TAMBÉM TRAZ FICAM DE FORA: quem manda no estoque
       é o arquivo de estoque, que é o recente. Sem esta exclusão, uma base que já
       tivesse "En Stock" mostraria a coluna duas vezes — uma com o número velho da
       base e outra com o novo — e as duas somariam no total. */
    if (titulosDeStock.has(c.titulo)) continue;
    numeros.push({ id: c.indice, titulo: rotuloDaColuna(c.titulo), tituloArquivo: c.titulo,
                   tipo: "num", editada: c.papel === "editable" });
  }
  const doStock = colunasDeStock();
  numeros.push(...doStock);
  if (colunasDoSaldo().completa) {
    numeros.push({ id: COLUNA_SALDO.id, titulo: t(COLUNA_SALDO.chave),
                   tipo: "num", calculada: true });
  }
  numeros.push({ id: COLUNA_CHEGADA.id, titulo: t(COLUNA_CHEGADA.chave),
                 tipo: "mes", editada: true });

  const trava = colunasDaTrava();
  const OUTROS = 40;
  const degrau = (c) => {
    if (travaPmk && c.id === travaPmk.indice) return 10;
    if (trava.aComprar && c.id === trava.aComprar.indice) return 30;
    if (c.id === COLUNA_SALDO.id) return 50;
    if (c.id === COLUNA_CHEGADA.id) return 60;
    /* O ESTOQUE E O PEDIDO SÃO ACHADOS PELO NOME, e não por vir do arquivo de
       estoque. É a mesma razão de `colunasDaTrava` procurar o PMK pelo título: a
       planilha do plano também pode trazer essas duas colunas, e aí elas têm de
       cair no mesmo lugar — quem lê a tela não sabe de qual arquivo cada coluna
       veio, e não deveria ver a ordem mudar por causa disso. */
    const titulo = String(c.tituloArquivo || c.titulo || "");
    if (/stock|estoque/i.test(titulo)) return 20;
    if (/pedido/i.test(titulo)) return 35;
    /* E se o arquivo de estoque trouxer colunas com OUTROS nomes, valem a ordem em
       que ele as traz: a primeira ao lado do PMK, a segunda ao lado do A Comprar. */
    if (c.deStock && doStock[0] && c.id === doStock[0].id) return 20;
    if (c.deStock && doStock[1] && c.id === doStock[1].id) return 35;
    return OUTROS;
  };
  /* `map`+`sort`+`map` é a ordenação estável escrita à mão: o `sort` do navegador
     é estável por norma desde 2019, mas quem lê isto não tem de saber disso para
     confiar que duas colunas de mesmo degrau não trocam de lugar. */
  cols.push(...numeros
    .map((c, i) => [degrau(c), i, c])
    .sort((a, b) => a[0] - b[0] || a[1] - b[1])
    .map((x) => x[2]));

  /* A COLUNA DE ACOES, por ultimo. Ela ja esteve na frente, e mudou a pedido: com
     dez colunas e rolagem lateral, o lapis na frente ficava longe dos numeros que
     se acabou de ler para decidir. No fim, ele esta onde a leitura da fila termina
     — leu o que tem, o que pediram e o que comprar, e ali decide. */
  cols.push({ id: COLUNA_ACOES.id, titulo: "", tipo: "acoes" });

  /* Por último, a ordem que a PESSOA arrastou. Ela vem depois de tudo porque é uma
     preferência de leitura, e não uma regra do dado: a ordem natural acima é a que
     a planilha e as decisões impõem, e esta a substitui quando existe. */
  /* A COLUNA ESCONDIDA É MARCADA, e não retirada da lista. A diferença é a ordem
     arrastada à mão: ela é uma lista de ids, e a peneira exige uma permutação EXATA
     das colunas de hoje. Tirando a coluna daqui, cada clique na lista de colunas
     mudava o conjunto e derrubava o arranjo de quem arrastou. Marcada e retirada só
     na última peneira, esconder é o que deve ser: um filtro de VISTA, aplicado
     depois de a ordem já valer. Ver `colunasAVista`. */
  for (const c of cols) {
    if (c.tipo !== "acoes" && estaOculta(c.id)) c.oculta = true;
  }
  return aplicarOrdemEscolhida(cols);
}

/**
 * As colunas QUE SE VEEM: a lista completa, menos as escondidas.
 *
 * A SEPARAÇÃO É O QUE FAZ O INTERRUPTOR DO PMK NÃO MEXER NA ORDEM ARRASTADA.
 * Quem trata de ORDEM (o arrasto, a peneira, o botão de restaurar) fala com
 * `colunasNaOrdem`, e por isso continua vendo sempre o mesmo conjunto de ids.
 * Quem DESENHA fala com esta, e não sabe que existe coluna escondida.
 */
function colunasAVista() {
  return colunasNaOrdem().filter((c) => !c.oculta);
}

/* ---------------------------------------------------------------------------
   A ORDEM DAS COLUNAS ARRASTADA À MÃO.

   Ela existe pelo mesmo motivo da coluna de unidade do Plan de Ventas: quem
   compara duas colunas quer as duas LADO A LADO, e na ordem da planilha elas
   podem estar separadas por três outras. Mudar a ordem à mão é o gesto de uma
   planilha, e é o que a pessoa tenta fazer sem pensar.

   É guardada no `localStorage`, e não no IndexedDB junto da base: é preferência de
   quem olha, não dado. Muda de máquina para máquina, e apagar a base não a leva.
--------------------------------------------------------------------------- */

const CHAVE_ORDEM = "pc.ordemColunas";

/**
 * Peneira a ordem que veio do navegador.
 *
 * O armazém é texto que qualquer um edita, e é de sessão passada: a planilha de
 * hoje pode ter outras colunas, uma pode ter sido renomeada, e uma chave repetida
 * ou faltando deixaria a grade com uma coluna em dois lugares ou em nenhum.
 *
 * A regra é dura de propósito: só vale uma PERMUTAÇÃO EXATA das colunas de hoje.
 * Qualquer outra coisa devolve a ordem natural. No pior caso a pessoa perde o
 * arranjo — nunca uma coluna.
 */
function aplicarOrdemEscolhida(cols) {
  const guardada = estado.ordemColunas;
  if (!Array.isArray(guardada) || guardada.length !== cols.length) return cols;

  const porId = new Map(cols.map((c) => [String(c.id), c]));
  const saida = [];
  const vistas = new Set();
  for (const id of guardada) {
    const chave = String(id);
    if (vistas.has(chave) || !porId.has(chave)) return cols;  /* não é permutação */
    vistas.add(chave);
    saida.push(porId.get(chave));
  }
  return saida;
}

/**
 * Move uma coluna para o lugar de outra.
 *
 * INSERE, não troca de lugar. Trocar parece equivalente e não é: arrastando a
 * primeira coluna para a última, a troca jogaria a última para o começo — duas
 * colunas mudam de lugar quando a pessoa pediu para mover uma. Inserindo, as do
 * meio escorregam um lugar e é só isso que se vê.
 *
 * O LADO em que ela entra sai da direção do arrasto: indo para a direita ela cai
 * DEPOIS do alvo, indo para a esquerda cai ANTES. É o que faz o gesto terminar
 * onde o traço de destino estava desenhado.
 */
function moverColuna(ordem, idDe, idPara) {
  const de = ordem.findIndex((x) => String(x) === String(idDe));
  const para = ordem.findIndex((x) => String(x) === String(idPara));
  if (de < 0 || para < 0 || de === para) return ordem;

  const copia = [...ordem];
  const [peca] = copia.splice(de, 1);
  /* Tirar a peça já encurtou a lista: quando ela vinha ANTES do alvo, o índice do
     alvo andou um para trás, e inserir em `para` a poria antes dele de novo. */
  copia.splice(de < para ? para : para, 0, peca);
  return copia;
}

/* ---------------------------------------------------------------------------
   O FUNIL: ESCOLHER VALORES NUMA LISTA.

   O campo de busca da coluna resolve "quero ver os que têm ISTO" e não resolve
   "quero ver ESTES QUATRO": para escolher quatro provedores numa lista de vinte,
   não existe texto que ache os quatro e mais nada. O funil abre a lista inteira,
   com busca, e marca de uma vez.

   OS DOIS FILTROS CONVIVEM na mesma coluna e são um E: o texto peneira, o funil
   escolhe. Quem usa um não precisa saber que o outro existe.

   A CHAVE DA ESCOLHA É O TEXTO QUE APARECE NA CÉLULA, e não o valor cru. Parece
   detalhe e é o que faz a lista funcionar igual em coluna de texto, de número e de
   mês: em número, "1.056.020" é o que a pessoa vê e é o que ela reconhece na lista;
   guardando o número cru, a lista mostraria uma coisa e casaria outra.
--------------------------------------------------------------------------- */

/**
 * O texto que a célula desta coluna mostra, para esta fila.
 *
 * É a mesma conta que o desenho da célula faz. Vive aqui porque o funil precisa
 * dela ANTES de existir DOM: a lista de opções é montada a partir dos dados, não
 * lida da tela.
 */
function textoDaCelula(g, col) {
  if (col.id === -1) return g.rotulo;
  if (col.tipo === "cod") return g.codigo;
  if (col.tipo === "mes") return nomeDoMes(g.chegada);
  if (col.tipo === "num") return numero(g.valores[col.id] || 0);
  return String(g.textos[col.id] ?? "");
}

/** O que está marcado no funil de uma coluna. Lista vazia = sem restrição. */
const selecaoDe = (id) => estado.selecoes[String(id)] || [];

/**
 * As opções do funil de uma coluna: os valores DISTINTOS que ela tem.
 *
 * Elas saem das filas peneiradas por todos os OUTROS filtros, menos o funil desta
 * coluna. As duas metades dessa regra importam:
 *
 *   pelos OUTROS filtros  a lista mostra o que existe no recorte em vigor, e não o
 *                         catálogo inteiro. Escolhido o grupo "Herbicidas", o funil
 *                         de provedor passa a oferecer só quem vende herbicida.
 *   MENOS o desta coluna  senão, ao desmarcar um valor ele desapareceria da própria
 *                         lista e não haveria como marcá-lo de volta.
 */
function opcoesDoFunil(col) {
  const grade = montarGrade({ ignorarSelecao: col.id });
  const vistas = new Map();
  for (const g of grade.filas) {
    const chave = textoDaCelula(g, col);
    if (!vistas.has(chave)) {
      /* A ORDEM guarda o valor cru quando ele é número, para a lista sair na ordem
         do valor e não do alfabeto ("1.056.020" antes de "895.220"). */
      vistas.set(chave, col.tipo === "num" ? (g.valores[col.id] || 0)
               : col.tipo === "mes" ? (g.chegada || 99) : chave);
    }
  }
  const opcoes = [...vistas.entries()].map(([chave, ordem]) => ({ chave, ordem }));
  opcoes.sort((a, b) => {
    if (typeof a.ordem === "number" && typeof b.ordem === "number") {
      /* Número: do maior para o menor, como a grade abre. Mês: do calendário. */
      return col.tipo === "mes" ? a.ordem - b.ordem : b.ordem - a.ordem;
    }
    return String(a.ordem).localeCompare(String(b.ordem), idioma === "pt" ? "pt-BR" : "es-PY");
  });
  return opcoes;
}

/** A ordem natural, para saber se a escolhida é diferente dela. */
function ordemNaturalIgual() {
  if (!Array.isArray(estado.ordemColunas)) return true;
  const salva = estado.ordemColunas;
  estado.ordemColunas = null;
  const natural = colunasNaOrdem().map((c) => String(c.id));
  estado.ordemColunas = salva;
  return natural.join("|") === salva.map(String).join("|");
}


/**
 * O TEXTO DA CONTAGEM DE FILAS: "332 filas", e "de 337" quando há recorte.
 *
 * Ele vive numa peça própria porque mudou de casa: era uma tarja `.pe` FORA da
 * tabela, e agora é a primeira célula do pé DELA — é o que permite os totais
 * ficarem cada um embaixo da sua coluna, coisa que uma tarja de fora não alinha.
 */
function pedacoDaContagem(grade) {
  const total = filasDaGrade().length;
  const caixa = document.createElement("span");
  const b = document.createElement("b");
  b.textContent = fmtInteiro().format(grade.filas.length);
  /* SÓ O NÚMERO. A palavra "filas" saiu a pedido, e ela era mesmo redundante: o
     número está no pé de uma tabela, na coluna do código, embaixo de trezentas
     linhas — não há o que ele possa estar contando além delas.
     O "de 337" FICA quando há recorte, e aí não é redundância: é a única coisa na
     tela que diz quantas filas o filtro escondeu. */
  caixa.append(b);
  if (total && total !== grade.filas.length) {
    caixa.appendChild(document.createTextNode(
      " " + t("deBase") + " " + fmtInteiro().format(total)));
  }
  return caixa;
}

function desenharGrade(grade) {
  const cols = colunasAVista();
  const chaveOrdem = estado.ordem.chave ?? -1;

  /* A FAIXA DE CABEÇALHO: cada rótulo é um botão que ordena as filas. */
  const trCab = $("th-cabecalho");
  trCab.innerHTML = "";
  for (const col of cols) {
    const th = document.createElement("th");
    th.scope = "col";

    /* A COLUNA DE ACOES sai daqui antes de tudo: sem rotulo, sem ordenar, sem
       funil e sem arrasto — nao e dado, e uma coluna de gesto. O `continue` vem
       antes dos ouvintes de arrasto de proposito: pendura-los e depois desligar
       `draggable` deixaria os ouvintes vivos sem alca, que e o tipo de sobra que
       um dia volta a funcionar sozinha. */
    if (col.tipo === "acoes") { th.className = "acoes"; trCab.appendChild(th); continue; }

    if (col.tipo === "num") th.className = "num";
    if (col.calculada) th.classList.add("calc");
    if (col.editada) th.classList.add(col.tipo === "mes" ? "edt-mes" : "edt");
    if (col.eixo) th.classList.add("eixo");

    /* O CABEÇALHO INTEIRO É A ALÇA. O clique continua ordenando e o arrasto move a
       coluna: são gestos diferentes, e o navegador os separa sozinho — arrastar não
       dispara clique. `dataTransfer.setData` recebe um dado qualquer porque o Firefox
       não inicia arrasto sem ele; quem guarda o que está na mão é a variável. */
    th.draggable = true;
    th.title = t("moverColuna");
    th.ondragstart = (ev) => {
      colunaNaMao = col.id;
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", String(col.id));
      th.classList.add("na-mao");
    };
    th.ondragend = () => { colunaNaMao = null; colunaAlvo = null; redesenhar(); };
    th.ondragover = (ev) => {
      /* Sem impedir o padrão, o navegador RECUSA o soltar e o arrasto não termina. */
      if (colunaNaMao === null || String(colunaNaMao) === String(col.id)) return;
      ev.preventDefault();
      if (String(colunaAlvo) === String(col.id)) return;
      colunaAlvo = col.id;
      marcarAlvo(col.id);
    };
    th.ondragleave = () => {
      /* Só apaga se o alvo ainda é esta coluna: saindo de uma para entrar na
         vizinha, os dois avisos chegam fora de ordem e o traço piscaria. */
      if (String(colunaAlvo) === String(col.id)) { colunaAlvo = null; marcarAlvo(null); }
    };
    th.ondrop = (ev) => {
      ev.preventDefault();
      if (colunaNaMao === null) return;
      const atual = colunasNaOrdem().map((c) => c.id);
      estado.ordemColunas = moverColuna(estado.ordemColunas || atual, colunaNaMao, col.id);
      guardarOrdemColunas();
      colunaNaMao = null; colunaAlvo = null;
      redesenhar();
    };
    if (String(colunaNaMao) === String(col.id)) th.classList.add("na-mao");

    const b = document.createElement("button");
    b.type = "button";
    b.className = "rotulo-col";
    /* O TÍTULO VAI NUM `span`, e não como texto solto no botão.
       O botão é `flex`, e texto solto dentro de um `flex` vira um item anônimo que
       não obedece a `min-width:0` — então ele não quebra em duas linhas e a coluna
       continua pedindo a largura do título inteiro. Com o `span`, "PEDIDO CARTERA"
       quebra e a coluna passa a pedir a largura da maior PALAVRA. */
    const titulo = document.createElement("span");
    titulo.className = "titulo-col";
    titulo.textContent = col.titulo;
    b.appendChild(titulo);
    if (col.id === chaveOrdem) {
      const seta = document.createElement("span");
      seta.className = "seta";
      seta.textContent = estado.ordem.desc ? "▼" : "▲";
      /* No número a seta vai ANTES do rótulo: a coluna é alinhada à direita, e a
         seta depois do texto acabava colada na borda da célula. */
      if (col.tipo === "num") b.prepend(seta); else b.append(seta);
    }
    /* ORDENAR É A CÉLULA INTEIRA, e não só o texto do rótulo.
       O rótulo deixou de crescer para o funil poder encostar nele, e com isso a
       área de clique dele encolheu ao tamanho da palavra. O gesto vive no `<th>`:
       o clique no rótulo sobe até aqui (um só disparo, porque o botão não tem
       handler próprio) e o clique no vazio da coluna também ordena, que é o que se
       tenta sem pensar. O funil interrompe a subida com `stopPropagation`. */
    th.onclick = () => {
      /* Clicando na coluna que já ordena, INVERTE. Numa nova coluna, começa
         DESCENDENTE se for número (o maior primeiro é o que se procura) e
         ASCENDENTE se for texto (o alfabeto começa no A). */
      if (chaveOrdem === col.id) estado.ordem = { chave: col.id, desc: !estado.ordem.desc };
      else estado.ordem = { chave: col.id, desc: col.tipo === "num" };
      guardarVista();
      redesenhar();
    };
    const fileira = document.createElement("div");
    fileira.className = "cab-fileira";
    fileira.appendChild(b);
    /* O "i" DA COLUNA CALCULADA. Ela é a única cujo número não vem de lugar
       nenhum: ninguém digitou e nenhuma planilha trouxe. Sem dizer de onde ele
       sai, "Saldo Virtual" é um número a mais para acreditar — e é justamente o
       que se leva para a reunião de compra. */
    if (col.id === COLUNA_SALDO.id) desenharInfoDoSaldo(fileira);

    /* SEM FUNIL NAS COLUNAS DE VALOR. O funil lista os valores que a coluna tem e
       se marca os que se quer: numa coluna de grupo ou de provedor são oito ou
       vinte nomes e a lista É o filtro. Numa coluna de estoque são trezentos e
       trinta números todos diferentes — uma lista tão longa quanto a tabela, em
       que escolher um número não é a pergunta que ninguém faz. Quem procura um
       valor ordena pela coluna, que é um clique no mesmo rótulo. */
    if (col.tipo !== "num") desenharFunil(fileira, col);
    th.appendChild(fileira);
    trCab.appendChild(th);
  }

  /* O PÉ DA TABELA: a contagem de filas na primeira coluna e o TOTAL de cada
     coluna de valor na coluna dele.
     Os totais moravam numa faixa colada sob o cabeçalho, e desceram a pedido. O
     motivo de estarem em cima era ficarem congelados; descendo, eles continuam —
     o pé é `sticky` no fundo da caixa que rola, exatamente como o cabeçalho é no
     alto. O que se ganha é a leitura: total é conclusão, e conclusão embaixo da
     coluna que ela fecha é onde qualquer planilha a escreve. E a faixa que sobrava
     no alto era uma segunda fila de 36px entre o rótulo e o primeiro dado. */
  const trPe = $("pe-tabela");
  trPe.innerHTML = "";
  /* A CONTAGEM VAI NA PRIMEIRA CÉLULA QUE NÃO É TOTAL, e não simplesmente na
     primeira: as colunas se arrastam, e com uma coluna de valor puxada para a
     frente a primeira célula é um total — a contagem não tinha onde ficar e
     sumia da tela. */
  let contagemPosta = false;
  for (const col of cols) {
    const td = document.createElement("td");
    if (col.tipo === "acoes") {
      td.className = "acoes";
      trPe.appendChild(td);
      continue;
    }
    if (col.tipo === "num") {
      td.className = "num total" + (col.editada ? " edt" : "") + (col.calculada ? " calc" : "");
      td.textContent = numero(grade.totalRecorte[col.id] || 0);
      /* O total da BASE INTEIRA na dica: ele é a escala contra a qual o total do
         recorte se lê, e não cabe na faixa sem virar duas linhas de número. */
      const daBase = grade.totalBase[col.id] || 0;
      td.title = col.titulo + " · " + t("deBase") + " " + numero(daBase);
    } else if (!contagemPosta) {
      /* Ela diz de quantas filas os totais ao lado são a soma, e por isso é a
         primeira coisa que se lê no pé. */
      td.className = "conta-filas";
      td.appendChild(pedacoDaContagem(grade));
      contagemPosta = true;
    }
    trPe.appendChild(td);
  }

  /* AS FILAS. São todas, sem paginação: a grade rola por dentro com o cabeçalho
     congelado, e paginar uma lista que se varre em busca de um produto obriga a
     procurar a mesma coisa em três páginas. */
  const corpo = $("corpo");
  corpo.innerHTML = "";

  if (!grade.filas.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = cols.length;
    td.className = "vazio-lista";
    td.textContent = t("nadaEncontrado");
    tr.appendChild(td);
    corpo.appendChild(tr);
  } else {
    /* Um fragmento só, e não 329 inserções na tabela: cada inserção solta obriga
       o navegador a recalcular o desenho da página inteira. */
    const frag = document.createDocumentFragment();
    for (const g of grade.filas) {
      const tr = document.createElement("tr");
      for (const col of cols) {
        const td = document.createElement("td");
        td.className = col.tipo + (col.editada ? (col.tipo === "mes" ? " edt-mes" : " edt") : "")
                       + (col.eixo ? " eixo" : "") + (col.calculada ? " calc" : "");
        if (col.tipo === "acoes") {
          desenharLapis(td, g);
        } else if (col.id === -1) {
          td.textContent = g.rotulo;
          td.title = g.rotulo;
        } else if (col.deStock) {
          /* Do arquivo de estoque: FATO, nunca editável. A dica diz de onde veio,
             porque a coluna não está na base e alguém vai procurá-la lá. */
          const v = g.valores[col.id] || 0;
          td.textContent = numero(v);
          if (!v) td.classList.add("zero");
          td.title = t("stockDeArchivo");
        } else if (col.editada) {
          desenharCelulaEditada(td, col, g);
        } else if (col.tipo === "num") {
          const v = g.valores[col.id] || 0;
          td.textContent = numero(v);
          if (!v) td.classList.add("zero");
        } else if (col.tipo === "cod") {
          td.textContent = g.codigo;
        } else {
          td.textContent = g.textos[col.id] ?? "";
        }
        tr.appendChild(td);
      }
      /* A FILA INTEIRA ABRE A EDIÇÃO, não só o lápis. O lápis existe para DIZER
         que a fila é clicável — sem ele, ninguém descobre; e uma vez sabido, mirar
         um ícone de 20px numa fila de 37px é trabalho que a fila toda dispensa.
         Só quem juntou várias filas da planilha não abre: não há um produto único
         para editar. */
      if (g.editavel) {
        tr.classList.add("clicavel");
        tr.onclick = () => abrirEditor(g.chaveEdicao);
      }
      frag.appendChild(tr);
    }
    corpo.appendChild(frag);
  }

}

/**
 * OS DOIS CARTÕES DA TELA DE ENTRADA, mostrando o que já entrou.
 *
 * Cada um diz o NOME DO ARQUIVO que carregou e quantos itens ele trouxe. O número
 * é o que permite descobrir a troca de arquivos sem abrir a grade: quem põe a
 * planilha de estoque no cartão do plano vê 329 itens onde esperava 117, e o erro
 * aparece ali, não três telas depois.
 */
function desenharCartoes() {
  const base = estado.base, stock = estado.stock;

  const pintar = (cartao, estadoDiv, carregado, arquivo, quantos) => {
    $(cartao).classList.toggle("carregado", carregado);
    /* O tirar so existe no cartao carregado: num vazio nao ha o que tirar. */
    const tirar = $("tirar-" + cartao.replace("cartao-", ""));
    tirar.hidden = !carregado;
    tirar.title = t("tirarPlanilla");
    const alvo = $(estadoDiv);
    alvo.replaceChildren();
    if (!carregado) return;

    const nome = document.createElement("span");
    nome.className = "nome";
    nome.textContent = arquivo;
    nome.title = arquivo;

    const conta = document.createElement("span");
    conta.textContent = fmtInteiro().format(quantos) + " " + t("itens");

    alvo.append(nome, conta);
  };

  pintar("cartao-plan", "estado-plan", Boolean(base),
         base ? base.arquivo : "", base ? base.filas.length : 0);
  pintar("cartao-stock", "estado-stock", Boolean(stock),
         stock ? stock.arquivo : "", stock ? Object.keys(stock.valores).length : 0);

  $("btn-gerar").disabled = !base && !stock;
}

/* ── A porta única: redesenhar ───────────────────────────────────────────── */

function redesenhar(opcoes) {
  /* A GRADE ABRE COM OS DOIS RELATÓRIOS, e não com um. Com só a base, a grade
     apareceria sem estoque nem pedido — metade da pergunta — e nada na tela diria
     que falta um arquivo. A tela de entrada fica, mostrando qual dos dois entrou. */
  /* A GRADE ABRE NO BOTÃO, e não ao terminar de carregar. Antes ela aparecia no
     instante em que o segundo arquivo entrava, e isso tirava a chance de conferir
     o que entrou — que é justamente para o que os cartões servem.
     BASTA UM ARQUIVO: a grade lista a união dos dois, então com um só ela mostra o
     que aquele traz. */
  const temAlgo = Boolean(estado.base) || Boolean(estado.stock);
  const pronto = temAlgo && estado.gerado;

  /* QUATRO TELAS, e a de carga vence as outras: sem arquivo nenhum não há produto
     para cadastrar, compra para comparar nem nada para analisar. */
  const emProdutos = pronto && estado.tela === "produtos";
  const emAnalise = pronto && estado.tela === "analise";
  $("tela-vazia").hidden = pronto;
  $("tela-grade").hidden = !pronto || emProdutos || emAnalise;
  $("tela-produtos").hidden = !emProdutos;
  $("tela-analise").hidden = !emAnalise;
  if (!pronto) return desenharCartoes();

  montarEscolha("telas", [["grade", t("telaGrade")],
                          ["analise", t("tituloAnalise")],
                          ["produtos", t("tituloProdutos")]],
                estado.tela, irParaTela);

  if (emProdutos) return desenharProdutos();
  if (emAnalise) return desenharAnalise();

  const grade = montarGrade();
  desenharTitulo();
  desenharGrade(grade);

  $("btn-limpar").hidden = !temFiltro();
  $("btn-ordem").hidden = ordemNaturalIgual();

  desenharListaDeColunas();

}

const temFiltro = () =>
  Boolean(estado.busca.trim()) || Object.values(estado.selecoes).some((v) => v && v.length);

function limparFiltros() {
  estado.busca = "";
  /* O funil entra no Limpar. Fora dele, apagar o texto e ver a tabela continuar
     recortada por uma escolha feita dez minutos antes e ja esquecida e o pior
     defeito possivel num filtro. */
  estado.selecoes = {};
  fecharFunil();
  $("busca").value = "";
  redesenhar();
}

/* ===========================================================================
   11. IMPORTAR

   Um caminho só para os dois formatos e para as duas entradas (arrasto e botão):
   é o que garante que arrastar um .csv e escolher um .xlsx no diálogo acabem no
   mesmo lugar, com as mesmas verificações.
=========================================================================== */

/**
 * QUAL DAS DUAS PLANILHAS É ESTA.
 *
 * Existe porque os dois botões aceitavam qualquer arquivo, e o estrago era grande e
 * silencioso: quem carregou o estoque (329 itens), gerou a tela e depois usou
 * "Atualizar estoque" para trazer o PLANO viu a grade cair para 117 produtos, com
 * duas colunas "A Comprar" — o plano tinha entrado no lugar do estoque e apagado
 * o estoque inteiro. O botão errado é fácil de apertar: é o único botão de importar
 * que fica à vista na barra.
 *
 * A DECISÃO SAI DOS TÍTULOS DAS COLUNAS DE NÚMERO, que é o que separa os dois
 * relatórios de verdade: o de estoque traz o que EXISTE e o que foi PEDIDO; o plano
 * traz o que foi PLANEJADO e o que se vai COMPRAR.
 *
 * Devolve `null` quando não dá para afirmar — e aí o botão que a pessoa apertou
 * decide, porque na dúvida a intenção dela é o melhor palpite que existe.
 */
function qualPlanilha(colunas) {
  const numericas = colunas
    .filter((c) => c.papel === "medida" || c.papel === "editable")
    .map((c) => c.titulo);
  const temStock = numericas.some((t) => /stock|estoque|pedido/i.test(t));
  const temPlano = numericas.some((t) => /pmk|comprar/i.test(t));
  if (temStock && !temPlano) return "stock";
  if (temPlano && !temStock) return "plano";
  return null;
}

async function importar(arquivo) {
  esconderErro();
  const nome = arquivo.name || "";
  try {
    let lido;
    if (/\.xlsx$/i.test(nome)) {
      lido = await lerXlsx(await arquivo.arrayBuffer());
    } else {
      lido = lerCsv(await arquivo.text());
    }

    const reconhecido = reconhecer(lido.filas);
    if (!reconhecido) return mostrarErro(t("erroSemFilas"), t("erroSemFilasDet"));
    if (!reconhecido.colunas.some((c) => c.papel === "medida" || c.papel === "editable")) {
      return mostrarErro(t("erroSemNumero"), t("erroSemNumeroDet"));
    }

    /* PLANILHA NO SLOT ERRADO VAI PARA O CERTO, e não sobrescreve o outro relatório.
       Ver `qualPlanilha`. O aviso conta o que aconteceu: redirecionar em silêncio
       seria fazer uma coisa diferente da que a pessoa pediu sem dizer. */
    if (qualPlanilha(reconhecido.colunas) === "stock") {
      avisar(t("trocouParaStock"));
      return adotarStock(nome, reconhecido);
    }

    adotarPlano(nome, lido, reconhecido);
  } catch (e) {
    /* O erro DIZ o que houve. "Erro ao importar" obriga quem recebeu a planilha
       de outro sistema a adivinhar se o problema é o formato, a aba ou a coluna. */
    console.error(e);
    const causa = String(e && e.message || e);
    if (causa === "sin-decompression" || causa.startsWith("compresion-")) {
      mostrarErro(t("erroNavegador"), t("erroNavegadorDet"));
    } else {
      mostrarErro(t("erroFormato"), nome + " · " + causa);
    }
  }
}

/**
 * A IMPORTAÇÃO DE ESTOQUE — a que se repete toda semana.
 *
 * A CHAVE É A PRIMEIRA COLUNA do arquivo, e é decisão: não a coluna que o
 * reconhecimento acharia mais parecida com um código, a PRIMEIRA. Numa planilha
 * exportada do ERP ela é o `ItemCode`, e amarrar a regra à posição em vez de a uma
 * heurística faz o resultado ser previsível.
 *
 * AS MEDIDAS são todas as colunas de número do arquivo. Não são nomeadas aqui: se
 * amanhã vier uma terceira, ela aparece na grade sem ninguém mexer no código.
 *
 * SOMA POR CÓDIGO, porque o mesmo item pode vir em mais de uma fila (dois
 * depósitos, dois lotes). Ficar com a última perderia o resto do estoque.
 *
 * NÃO EXIGE A BASE: os dois relatórios entram em qualquer ordem, e o cruzamento
 * acontece no desenho da grade.
 */
async function importarStock(arquivo) {
  esconderErro();
  const nome = arquivo.name || "";
  try {
    const lido = /\.xlsx$/i.test(nome)
      ? await lerXlsx(await arquivo.arrayBuffer())
      : lerCsv(await arquivo.text());

    const reconhecido = reconhecer(lido.filas);
    if (!reconhecido) return mostrarErro(t("erroSemFilas"), t("erroSemFilasDet"));

    if (!reconhecido.colunas.some((c) => c.papel === "medida" || c.papel === "editable")) {
      return mostrarErro(t("erroStockSemNumero"), t("erroStockSemNumeroDet"));
    }

    /* O MESMO DESVIO, no outro sentido: quem trouxe o PLANO pelo botão de estoque
       tinha o estoque apagado e a grade caía para os itens do plano. */
    if (qualPlanilha(reconhecido.colunas) === "plano") {
      avisar(t("trocouParaPlano"));
      return adotarPlano(nome, lido, reconhecido);
    }

    return adotarStock(nome, reconhecido);
  } catch (e) {
    console.error(e);
    const causa = String((e && e.message) || e);
    if (causa === "sin-decompression" || causa.startsWith("compresion-")) {
      mostrarErro(t("erroNavegador"), t("erroNavegadorDet"));
    } else {
      mostrarErro(t("erroFormato"), nome + " · " + causa);
    }
  }
}

/**
 * ADOTA a leitura do arquivo de ESTOQUE, FUNDINDO com o que já havia.
 *
 * FUNDE, e não substitui, e é o pedido literal de quem usa: "manter os dados que
 * foram carregados antes, não sobrepor tudo — quando carregar, apenas mudar os
 * campos que pertencem àquela planilha". Substituindo, um arquivo parcial (um
 * depósito, uma família de produtos) apagava o estoque de todos os itens que não
 * estavam nele — e nada na tela dizia que eles tinham sido zerados.
 *
 * A FUSÃO É POR ITEM E POR COLUNA:
 *   · item que veio no arquivo → os números DELE vencem, coluna por coluna;
 *   · item que não veio        → fica como estava;
 *   · coluna que não veio      → fica como estava, em todos os itens.
 * É a regra que faz cada planilha mexer só no que é dela.
 */
function adotarStock(nome, reconhecido) {
  const numericas = reconhecido.colunas.filter(
    (c) => c.papel === "medida" || c.papel === "editable");

  /* A PRIMEIRA coluna do arquivo — o menor índice entre as que sobraram. */
  const chaveCol = reconhecido.colunas.reduce(
    (menor, c) => (menor === null || c.indice < menor.indice ? c : menor), null);

  /* O NOME DO PRODUTO também é guardado, e não só os números: é o que permite um
     item que existe SÓ no arquivo de estoque aparecer na grade com nome, e não
     como um código solto. Ver `uniaoDasFilas`. */
  const colNome = reconhecido.colunas.find((c) => c.papel === "nombre") || null;
