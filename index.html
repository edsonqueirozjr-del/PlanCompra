  for (const titulo of STOCK_CANONICAS) {
    const jaTem = cols.some((c) => c.tituloArquivo === titulo)
      || naBase.some((c) => (c.papel === "medida" || c.papel === "editable")
                            && c.titulo === titulo);
    if (jaTem) continue;
    cols.push({ id: idDeStock(titulo), titulo: rotuloDaColuna(titulo), tituloArquivo: titulo,
                tipo: "num", deStock: true, sintetica: true });
  }
  return cols;
}

/* ---------------------------------------------------------------------------
   AS FILAS DA GRADE SÃO A UNIÃO DOS DOIS ARQUIVOS.

   Antes elas eram as filas da BASE, e o estoque era colado em cima das que
   casavam. O efeito colateral era grave e invisível: um produto que existe SÓ no
   arquivo de estoque simplesmente não aparecia. Na base real são 229 de 329 — dois
   terços do estoque da empresa fora da tela, sem nenhum aviso além de um número no
   canto do rodapé.

   E é justamente esse produto que a tela precisa mostrar: se ele tem estoque ou
   pedido e NÃO está no plano de compra, alguém esqueceu de planejá-lo. Escondê-lo
   é esconder a pergunta.

   COMO: para cada código que o estoque tem e a base não, nasce uma FILA VIRTUAL —
   um vetor esparso com o código e o nome nas posições que a base usaria. Ela
   atravessa o resto do código como qualquer outra fila: o agrupamento, a chave de
   edição, a correção à mão e a trava do PMK funcionam sem saber que ela é virtual.
   As colunas que só a base tem (grupo, provedor) ficam vazias nela, que é a
   verdade — aquele produto não está no plano.
--------------------------------------------------------------------------- */

/* O resultado fica guardado entre chamadas: `montarGrade` roda várias vezes por
   redesenho (uma por funil), e refazer a união a cada uma é trabalho repetido. A
   validade é testada pela IDENTIDADE dos dois objetos — os dois são substituídos
   inteiros a cada importação, então comparar a referência basta e não há como
   servir um resultado velho. */
let cacheUniao = { base: null, stock: null, filas: [], porChave: new Map() };

function uniaoDasFilas() {
  const base = estado.base, stock = estado.stock;
  if (cacheUniao.base === base && cacheUniao.stock === stock) return cacheUniao;

  const filas = base ? [...base.filas] : [];
  const porChave = new Map();

  const colCodigo = colunasDe("codigo")[0] || null;
  const colNome   = colunasDe("nombre")[0] || null;
  for (const f of filas) porChave.set(chaveDeEdicao(f, colCodigo, colNome), f);

  if (stock && stock.valores) {
    /* A fila virtual precisa de um vetor do TAMANHO da estrutura, para os índices
       das colunas caírem no lugar certo. Sem base, a estrutura é o esqueleto de duas
       colunas — ver `colunasDaBase`. */
    const cols = colunasDaBase();
    const largura = Math.max(1, ...cols.map((c) => c.indice + 1));
    for (const chave of Object.keys(stock.valores)) {
      if (porChave.has(chave)) continue;
      if (!colCodigo) continue;

      const virtual = new Array(largura).fill(null);
      virtual[colCodigo.indice] = chave;
      if (colNome) virtual[colNome.indice] = (stock.nomes && stock.nomes[chave]) || chave;
      filas.push(virtual);
      porChave.set(chave, virtual);
    }
  }

  cacheUniao = { base, stock, filas, porChave };
  return cacheUniao;
}

/** As filas que a grade mostra: as da base mais as que só o estoque tem. */
const filasDaGrade = () => uniaoDasFilas().filas;

/** Quanto o arquivo de estoque diz que existe deste item, nesta coluna. */
function valorDeStock(chave, titulo) {
  const porItem = estado.stock && estado.stock.valores;
  const doItem = porItem && chave ? porItem[chave] : null;
  const v = doItem ? doItem[titulo] : null;
  return typeof v === "number" && Number.isFinite(v) ? v : 0;
}

/**
 * O nome do mês no idioma escolhido, sem manter doze pares de tradução à mão.
 *
 * O navegador já sabe os nomes dos meses em todo idioma, e pedi-los a ele é uma
 * linha em vez de vinte e quatro entradas para alguém digitar errado um dia. Ele
 * devolve minúscula em espanhol e português ("enero", "janeiro"), e a inicial sobe
 * porque na grade o valor é um rótulo, não uma frase.
 */
function nomeDoMes(m) {
  const numero = Number(m);
  if (!numero || numero < 1 || numero > 12) return "";
  /* Dia 1 de um ano qualquer: só o mês é lido. */
  const nome = new Intl.DateTimeFormat(idioma === "pt" ? "pt-BR" : "es-PY", { month: "long" })
    .format(new Date(2026, numero - 1, 1));
  return nome.charAt(0).toUpperCase() + nome.slice(1);
}

/**
 * O MES QUE VALE para um item: o escolhido no seletor, senao o da planilha.
 *
 * A mesma regra das colunas de numero — a decisao de quem usa vence o arquivo — e
 * pelo mesmo motivo: a planilha nova chega toda semana e nao pode desfazer o que
 * alguem ja resolveu. A diferenca e que aqui o "arquivo" e uma coluna que nem
 * aparece na tela, porque ela virou este seletor.
 */
function mesQueVale(chaveEd) {
  const corrigido = correcoesDe(chaveEd);
  /* A PERGUNTA É SE A CHAVE EXISTE, não se o valor é verdadeiro.
     Um zero guardado aqui não quer dizer "nada escolhido": quer dizer "escolhido
     NENHUM mês", que é o que a opção vazia do seletor faz. Testando o valor em vez
     da chave, esse zero caía como falso e o mês da planilha voltava — a pessoa
     limpava o campo, ele reaparecia, e não havia como tirar o mês de um item que a
     planilha trouxe errado. */
  if (Object.prototype.hasOwnProperty.call(corrigido, COLUNA_CHEGADA.id)) {
    return mesGuardado(corrigido[COLUNA_CHEGADA.id]);
  }
  const daPlanilha = estado.base && estado.base.mesesDaPlanilha;
  return mesGuardado(daPlanilha ? daPlanilha[chaveEd] : 0);
}

/** O mês que a PLANILHA trouxe para um item, ignorando a escolha de quem usa. */
function mesDaPlanilha(chaveEd) {
  const mapa = estado.base && estado.base.mesesDaPlanilha;
  return mesGuardado(mapa ? mapa[chaveEd] : 0);
}

/**
 * O mês guardado para um item, como número de 1 a 12. Zero quando não há.
 *
 * ACEITA O FORMATO ANTIGO, uma data ISO completa, e devolve o mês dela. A coluna
 * já foi um campo de data antes de se saber que só o mês interessa, e quem tinha
 * datas guardadas no navegador não pode perdê-las numa atualização da página.
 */
function mesGuardado(valor) {
  if (typeof valor === "number") return valor >= 1 && valor <= 12 ? valor : 0;
  const texto = String(valor ?? "");
  const iso = texto.match(/^\d{4}-(\d{2})-\d{2}$/);
  if (iso) return Number(iso[1]);
  const n = Number(texto);
  return n >= 1 && n <= 12 ? n : 0;
}

/**
 * A CHAVE de uma fila da planilha para casar com o que foi digitado.
 *
 * O código do item quando existe; o nome quando não existe. Nunca a posição da
 * fila: a exportação do ERP não sai na mesma ordem duas vezes, e por posição o
 * valor digitado no DESTROYER reapareceria no PALAS na semana seguinte.
 */
function chaveDeEdicao(fila, colCodigo, colNome) {
  const codigo = colCodigo ? String(fila[colCodigo.indice] ?? "").trim() : "";
  if (codigo) return codigo;
  return normalizarEspacos(colNome ? fila[colNome.indice] : "");
}

/**
 * O que vale para uma fila, aplicada a regra do PMK.
 *
 * SEM PMK, `A Comprar` É ZERO — e não o que estiver digitado nele. É a regra do
 * Edson, e ela é uma trava, não um cálculo: comprar o que ninguém planejou vender
 * é como o estoque encalha. O valor digitado NÃO é apagado do armazenamento
 * quando isso acontece: se o PMK aparecer depois, o número volta em vez de ter de
 * ser digitado de novo.
 */
/** O que foi corrigido à mão para um item, ou um objeto vazio. */
const correcoesDe = (chave) => (chave && estado.edicoes[chave]) || {};

/**
 * O valor de uma célula de número: a CORREÇÃO quando existe, senão a PLANILHA.
 *
 * Esta é a regra do "une com a que vamos importar". A planilha nova chega toda
 * semana com estoque e pedido novos, e ela NÃO apaga a decisão de compra que
 * alguém já tomou — a correção continua valendo em cima do valor novo. É a mesma
 * ideia do preço que congela no plano do Plan de Ventas: o que a pessoa decidiu
 * não se recalcula porque o cadastro andou.
 *
 * `null` na correção é diferente de correção ausente: `null` NÃO existe aqui,
 * porque apagar o campo REMOVE a chave (veja a gravação da célula). Sem essa
 * distinção não haveria como voltar ao valor da planilha depois de ter corrigido.
 */
function valorDaCelula(fila, col, chaveEd) {
  const corrigido = correcoesDe(chaveEd)[col.titulo];
  if (Number.isFinite(corrigido)) return { valor: corrigido, corrigido: true };
  const bruto = fila[col.indice];
  return { valor: typeof bruto === "number" && Number.isFinite(bruto) ? bruto : 0, corrigido: false };
}

/**
 * AS DUAS COLUNAS DA TRAVA, achadas pelo título.
 *
 * A regra do Edson é "sem PMK, `A Comprar` fica zerado". Para aplicá-la a tela
 * precisa saber QUAL coluna é o PMK e QUAL é a de comprar, e os nomes variam de
 * uma exportação para outra ("PMK", "PMK - Ajustado Compra").
 *
 * A ORDEM DOS TESTES importa: "PMK - Ajustado Compra" casa com PMK e com compra
 * ao mesmo tempo. O PMK é achado primeiro, e a de comprar é procurada entre as
 * QUE SOBRARAM — senão a mesma coluna cumpriria os dois papéis e travaria a si
 * mesma.
 */
function colunasDaTrava() {
  const numericas = colunasNumericas();
  const pmk = numericas.find((c) => /pmk/i.test(c.titulo)) || null;
  const aComprar = numericas.find((c) => c !== pmk && /comprar/i.test(c.titulo)) || null;
  return { pmk, aComprar };
}

/* ===========================================================================
   8. A CONTA DA GRADE.

   Ela não vive no desenho da tela, e é de propósito: agrupar, filtrar, ordenar e
   somar são quatro coisas que se testam sozinhas e que vão migrar inteiras para o
   código de verdade. O desenho lá embaixo só recebe o resultado.
=========================================================================== */

/* ---------------------------------------------------------------------------
   AS COLUNAS SÃO DA APLICAÇÃO, e não da planilha.

   Isto mudou de ideia, e a razão é o que se via na tela: importando só o estoque, a
   grade abria com quatro colunas; importando só o plano, com outras cinco. O
   trabalho é o mesmo nos dois casos, e a tela mudava de forma conforme o arquivo
   que tinha entrado — quem abre a ferramenta não deveria ter de descobrir de que
   planilha cada coluna vem para saber se ela vai estar lá.

   Então a ESTRUTURA É FIXA. Estas colunas existem sempre:

       Código · Grupo · Provedor · Produto · PMK · En Stock
       · A Comprar · Pedido Cartera · Saldo Virtual · Llegada Estimada

   A planilha PREENCHE o que ela tem; o que ela não tem vem vazio ou zerado, e se
   digita na tela. O PMK continua nascendo oculto, como já nascia.

   COMO: para cada papel canônico que os arquivos NÃO trouxeram, nasce uma coluna
   sintética num índice depois do último do arquivo. Ela atravessa o resto do código
   como qualquer coluna de planilha cujas células estão todas vazias — a leitura de
   `fila[indice]` dá `undefined`, que já é tratado como vazio em todo lugar, e o
   valor vem das correções à mão.

   O PREÇO, dito em voz alta: a correção é guardada POR TÍTULO DE COLUNA, e o título
   da sintética é o nome da aplicação ("A Comprar"), não o do arquivo ("Á COMPRAR").
   Quem digitar num `A Comprar` sintético e DEPOIS importar um plano cujo título
   difere não verá aquele número na coluna do arquivo. É um caminho estreito (o
   plano traz os próprios valores de qualquer forma), e o alternativo — migrar
   correções de chave na importação — é máquina demais para ele.
--------------------------------------------------------------------------- */

const CANONICAS = [
  { papel: "codigo",   titulo: "Codigo",     casa: null },
  { papel: "texto",    titulo: "Grupo",      casa: /grupo/i },
  { papel: "texto",    titulo: "Provedor",   casa: /provedor|proveedor|fornecedor/i },
  { papel: "nombre",   titulo: "Producto",   casa: null },
  { papel: "editable", titulo: "PMK Compra", casa: /^\s*pmk\b/i },
  { papel: "editable", titulo: "A Comprar",  casa: /comprar/i },
];

/**
 * A estrutura de colunas que vale agora: as do arquivo, mais as que faltam.
 *
 * As sintéticas entram DEPOIS das do arquivo, em índices livres. A ordem em que a
 * grade as mostra não sai daqui — sai de `colunasNaOrdem`, que ordena por papel.
 */
function colunasDaBase() {
  const doArquivo = estado.base ? estado.base.colunas : [];
  if (!estado.base && !estado.stock) return [];

  /* OS TÍTULOS DO ARQUIVO DE ESTOQUE CONTAM na hora de decidir o que falta.
     `estado.stock.colunas` é lido direto, e não por `colunasDeStock()`: aquela
     função chama esta, e a volta seria recursão infinita.
     Sem este teste, um arquivo de estoque que trouxesse uma coluna canônica dava
     DUAS colunas com o mesmo nome na grade — foi o que aconteceu com quem importou
     o plano de compra pelo botão de estoque: "A Comprar" aparecia duas vezes. */
  const doStock = (estado.stock && Array.isArray(estado.stock.colunas))
    ? estado.stock.colunas : [];

  const saida = [...doArquivo];
  let proximo = Math.max(0, ...saida.map((c) => c.indice + 1));

  for (const q of CANONICAS) {
    /* JÁ EXISTE? Para código e nome basta o papel; para as outras, o papel E o
       nome — uma base com duas colunas de texto não dispensa o Provedor só porque
       tem Grupo. As numéricas casam contra TODA coluna de número (medida ou
       editável): "En Stock" na base é medida, e não pode virar duas colunas. */
    const existe = q.casa
      ? (doArquivo.some((c) => (q.papel === "editable"
            ? (c.papel === "medida" || c.papel === "editable")
            : c.papel === q.papel) && q.casa.test(c.titulo))
         || (q.papel === "editable" && doStock.some((titulo) => q.casa.test(titulo))))
      : doArquivo.some((c) => c.papel === q.papel);
    if (existe) continue;
    saida.push({ indice: proximo++, titulo: q.titulo, papel: q.papel, sintetica: true });
  }
  return saida;
}

const colunasDe = (papel) => colunasDaBase().filter((c) => c.papel === papel);

/**
 * TODAS as colunas de número, na ORDEM DA PLANILHA.
 *
 * Na ordem do arquivo, e não agrupadas por papel: a planilha já vem na ordem em
 * que a conta se lê (o que tem, o que pediram, o que planejaram, o que comprar), e
 * reordenar para pôr as editáveis juntas no fim quebraria exatamente a estrutura
 * que o arquivo carrega. Foi o erro da primeira versão desta tela.
 */
const colunasNumericas = () =>
  colunasDaBase()
    .filter((c) => c.papel === "medida" || c.papel === "editable")
    .sort((a, b) => a.indice - b.indice);

const medidas = () => colunasNumericas();

/**
 * Espaço estranho vira espaço normal, e espaços repetidos viram um.
 *
 * Não é firula: nesta base há um produto escrito com EN SPACE (U+2002) em volta
 * do hífen, e outro com dois espaços seguidos. Nenhum dos dois se vê na tela, e
 * os dois quebram tudo o que compara texto — a busca por "GLIFOSATO 72% WG - "
 * não acha o item, e o agrupamento trata como dois produtos o que é um.
 *
 * O texto ORIGINAL é o que aparece na tela: isto normaliza só o que se COMPARA.
 */
const normalizarEspacos = (s) =>
  String(s ?? "").replace(/[\u00a0\u2000-\u200a\u202f\u205f\u3000]/g, " ")
                 .replace(/\s+/g, " ").trim();

/**
 * A CHAVE e o ROTULO de uma fila.
 *
 * A chave e o CODIGO do item, e o rotulo e o nome do produto. Duas filas com o
 * mesmo codigo caem no mesmo grupo e SOMAM — e o grupo deixa de ser editavel,
 * porque nao ha como repartir um "A Comprar" digitado entre duas filas do arquivo.
 * Numa base sa isso nao acontece; quando acontece, e um aviso de que a exportacao
 * duplicou item, e a tela mostra a soma em vez de esconder uma das filas.
 */
function chaveDaFila(fila, colCodigo, colNome) {
  const codigoDoArquivo = colCodigo ? String(fila[colCodigo.indice] ?? "").trim() : "";
  const nome = colNome ? normalizarEspacos(fila[colNome.indice]) : "";

  /* A CHAVE E SEMPRE A DO ARQUIVO. Ela guarda as correcoes, e por isso nao pode
     depender de nada que uma correcao mude — senao a correcao se esconderia dela
     mesma. Ver `CORRECAO_CODIGO`. */
  const chave = codigoDoArquivo || nome;
  const correcoes = correcoesDe(chave);

  /* O CODIGO EFETIVO e o corrigido quando existe: e ele que aparece na tela E que
     casa com a planilha de estoque. */
  const codigo = String(correcoes[CORRECAO_CODIGO] ?? "").trim() || codigoDoArquivo;

  /* A MASCARA troca so o NOME que se le. */
  const mascara = String(correcoes[COLUNA_MASCARA.id] ?? "").trim();

  return {
    chave, codigo, codigoDoArquivo,
    rotulo: mascara || nome || codigo,
    nomeDoArquivo: nome || codigoDoArquivo,
  };
}

/** O ponto é milhar e a vírgula é decimal, como a pessoa digita nos dois idiomas. */
function paraNumeroDigitado(texto) {
  const limpo = String(texto).trim().replace(/\./g, "").replace(",", ".");
  if (limpo === "" || limpo === "-") return null;
  const n = Number(limpo);
  return Number.isFinite(n) ? n : null;
}

/** "Zafriña" e "zafrina" têm de casar: quem busca não digita acento. */
const semAcento = (s) =>
  normalizarEspacos(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

/**
 * Monta a grade: filas agrupadas pelo eixo, filtradas, ordenadas e somadas.
 *
 * O TOTAL sai em dois: o do RECORTE (o que está à vista) e o da BASE INTEIRA. É a
 * ideia da coluna Somax da comparação por unidade — um número não se lê sozinho,
 * se lê contra o todo. Com só o total do recorte, apertar um filtro dá um número
 * grande sem escala; com os dois, "812 mil dos 27 milhões" se lê de uma vez.
 */
function montarGrade(opcoes) {
  /* `ignorarSelecao` existe para o funil montar a PRÓPRIA lista de opções sem se
     excluir dela. Ver `opcoesDoFunil`. */
  const ignorar = opcoes && opcoes.ignorarSelecao !== undefined
    ? String(opcoes.ignorarSelecao) : null;

  /* SEM NADA CARREGADO não há grade; com ALGUMA COISA carregada, há.
     O teste era `if (!estado.base)`, e ele desistia da grade inteira quando só o
     arquivo de estoque tinha entrado — a tela abria vazia depois de o Gerar dizer
     que ia mostrar os dados. A estrutura de colunas para esse caso existe (ver
     `colunasDaBase`); o que faltava era esta função aceitar montar sem plano. */
  if (!estado.base && !estado.stock) {
    return { filas: [], totalRecorte: {}, totalBase: {}, medidas: [] };
  }

  const meds = medidas();
  const colCodigo = colunasDe("codigo")[0] || null;
  const colNome   = colunasDe("nombre")[0] || null;
  const textos    = colunasDe("texto");

  /* 1. AGRUPA pelo eixo. No eixo "producto" cada fila da planilha é uma fila da
        grade; nos outros, várias filas somam numa só. */
  const trava = colunasDaTrava();

  const doStock = colunasDeStock();
  /* As colunas como a grade as mostra, para o funil saber em que valor comparar.
     Não há recursão: `colunasAVista` não chama esta função. */
  const colsDaGrade = colunasAVista();

  const grupos = new Map();
  const totalBase = {};
  for (const m of meds) totalBase[m.indice] = 0;
  for (const c of doStock) totalBase[c.id] = 0;
  totalBase[COLUNA_SALDO.id] = 0;

  /* A UNIAO, e nao `base.filas`: um produto que so existe no arquivo de estoque
     tambem e uma fila da grade. Ver `uniaoDasFilas`. */
  /* OS INATIVOS SAEM DAQUI, e não do filtro lá embaixo: saindo do agrupamento, eles
     não entram em total nenhum, nem no da base — um produto que alguém desligou não
     é "escondido pelo filtro", ele está fora do assunto.
     A TELA DE PRODUTOS pede `comInativos`, porque é justamente onde eles se veem e
     se religam. */
  const comInativos = Boolean(opcoes && opcoes.comInativos);
  for (const fila of filasDaGrade()) {
    const { chave, rotulo, codigo, codigoDoArquivo, nomeDoArquivo } =
      chaveDaFila(fila, colCodigo, colNome);
    if (!comInativos && estaInativo(chave)) continue;
    let g = grupos.get(chave);
    if (!g) {
      g = { chave, rotulo, codigo, codigoDoArquivo, nomeDoArquivo,
            quantas: 0, valores: {}, textos: {},
            /* Quais células desta fila estão CORRIGIDAS à mão, para a tela poder
               marcá-las: um número que veio da planilha e um que alguém digitou
               em cima dela não são a mesma coisa, e a tela deve dizer qual é qual. */
            corrigidas: {},
            /* A chave de edição da fila, e se ela é EDITÁVEL. Um grupo que juntou
               várias filas da planilha não é: dividir um "A Comprar" digitado
               entre o balde de 5 L e o de 20 L é uma conta que ninguém pediu, e
               inventá-la seria pôr número na tela sem alguém ter decidido. */
            chaveEdicao: null, editavel: false, travadoPorFaltarPmk: false,
            chegada: 0 };
      for (const m of meds) g.valores[m.indice] = 0;
      grupos.set(chave, g);
    }
    g.quantas++;

    const chaveEd = chaveDeEdicao(fila, colCodigo, colNome);

    /* CADA COLUNA DE NÚMERO: o valor corrigido quando existe, senão o da planilha.
       A trava do PMK entra depois de todas terem valor, porque ela depende de
       outra coluna e a ordem de leitura das colunas não é garantida. */
    const daFila = {};
    for (const m of meds) daFila[m.indice] = valorDaCelula(fila, m, chaveEd);

    /* A TRAVA: sem PMK, `A Comprar` é zero — mesmo que a planilha traga valor e
       mesmo que alguém tenha digitado. Comprar o que ninguém planejou vender é
       como o estoque encalha. O valor NÃO é apagado do armazenamento: se o PMK
       aparecer na semana seguinte, o número volta sozinho. */
    const semPmk = Boolean(trava.pmk) && !daFila[trava.pmk.indice].valor;
    if (semPmk && trava.aComprar) daFila[trava.aComprar.indice] = { valor: 0, corrigido: false };

    for (const m of meds) {
      g.valores[m.indice] += daFila[m.indice].valor;
      totalBase[m.indice] += daFila[m.indice].valor;
      if (daFila[m.indice].corrigido) g.corrigidas[m.indice] = true;
    }

    if (g.quantas === 1) {
      /* O ESTOQUE É POR ITEM, não por fila: casa pela chave do grupo e entra na
         PRIMEIRA vez que o grupo aparece. Somando a cada fila, um item duplicado
         na base multiplicaria o estoque pelo número de duplicatas. */
      for (const c of doStock) {
        /* Pelo codigo EFETIVO, e nao pela chave: corrigir o codigo serve para o
           produto encontrar o estoque, e por a chave aqui faria a correcao nao ter
           efeito nenhum. */
        /* PELO TÍTULO DO ARQUIVO: é a chave com que `importarStock` guardou o
           número. O `titulo` da coluna é o rótulo traduzido, e em português ele
           procuraria "Em Estoque" num objeto onde a chave é "En Stock" — a coluna
           aparecia zerada só porque a tela mudou de língua. */
        const v = valorDeStock(g.codigo, c.tituloArquivo || c.titulo);
        g.valores[c.id] = v;
        totalBase[c.id] += v;
      }

      g.chaveEdicao = chaveEd;
      g.travadoPorFaltarPmk = semPmk;
      g.editavel = true;
      g.chegada = mesQueVale(chaveEd);
    } else {
      /* Assim que uma segunda fila cai no grupo ele deixa de ser editável, e a
         data some: não existe "a chegada" de três apresentações diferentes. */
      g.editavel = false;
      g.chegada = 0;
    }
    /* Coluna de texto que não é código nem nome: guarda o primeiro valor visto.
       Somar texto não existe, e mostrar o último faria a fila mudar de conteúdo
       conforme a ordem de leitura, que é pior do que mostrar um só. */
    for (const c of textos) {
      if (g.textos[c.indice] !== undefined) continue;
      /* A CORRECAO DE TEXTO vence o arquivo, como a dos numeros. Grupo e provedor
         se corrigem quando o cadastro do ERP esta errado ou vazio. Vazia nao conta:
         apagar o campo remove a chave, e o valor do arquivo volta. */
      const corrigido = correcoesDe(chaveEd)[c.titulo];
      if (typeof corrigido === "string" && corrigido.trim()) {
        g.textos[c.indice] = corrigido;
        g.corrigidas[c.indice] = true;
      } else if (fila[c.indice] != null) {
        g.textos[c.indice] = String(fila[c.indice]);
      }
    }
  }

  /* O SALDO, depois de os grupos estarem completos.
     Fora do laço das filas de propósito: ele soma três colunas, e duas delas
     (estoque e pedido) só têm valor final quando a fila foi lida inteira. Dentro do
     laço ele calcularia com números pela metade em qualquer base que repita item. */
  const doSaldo = colunasDoSaldo();
  if (doSaldo.completa) {
    for (const g of grupos.values()) {
      const v = (g.valores[doSaldo.stock] || 0)
              + (g.valores[doSaldo.aComprar] || 0)
              - (g.valores[doSaldo.pedido] || 0);
      g.valores[COLUNA_SALDO.id] = v;
      totalBase[COLUNA_SALDO.id] += v;
    }
  }

  /* 2. FILTRA: a busca larga do topo, e depois os filtros de cada coluna.
        `semRecorte` pula os dois, e é o que a TELA DE ANÁLISE pede: um gráfico que
        muda porque alguém deixou uma palavra na busca da outra tela mente sobre o
        que ele mostra, e não há nada nele que diga que está recortado. */
  const semRecorte = Boolean(opcoes && opcoes.semRecorte);
  const busca = semRecorte ? "" : semAcento(estado.busca.trim());
  let filas = [...grupos.values()].filter((g) => {
    /* A BUSCA VARRE A FILA INTEIRA, coluna por coluna, e não só nome e código.
       Quem digita "BLEND" está procurando o provedor; quem digita "Herbicidas", o
       grupo; quem digita "274.000", o número que viu. Restringir a duas colunas
       fazia a busca falhar em tudo o que não fosse produto — e nada na tela dizia
       por quê.
       O texto comparado é o MESMO que a célula mostra (`textoDaCelula`), então o
       número casa com o separador de milhar que está na tela, e o mês pelo nome. */
    if (busca) {
      const naFila = colsDaGrade
        .filter((c) => c.tipo !== "acoes")
        .map((c) => textoDaCelula(g, c))
        .join(" ");
      if (!semAcento(naFila).includes(busca)) return false;
    }
    /* As chaves vêm como TEXTO do objeto, sempre: "-1", "2", "@llegada". Comparar
       com o texto, e não converter para número, é o que faz "@llegada" não virar
       NaN e cair por acidente no caminho das colunas da planilha. */
    /* O FUNIL, antes do texto: ele é uma lista de igualdades, e sai mais barato
       recusar a fila aqui do que depois de comparar texto. */
    for (const col of colsDaGrade) {
      if (semRecorte) break;
      if (String(col.id) === ignorar) continue;
      const marcadas = selecaoDe(col.id);
      if (!marcadas.length) continue;   /* sem restrição */
      if (!marcadas.includes(textoDaCelula(g, col))) return false;
    }

    return true;
  });

  /* 3. ORDENA. O PADRÃO É ALFABÉTICO PELO PRODUTO.
        Já foi pela primeira medida, da maior para a menor — "quem abre a tela quer
        ver primeiro o que tem peso" —, e mudou a pedido. A razão prática vence a
        teórica: esta tela se usa para PROCURAR um produto que se tem em mente, e
        numa lista de trezentos itens procurar por nome só funciona se a lista
        estiver em ordem de nome. Quem quer o de maior peso ordena com um clique;
        quem quer um item específico não tem clique que o ache. */
  const chaveOrdem = estado.ordem.chave ?? -1;
  const desc = estado.ordem.desc;
  const med = meds.find((m) => m.indice === chaveOrdem) || ehNumericaVirtual(chaveOrdem);
  filas.sort((a, b) => {
    let r;
    if (med) {
      r = (a.valores[chaveOrdem] || 0) - (b.valores[chaveOrdem] || 0);
    } else if (chaveOrdem === COLUNA_CHEGADA.id) {
      /* O mês é NÚMERO de 1 a 12, então a ordem do calendário é a ordem
         numérica — sem depender do nome, que muda com o idioma (em espanhol
         "agosto" vem antes de "julio" no alfabeto).
         SEM MÊS vai sempre para o fim, nas duas direções: uma fila sem mês não é
         "a mais próxima", é uma fila sobre a qual ninguém decidiu, e ela no topo
         empurrava para baixo justamente as que têm prazo. */
      const va = a.chegada || 0, vb = b.chegada || 0;
      if (!va !== !vb) return va ? -1 : 1;
      r = va - vb;
    } else if (chaveOrdem === -1) {
      r = a.rotulo.localeCompare(b.rotulo, idioma === "pt" ? "pt-BR" : "es-PY");
    } else {
      r = String(a.textos[chaveOrdem] ?? "").localeCompare(
          String(b.textos[chaveOrdem] ?? ""), idioma === "pt" ? "pt-BR" : "es-PY");
    }
    /* Empate desfeito pelo nome, sempre: sem isso a ordem de duas filas de mesmo
       valor muda a cada redesenho, e a lista "pisca" sem nada ter mudado. */
    return (desc ? -r : r) || a.rotulo.localeCompare(b.rotulo);
  });

  /* 4. SOMA o recorte à vista. A coluna de DATA não entra: somar datas não dá
        número nenhum, e um total falso numa coluna ensina a não ler os totais. */
  const totalRecorte = {};
  const somar = (id) => filas.reduce((s, g) => s + (g.valores[id] || 0), 0);
  for (const m of meds) totalRecorte[m.indice] = somar(m.indice);
  for (const c of doStock) totalRecorte[c.id] = somar(c.id);
  totalRecorte[COLUNA_SALDO.id] = somar(COLUNA_SALDO.id);

  return { filas, totalRecorte, totalBase, medidas: meds, trava };
}

/* ===========================================================================
   9. A REGRA DE COMPRA.

   HOJE ELA É UMA PESSOA, e isso é a decisão, não uma etapa que falta.

   `A Comprar` é DIGITADO. A tela não calcula quanto comprar a partir de estoque,
   pedido e PMK, e não é por não saber fazer a conta: é que a conta tem mais de uma
   forma defensável (pedido menos estoque, com estoque mínimo, com prazo de
   reposição, com lote múltiplo do fornecedor, com o que já está em trânsito), e
   qual delas vale é decisão de quem compra. Uma coluna com número calculado errado
   é pior do que uma coluna em branco: ninguém confere um número que já está lá.

   A ÚNICA REGRA QUE A TELA IMPÕE é a trava do PMK: sem planejamento comercial,
   `A Comprar` fica em zero (veja `colunasDaTrava` e a aplicação em `montarGrade`).
   É uma trava, não uma conta — e ela vale mesmo quando a planilha traz valor ali.

   QUANDO A CONTA FOR DECIDIDA, o lugar dela é aqui, como uma coluna SUGERIDA ao
   lado da digitada — e não no lugar dela. A diferença importa: uma sugestão que a
   pessoa aceita ou sobrescreve deixa à vista quando a regra e o julgamento
   discordam, e é essa divergência que ensina se a regra está boa. Substituir o
   campo pela conta apaga essa informação no primeiro dia.

     const REGRA_DE_COMPRA = {
       colunas: [{ id: "sugerido", chave: "colSugerido",
                   calcular: (g, med) => ... }],
     };

   A grade já soma, ordena, filtra e exporta qualquer coluna de número: acrescentar
   uma é acrescentar uma entrada nesta lista.
=========================================================================== */

const REGRA_DE_COMPRA = { colunas: [] };
</script>
<script>
"use strict";

/* ===========================================================================
   10. O DESENHO DA TELA.

   Uma função por pedaço, e todas elas leem `estado` e não conversam entre si.
   `redesenhar()` é a única porta: qualquer mudança chama ela, e a tela inteira
   passa a concordar consigo mesma. Numa tela desta escala isso custa nada e
   remove a classe de defeito em que a faixa diz um total e o pé diz outro.
=========================================================================== */

const $ = (id) => document.getElementById(id);

/* O ARRASTO EM CURSO. Fora do `estado` de propósito: dura o gesto, não se guarda e
   não entra em conta nenhuma. No estado, ele convidaria alguém a persisti-lo. */
let colunaNaMao = null, colunaAlvo = null;

/* ── Idioma e tema, as duas escolhas da barra do topo ────────────────────── */

/* ---------------------------------------------------------------------------
   OS MENUS DE ESCOLHA da barra do topo: idioma e tema.

   UMA função para os dois, porque são a mesma coisa duas vezes: um botão que
   mostra o que está valendo e um painel com as opções. Escritos separados, as duas
   cópias divergiriam na primeira correção.

   Eles substituem dois `<select>` com a setinha redesenhada. O motivo de sair não
   foi só aparência: a largura de um `select` é decidida pelo navegador, e "Somax"
   aparecia cortado como "Soma▾" na barra.
--------------------------------------------------------------------------- */

/* Qual menu está aberto, para o clique fora saber o que fechar. */
let escolhaAberta = null;

function fecharEscolhas() {
  for (const nome of ["idioma", "tema", "telas", "medida"]) {
    $("menu-" + nome).hidden = true;
    $("btn-" + nome).setAttribute("aria-expanded", "false");
  }
  escolhaAberta = null;
}

/**
 * Monta (ou remonta) um menu de escolha.
 *
 * @param nome    sufixo dos ids: `btn-<nome>`, `rotulo-<nome>`, `menu-<nome>`
 * @param itens   [[valor, rótulo], ...] — já traduzidos
 * @param agora   o valor em vigor
 * @param escolher  o que fazer com o valor escolhido
 */
function montarEscolha(nome, itens, agora, escolher) {
  const botao = $("btn-" + nome), painel = $("menu-" + nome);
  const atual = itens.find(([v]) => v === agora) || itens[0];
  /* O BOTÃO PODE NÃO TER RÓTULO: o das telas é a marca, e ela não vira o nome da
     tela em que se está — quem troca de tela vê o título dela logo abaixo. */
  const rot = $("rotulo-" + nome);
  if (rot) rot.textContent = atual ? atual[1] : "";

  painel.replaceChildren();
  for (const [valor, rotulo] of itens) {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "item-escolha" + (valor === agora ? " agora" : "");
    item.setAttribute("role", "option");
    item.setAttribute("aria-selected", String(valor === agora));
    const tique = document.createElement("span");
    tique.className = "tique";
    tique.setAttribute("aria-hidden", "true");
    const texto = document.createElement("span");
    texto.textContent = rotulo;
    item.append(tique, texto);
    item.onclick = () => { fecharEscolhas(); escolher(valor); };
    painel.appendChild(item);
  }

  botao.onclick = (ev) => {
    ev.stopPropagation();
    const abrindo = painel.hidden;
    fecharEscolhas();
    if (!abrindo) return;
    painel.hidden = false;
    botao.setAttribute("aria-expanded", "true");
    escolhaAberta = nome;
  };
}

function aplicarIdioma() {
  document.documentElement.lang = idioma;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll("[data-t-aria]")) el.setAttribute("aria-label", t(el.dataset.tAria));
  $("busca").placeholder = t("buscar");
  $("busca-prod").placeholder = t("buscarProduto");

  /* OS DOIS MENUS SÃO REMONTADOS a cada troca de idioma: os rótulos do tema são
     traduzidos, e o do idioma tem de passar a mostrar o que acabou de ser escolhido.
     O do idioma NÃO se traduz — "Español" se escreve Español em qualquer língua, e
     um idioma escrito na língua que a pessoa não fala não se acha na lista. */
  montarEscolha("idioma", [["es", "Español"], ["pt", "Português"]], idioma, (valor) => {
    idioma = valor;
    try { localStorage.setItem("pc.idioma", idioma); } catch (e) { /* aba privada */ }
    aplicarIdioma();
    redesenhar();
  });

  /* O relógio e as ações do diário são texto de sistema: mudam de língua junto. */
  if ($("btn-diario")) desenharDiario();

  const temaAgora = document.documentElement.dataset.theme
    || localStorage.getItem("pc.tema") || "somax";
  montarEscolha("tema", [["somax", t("temaSomax")], ["claro", t("temaClaro")],
                         ["escuro", t("temaEscuro")]], temaAgora, aplicarTema);
}

function aplicarTema(tema) {
  document.documentElement.dataset.theme = tema;
  try { localStorage.setItem("pc.tema", tema); } catch (e) { /* aba privada */ }
  /* O MENU É REMONTADO para o tique andar junto: sem isto, trocar de tema pintava a
     tela toda e deixava a marca na opção anterior. `montarEscolha` existe, mas só
     depois de a página montar — na primeira chamada, na abertura, o painel do menu
     ainda não está no DOM. */
  if ($("menu-tema")) {
    montarEscolha("tema", [["somax", t("temaSomax")], ["claro", t("temaClaro")],
                           ["escuro", t("temaEscuro")]], tema, aplicarTema);
  }
}

/* ── O aviso do que acabou de acontecer, perto do comando que o fez ─────── */

let relogioAviso = null;
function avisar(texto) {
  $("aviso").textContent = texto;
  clearTimeout(relogioAviso);
  relogioAviso = setTimeout(() => { $("aviso").textContent = ""; }, 3200);
}

function mostrarErro(titulo, detalhe) {
  $("erro-titulo").textContent = titulo;
  $("erro-detalhe").textContent = detalhe || "";
  $("tarja-erro").hidden = false;
}
const esconderErro = () => { $("tarja-erro").hidden = true; };

/* ── A FAIXA: o título e os números do recorte ───────────────────────────── */

/* ===========================================================================
   A TELA DE PRODUTOS: o cadastro.

   Ela responde outra pergunta que não a da grade. A grade pergunta "quanto
   comprar"; esta pergunta "quem é este produto" — o nome que aparece na tela, o
   fornecedor, o grupo, o código, e se ele é assunto ou não.

   AS FILAS SAEM DA MESMA `montarGrade`, com `comInativos`. Não há segunda fonte de
   verdade: é a mesma união dos dois arquivos, as mesmas correções à mão e a mesma
   chave de produto — e é por isso que editar aqui aparece na grade e vice-versa.
=========================================================================== */

/* Os desligados aparecem? Na tela de produtos é uma escolha de quem olha, e por
   isso vive aqui e não nas correções. */
let verInativos = false;

/* ===========================================================================
   A TELA DE ANÁLISE.

   A grade responde produto por produto; aqui a mesma base se lê SOMADA, e as
   perguntas são de conjunto: quando chega o que se vai comprar, de quem, de que
   grupo, e quais produtos pesam.

   ELA NÃO RESPEITA O RECORTE DA GRADE (`semRecorte`). Um gráfico que muda porque
   alguém deixou uma palavra na busca da outra tela mente sobre o que ele mostra, e
   não há nada nele que diga que está recortado. O que ela respeita é o ATIVO: um
   produto desligado está fora do assunto, e portanto fora da conta.

   NENHUMA BIBLIOTECA. As barras são caixas com altura proporcional — um `flex` com
   `align-items:flex-end` É um gráfico de barras — e a rosca é um círculo de SVG por
   fatia, com `stroke-dasharray`. É o que mantém a página num arquivo só.
=========================================================================== */

const CORES_CAT = 8;

/** Qual medida a tela está analisando. Vive aqui: é escolha de leitura. */
let medidaAnalise = null;

/** As medidas que se pode analisar: as colunas de número à vista, na ordem delas. */
function medidasDaAnalise() {
  return colunasNaOrdem().filter((c) => c.tipo === "num");
}

/**
 * A medida em vigor.
 *
 * O PADRÃO É `A COMPRAR`, e não a primeira coluna: a tela existe para responder
 * quando e de quem entra o que se vai comprar, e essa é a coluna da decisão. A
 * primeira da ordem é o PMK, que além de ser o planejado nasce OCULTO na grade —
 * abrir o painel analisando justamente a coluna que a pessoa escolheu não ver seria
 * responder outra pergunta.
 *
 * AS OCULTAS CONTINUAM NA LISTA de opções: esconder é preferência de leitura DA
 * GRADE, e aqui a leitura é outra.
 */
function medidaEmVigor() {
  const todas = medidasDaAnalise();
  const escolhida = todas.find((c) => String(c.id) === String(medidaAnalise));
  if (escolhida) return escolhida;
  const comprar = colunasDaTrava().aComprar;
  return (comprar && todas.find((c) => String(c.id) === String(comprar.indice)))
    || todas[0] || null;
}

/** Soma uma medida por chave de agrupamento, e devolve as fatias ordenadas. */
function somarPor(filas, medida, chaveDe) {
  const somas = new Map();
  for (const g of filas) {
    const chave = chaveDe(g);
    somas.set(chave, (somas.get(chave) || 0) + (g.valores[medida.id] || 0));
  }
  const fatias = [...somas.entries()]
    .map(([nome, valor]) => ({ nome, valor }))
    .filter((f) => f.valor > 0);
  fatias.sort((a, b) => b.valor - a.valor);
  const total = fatias.reduce((acc, f) => acc + f.valor, 0);
  for (let i = 0; i < fatias.length; i++) {
    fatias[i].pct = total ? (fatias[i].valor / total) * 100 : 0;
    fatias[i].cor = "var(--cat-" + ((i % CORES_CAT) + 1) + ")";
  }
  return { fatias, total };
}

/** Um teto redondo acima do maior valor, para a escala não terminar no dado. */
function tetoDaEscala(maior) {
  if (maior <= 0) return 1;
  const casa = Math.pow(10, Math.floor(Math.log10(maior)));
  for (const passo of [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10]) {
    if (maior <= casa * passo) return casa * passo;
  }
  return casa * 10;
}

/**
 * Um gráfico de barras verticais.
 *
 * `itens` são {nome, valor}. A altura é a fração do TETO da escala, e não do maior
 * valor: com o maior colado no topo não sobra onde escrever o número dele, que é
 * justamente o que se quer ler.
 */
function desenharBarras(onde, itens, gesto) {
  gesto = gesto || {};
  const alvo = $(onde);
  alvo.replaceChildren();
  const caixa = document.createElement("div");
  caixa.className = "barras";

  const teto = tetoDaEscala(Math.max(0, ...itens.map((i) => i.valor)));

  const area = document.createElement("div");
  area.className = "barras-area";
  const grade = document.createElement("div");
  grade.className = "barras-grade";
  const escala = document.createElement("div");
  escala.className = "barras-escala";
  for (const fracao of [1, 0.75, 0.5, 0.25, 0]) {
    const marca = document.createElement("span");
    marca.textContent = fracao ? numero(teto * fracao) : "0";
    escala.appendChild(marca);
  }
  area.append(grade, escala);

  for (const item of itens) {
    const col = document.createElement("div");
    /* APAGADA quando há escolha em vigor e ela não é esta: é o desenho que diz o que
       está recortando as outras visões. Ver `desenharAnalise`. */
    const escolhida = gesto.escolhido ? gesto.escolhido(item) : null;
    col.className = "barra-col" + (item.valor ? "" : " vazia")
      + (gesto.aoClicar ? " clicavel" : "")
      + (escolhida === false ? " apagado" : "");
    const val = document.createElement("span");
    val.className = "val";
    val.textContent = numero(item.valor);
    const haste = document.createElement("div");
    haste.className = "haste";
    haste.style.height = (item.valor / teto * 100).toFixed(2) + "%";
    if (item.cor) haste.style.background = item.cor;
    col.append(val, haste);
    col.title = item.nome + ": " + numero(item.valor);
    if (gesto.aoClicar) col.onclick = () => gesto.aoClicar(item);
    area.appendChild(col);
  }

  const pes = document.createElement("div");
  pes.className = "barras-pes";
  for (const item of itens) {
    const rot = document.createElement("span");
    rot.textContent = item.nome;
    pes.appendChild(rot);
  }

  caixa.append(area, pes);
  alvo.appendChild(caixa);
}

/** A rosca, com a legenda ao lado: valor e porcentagem de cada fatia. */
function desenharRosca(onde, fatias, total, gesto) {
  gesto = gesto || {};
  const alvo = $(onde);
  alvo.replaceChildren();
  if (!fatias.length) {
    const vazio = document.createElement("p");
    vazio.className = "bi-vazio";
    vazio.textContent = t("nadaEncontrado");
    alvo.appendChild(vazio);
    return;
  }

  const caixa = document.createElement("div");
  caixa.className = "rosca";

  /* O RAIO E A ESPESSURA saem de uma conta só: a circunferência é 2πr, e é ela que
     o `stroke-dasharray` reparte entre as fatias. Com r = 60, ela dá ~377. */
  const R = 60;
  const VOLTA = 2 * Math.PI * R;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 150 150");
  svg.setAttribute("aria-hidden", "true");

  let girado = 0;
  for (const f of fatias) {
    const escolhida = gesto.escolhido ? gesto.escolhido(f) : null;
    const arco = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    if (escolhida === false) arco.setAttribute("opacity", "0.28");
    if (gesto.aoClicar) {
      arco.style.cursor = "pointer";
      arco.onclick = () => gesto.aoClicar(f);
    }
    arco.setAttribute("cx", "75");
    arco.setAttribute("cy", "75");
    arco.setAttribute("r", String(R));
    arco.setAttribute("fill", "none");
    arco.setAttribute("stroke", f.cor);
    arco.setAttribute("stroke-width", "26");
    const pedaco = VOLTA * (f.valor / total);
    arco.setAttribute("stroke-dasharray", pedaco.toFixed(2) + " " + VOLTA.toFixed(2));
    arco.setAttribute("stroke-dashoffset", (-girado).toFixed(2));
    svg.appendChild(arco);
    girado += pedaco;
  }

  const legenda = document.createElement("div");
  legenda.className = "rosca-legenda";
  for (const f of fatias) {
    const escolhida = gesto.escolhido ? gesto.escolhido(f) : null;
    const item = document.createElement("div");
    item.className = "rosca-item" + (gesto.aoClicar ? " clicavel" : "")
      + (escolhida === false ? " apagado" : "");
    if (gesto.aoClicar) item.onclick = () => gesto.aoClicar(f);
    const bola = document.createElement("span");
    bola.className = "bolinha";
    bola.style.background = f.cor;
    const nome = document.createElement("span");
    nome.className = "nome";
    nome.textContent = f.nome || t("vazioDaLista");
    nome.title = nome.textContent;
    const val = document.createElement("span");
    val.className = "val";
    val.textContent = numero(f.valor);
    const pct = document.createElement("span");
    pct.className = "pct";
    pct.textContent = f.pct.toFixed(0) + "%";
    item.append(bola, nome, val, pct);
    legenda.appendChild(item);
  }

  caixa.append(svg, legenda);
  alvo.appendChild(caixa);
}

/** Barras horizontais: nome, barra com a porcentagem dentro, valor à direita. */
function desenharBarrasH(onde, fatias, quantas, gesto) {
  gesto = gesto || {};
  const alvo = $(onde);
  alvo.replaceChildren();
  const lista = fatias.slice(0, quantas || 12);
  if (!lista.length) {
    const vazio = document.createElement("p");
    vazio.className = "bi-vazio";
    vazio.textContent = t("nadaEncontrado");
    alvo.appendChild(vazio);
    return;
  }

  const caixa = document.createElement("div");
  caixa.className = "barras-h";
  /* A LARGURA É RELATIVA AO MAIOR DA LISTA, e não ao total: com barras de 3% e 38%
     medidas contra o total, as pequenas viram um risco e a lista deixa de comparar.
     A PORCENTAGEM ESCRITA continua sendo a do total, que é o que ela quer dizer. */
  const maior = Math.max(...lista.map((f) => f.valor)) || 1;

  for (const f of lista) {
    const escolhida = gesto.escolhido ? gesto.escolhido(f) : null;
    const linha = document.createElement("div");
    linha.className = "barra-h" + (gesto.aoClicar ? " clicavel" : "")
      + (escolhida === false ? " apagado" : "");
    if (gesto.aoClicar) linha.onclick = () => gesto.aoClicar(f);
    const nome = document.createElement("span");
    nome.className = "nome";
    nome.textContent = f.nome || t("vazioDaLista");
    nome.title = nome.textContent;
    const trilha = document.createElement("div");
    trilha.className = "trilha";
    const cheio = document.createElement("div");
    cheio.className = "cheio";
    cheio.style.width = (f.valor / maior * 100).toFixed(2) + "%";
    cheio.style.background = f.cor;
    const fim = f.valor / maior * 100;
    const pct = document.createElement("span");
    /* Passando de 82% da trilha não sobra claro à direita para a porcentagem: ela
       vira branca e entra na ponta de dentro da barra. */
    pct.className = "pct" + (fim > 82 ? " dentro" : "");
    pct.style.left = fim.toFixed(2) + "%";
    pct.textContent = f.pct.toFixed(0) + "%";
    trilha.append(cheio, pct);
    const val = document.createElement("span");
    val.className = "val";
    val.textContent = numero(f.valor);
    linha.append(nome, trilha, val);
    caixa.appendChild(linha);
  }
  alvo.appendChild(caixa);
}

/** O ranking de produtos: posição, nome, valor e fatia do total. */
function desenharRanking(onde, filas, medida, total, gesto) {
  gesto = gesto || {};
  const alvo = $(onde);
  alvo.replaceChildren();
  const caixa = document.createElement("div");
  caixa.className = "ranking";
  const tabela = document.createElement("table");
  const corpo = document.createElement("tbody");

  const ordenadas = [...filas]
    .filter((g) => (g.valores[medida.id] || 0) > 0)
    .sort((a, b) => (b.valores[medida.id] || 0) - (a.valores[medida.id] || 0));

  if (!ordenadas.length) {
    const vazio = document.createElement("p");
    vazio.className = "bi-vazio";
    vazio.textContent = t("nadaEncontrado");
    alvo.appendChild(vazio);
    return;
  }

  ordenadas.forEach((g, i) => {
    const v = g.valores[medida.id] || 0;
    const escolhida = gesto.escolhido ? gesto.escolhido(g) : null;
    const tr = document.createElement("tr");
    if (gesto.aoClicar) {
      tr.className = "clicavel";
      tr.onclick = () => gesto.aoClicar(g);
    }
    if (escolhida === false) tr.classList.add("apagado");
    const pos = document.createElement("td");
    pos.className = "pos";
    pos.textContent = String(i + 1);
    const nome = document.createElement("td");
    nome.className = "nome";
    nome.textContent = g.rotulo;
    nome.title = g.rotulo + "  ·  " + g.codigo;
    const val = document.createElement("td");
    val.className = "val";
    val.textContent = numero(v);
    const pct = document.createElement("td");
    pct.className = "pct";
    pct.textContent = total ? (v / total * 100).toFixed(2).replace(".", ",") + "%" : "";
    tr.append(pos, nome, val, pct);
    corpo.appendChild(tr);
  });

  tabela.appendChild(corpo);
  caixa.appendChild(tabela);
  alvo.appendChild(caixa);
}

/* ---------------------------------------------------------------------------
   O CRUZAMENTO ENTRE AS VISOES.

   Clicar num grupo, num fornecedor ou num mês RECORTA AS OUTRAS VISÕES: é a
   pergunta seguinte que qualquer painel provoca — "e dentro de Herbicidas, quando
   chega?" — e sem isso a resposta era abrir a grade e filtrar à mão.

   A REGRA DE OURO: cada visão fica FORA DO PRÓPRIO RECORTE. Se o grupo escolhido
   também recortasse a rosca, ela passaria a mostrar uma fatia de 100% — que não diz
   nada e, pior, esconde o caminho de volta. Então a rosca mostra sempre todos os
   grupos, com o escolhido aceso e os outros apagados, e são as OUTRAS visões que
   respondem só por ele. É a mesma regra que o funil de coluna já usava para montar
   a própria lista (ver `opcoesDoFunil`).

   CLICAR NO ESCOLHIDO DESFAZ. Não há botão de "desmarcar este": o mesmo gesto que
   marcou é o que solta, e as pastilhas no alto dizem o que está em vigor com um X
   para quem preferir tirar de lá.
--------------------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
   AS QUATRO DIMENSÕES DO RECORTE.

   Cada uma sabe LER o seu valor de uma fila, e é só isso. A lista de valores
   escolhidos vive em `estado.recorteAnalise`, com estas mesmas chaves — é o que faz
   o painel de funil (que lê `ctx.selecoes()[col.id]`) servir aqui sem tradução.

   A ORDEM É A DA PERGUNTA: de que GRUPO, de que FORNECEDOR, qual PRODUTO, em que
   MÊS. Ela vale para os botões da barra e para as pastilhas.

   O MÊS É GUARDADO PELO NOME, e não pelo número: assim ele passa pelo mesmo funil
   que os outros três, com busca e `(Todos)`, sem um caminho especial só para ele.
--------------------------------------------------------------------------- */

function dimensoesDaAnalise() {
  const cols = colunasNaOrdem();
  const colGrupo = cols.find((c) => c.tipo === "txt"
    && /grupo/i.test(c.tituloArquivo || c.titulo));
  const colProv = cols.find((c) => c.tipo === "txt" && c !== colGrupo && !c.eixo);

  return [
    { id: "a:grupo", titulo: colGrupo ? colGrupo.titulo : t("porGrupo"),
      valor: (g) => (colGrupo ? String(g.textos[colGrupo.id] ?? "").trim() : "") },
    { id: "a:provedor", titulo: colProv ? colProv.titulo : t("colProvedor"),
      valor: (g) => (colProv ? String(g.textos[colProv.id] ?? "").trim() : "") },
    { id: "a:produto", titulo: t("ejeProducto"), valor: (g) => g.rotulo },
    { id: "a:mes", titulo: t(COLUNA_CHEGADA.chave),
      valor: (g) => (g.chegada ? nomeDoMes(g.chegada) : "") },
  ];
}

const dimensaoDaAnalise = (id) => dimensoesDaAnalise().find((d) => d.id === id) || null;

/**
 * As filas da análise, recortadas.
 *
 * `ignorar` deixa UMA dimensão de fora — é o que cada visão pede para a sua própria:
 * se o grupo escolhido também recortasse a rosca, ela mostraria uma fatia de 100%,
 * que não diz nada e esconde o caminho de volta. Os FUNIS DA BARRA passam o id da
 * dimensão deles pelo mesmo motivo: senão, marcando um valor, a lista passaria a ter
 * só ele e não haveria como marcar outro.
 *
 * LISTA VAZIA É "TODOS". A string vazia dentro da lista é um recorte de verdade — o
 * grupo em branco, o produto sem mês —, e é por isso que o teste é o tamanho da
 * lista e não a verdade do valor.
 */
function filasDaAnalise(ignorar) {
  const r = estado.recorteAnalise;
  const dims = dimensoesDaAnalise().filter((d) => d.id !== String(ignorar));
  return montarGrade({ semRecorte: true }).filas.filter((g) => {
    for (const d of dims) {
      const escolhidas = r[d.id];
      if (escolhidas && escolhidas.length && !escolhidas.includes(d.valor(g))) return false;
    }
    return true;
  });
}

const temRecorteDeAnalise = () =>
  dimensoesDaAnalise().some((d) => (estado.recorteAnalise[d.id] || []).length);

/**
 * Marca UM valor de uma dimensão, do jeito que um clique num gráfico marca.
 *
 * CLIQUE NUM GRÁFICO ESCOLHE SÓ AQUELE, e clicar no que já está só ele desfaz. É
 * diferente do funil, que é de seleção múltipla — e é de propósito: o clique no dado
 * é um gesto de exploração ("mostra-me este"), e o funil é um gesto de recorte
 * ("estes cinco"). Os dois escrevem na mesma lista.
 */
function recortarAnalise(id, valores) {
  const r = estado.recorteAnalise;
  const atual = r[id] || [];
  const iguais = atual.length === valores.length && valores.every((v) => atual.includes(v));
  r[id] = iguais ? [] : valores;
  desenharAnalise();
}

function limparRecorteDaAnalise() {
  for (const d of dimensoesDaAnalise()) estado.recorteAnalise[d.id] = [];
  desenharAnalise();
}

/* O contexto do funil da análise. Ver `CTX_GRADE`: aqui as escolhas são as do
   recorte, as opções saem das filas já recortadas pelas OUTRAS dimensões, e o
   repintar é o do painel inteiro. */
const CTX_ANALISE = {
  selecoes: () => estado.recorteAnalise,
  opcoes: (col) => {
    const d = dimensaoDaAnalise(col.id);
    if (!d) return [];
    const vistos = new Set();
    for (const g of filasDaAnalise(d.id)) vistos.add(d.valor(g));
    return [...vistos]
      .sort((a, b) => {
        /* O MÊS SAI NA ORDEM DO CALENDÁRIO, e não do alfabeto: em espanhol "agosto"
           vem antes de "julio", e uma lista de meses fora de ordem é uma lista que
           se lê procurando. */
        if (d.id === "a:mes") return (mesDoNome(a) || 99) - (mesDoNome(b) || 99);
        return String(a).localeCompare(String(b), idioma === "pt" ? "pt-BR" : "es-PY");
      })
      .map((chave) => ({ chave, ordem: chave }));
  },
  repintar: (col, desmarcado) => {
    desenharAnalise();
    const botao = $("filtros-analise").querySelector('[data-dim="' + col.id + '"] .funil');
    if (botao) abrirFunil(col, botao, desmarcado, CTX_ANALISE);
  },
};

/** O número do mês a partir do nome, para a lista sair na ordem do calendário. */
function mesDoNome(nome) {
  for (let m = 1; m <= 12; m++) if (nomeDoMes(m) === nome) return m;
  return 0;
}

/**
 * Os quatro botões de filtro da barra.
 *
 * O RÓTULO DIZ O QUE ESTÁ ESCOLHIDO: "Todos" quando não há recorte, o nome quando é
 * um só, e quantos são quando são vários. É o que permite ler a barra e saber do que
 * a tela está falando sem abrir funil nenhum.
 */
function desenharFiltrosDaAnalise() {
  const caixa = $("filtros-analise");
  caixa.replaceChildren();

  for (const d of dimensoesDaAnalise()) {
    const escolhidas = estado.recorteAnalise[d.id] || [];
    const bloco = document.createElement("div");
    bloco.className = "filtro-bi" + (escolhidas.length ? " ativo" : "");
    bloco.dataset.dim = d.id;

    const rot = document.createElement("span");
    rot.className = "rot";
    rot.textContent = d.titulo;

    const val = document.createElement("b");
    val.textContent = !escolhidas.length ? t("todosDaLista2")
      : escolhidas.length === 1 ? (escolhidas[0] || t("vazioDaLista"))
      : fmtInteiro().format(escolhidas.length) + " " + t("escolhidos");
    val.title = escolhidas.join("  ·  ");

    bloco.append(rot, val);
    /* O FUNIL É O MESMO das colunas da grade, com o contexto da análise. */
    desenharFunil(bloco, d, CTX_ANALISE);
    caixa.appendChild(bloco);
  }
}

function desenharAnalise() {
  const medida = medidaEmVigor();
  const dims = dimensoesDaAnalise();
  const dGrupo = dims[0], dProv = dims[1], dProd = dims[2], dMes = dims[3];
  const r = estado.recorteAnalise;

  /* O SELETOR DE MEDIDA. Ele é a única escolha que não é um recorte, e por isso a
     tela responde as mesmas perguntas sobre o estoque, o pedido, a compra ou o saldo
     sem ter quatro painéis. */
  const medidas = medidasDaAnalise();
  montarEscolha("medida", medidas.map((c) => [String(c.id), c.titulo]),
                medida ? String(medida.id) : "", (valor) => {
                  medidaAnalise = valor;
                  desenharAnalise();
                });
  desenharFiltrosDaAnalise();
  $("btn-limpar-analise").hidden = !temRecorteDeAnalise();

  if (!medida) {
    $("numeros-analise").replaceChildren();
    for (const onde of ["bi-mensal", "bi-trimestral", "bi-rosca", "bi-provedor", "bi-ranking"]) {
      const alvo = $(onde);
      alvo.replaceChildren();
      const p = document.createElement("p");
      p.className = "bi-vazio";
      p.textContent = t("semAnalise");
      alvo.appendChild(p);
    }
    return;
  }

  /* CADA VISÃO RECEBE O RECORTE MENOS O DELA. Ver `filasDaAnalise`. */
  const paraGrupo = filasDaAnalise(dGrupo.id);
  const paraProv = filasDaAnalise(dProv.id);
  const paraMes = filasDaAnalise(dMes.id);
  const cheias = filasDaAnalise(null);

  const porGrupo = somarPor(paraGrupo, medida, dGrupo.valor);
  const porProv = somarPor(paraProv, medida, dProv.valor);

  /* ── A FAIXA fala do recorte inteiro: ela é o "onde estou", e por isso é a única
        que não ignora dimensão nenhuma.
        O PMK VEM PRIMEIRO, sempre, e não só quando é a medida escolhida: ele é o
        planejamento contra o qual a compra se lê, e a pergunta "estou comprando mais
        ou menos do que planejei" não deveria custar uma troca de medida. */
  const somar = (filas, id) => filas.reduce((acc, g) => acc + (g.valores[id] || 0), 0);
  const total = somar(cheias, medida.id);
  const trava = colunasDaTrava();

  const faixa = $("numeros-analise");
  faixa.replaceChildren();
  const numeros = [];
  if (trava.pmk) {
    numeros.push([rotuloDaColuna(trava.pmk.titulo), numero(somar(cheias, trava.pmk.indice))]);
  }
  numeros.push([t("productos"), fmtInteiro().format(cheias.length)]);
  numeros.push([t("grupos"),
    fmtInteiro().format(new Set(cheias.map(dGrupo.valor).filter(Boolean)).size)]);
  numeros.push([t("provedores"),
    fmtInteiro().format(new Set(cheias.map(dProv.valor).filter(Boolean)).size)]);
  /* A MEDIDA ESCOLHIDA, se ela já não for o PMK — repetir a mesma coluna duas vezes
     na mesma faixa faria alguém procurar a diferença entre os dois números. */
  if (!trava.pmk || String(medida.id) !== String(trava.pmk.indice)) {
    numeros.push([medida.titulo, numero(total)]);
  }
  for (const [rot, val] of numeros) {
    const d = document.createElement("div");
    d.className = "faixa-numero";
    const rt = document.createElement("span"); rt.className = "rot"; rt.textContent = rot;
    const v = document.createElement("span"); v.className = "val"; v.textContent = val;
    d.append(rt, v);
    faixa.appendChild(d);
  }

  /* ── A EVOLUÇÃO MENSAL: a medida somada pelo MÊS DE CHEGADA.
        É a leitura principal da tela — "quando entra o que estou comprando" — e é
        também a única que depende de uma decisão tomada na grade: o mês. Produto sem
        mês escolhido não entra em mês nenhum; ele aparece na contagem da faixa, e é
        por isso que a soma dos doze pode ser menor que o total. */
  const escolhidosMes = r[dMes.id] || [];
  const porMes = [];
  for (let m = 1; m <= 12; m++) {
    const valor = paraMes
      .filter((g) => g.chegada === m)
      .reduce((acc, g) => acc + (g.valores[medida.id] || 0), 0);
    porMes.push({ nome: nomeDoMes(m).slice(0, 3), valor, mes: m, cheio: nomeDoMes(m) });
  }
  desenharBarras("bi-mensal", porMes, {
    aoClicar: (item) => recortarAnalise(dMes.id, [item.cheio]),
    escolhido: (item) => (escolhidosMes.length
      ? escolhidosMes.includes(item.cheio) : null),
  });

  /* ── O TRIMESTRE: os mesmos números em quatro, para a leitura de estação.
        Clicar nele recorta os TRÊS meses dele — é o mesmo recorte de mês, com três
        valores, e não uma quinta dimensão para manter em pé. */
  const porTri = [];
  for (let q = 0; q < 4; q++) {
    const meses = [q * 3 + 1, q * 3 + 2, q * 3 + 3].map((m) => nomeDoMes(m));
    const valor = porMes.slice(q * 3, q * 3 + 3).reduce((acc, it) => acc + it.valor, 0);
    porTri.push({ nome: (q + 1) + "\u00ba " + t("trimestre"), valor, meses });
  }
  desenharBarras("bi-trimestral", porTri, {
    aoClicar: (item) => recortarAnalise(dMes.id, item.meses),
    /* TRÊS ESTADOS, e não dois: aceso quando os três meses dele estão escolhidos,
       APAGADO quando nenhum está, e NEUTRO quando alguns estão. Sem o neutro,
       escolher um mês só apagava os quatro trimestres de uma vez — e um cartão
       inteiro apagado lê como "nada aqui", que é o contrário do que ele mostra. */
    escolhido: (item) => {
      if (!escolhidosMes.length) return null;
      if (item.meses.every((m) => escolhidosMes.includes(m))) return true;
      return item.meses.some((m) => escolhidosMes.includes(m)) ? null : false;
    },
  });

  const acesos = (id) => (r[id] || []);
  desenharRosca("bi-rosca", porGrupo.fatias, porGrupo.total, {
    aoClicar: (f) => recortarAnalise(dGrupo.id, [f.nome]),
    escolhido: (f) => (acesos(dGrupo.id).length
      ? acesos(dGrupo.id).includes(f.nome) : null),
  });
  desenharBarrasH("bi-provedor", porProv.fatias, 12, {
    aoClicar: (f) => recortarAnalise(dProv.id, [f.nome]),
    escolhido: (f) => (acesos(dProv.id).length
      ? acesos(dProv.id).includes(f.nome) : null),
  });
  /* CLICAR NUMA FILA DO RANKING recorta por aquele produto: o mesmo gesto das outras
     visões, escrevendo na mesma lista que o funil de produto da barra.
     O RANKING FICA FORA DO PRÓPRIO RECORTE, como as outras visões — senão, depois de
     escolher um produto, a lista teria uma fila só e não haveria como escolher
     outro. */
  const paraProd = filasDaAnalise(dProd.id);
  desenharRanking("bi-ranking", paraProd, medida, somar(paraProd, medida.id), {
    aoClicar: (g) => recortarAnalise(dProd.id, [dProd.valor(g)]),
    escolhido: (g) => (acesos(dProd.id).length
      ? acesos(dProd.id).includes(dProd.valor(g)) : null),
  });
}

/* AS COLUNAS DO CADASTRO. Fixas: esta tela tem as suas perguntas, e elas não mudam
   com o arquivo que entrou. Cada uma sabe LER o seu valor de uma fila, e é só isso
   que o filtro e a ordenação precisam saber sobre ela. */
function colunasDoCadastro() {
  const cols = colunasNaOrdem();
  const colGrupo = cols.find((c) => c.tipo === "txt"
    && /grupo/i.test(c.tituloArquivo || c.titulo));
  const colProv = cols.find((c) => c.tipo === "txt" && c !== colGrupo && !c.eixo);

  return [
    { id: "p:cod", titulo: t("colCodigo"), classe: "cod",
      valor: (g) => g.codigo || "" },
    { id: "p:nome", titulo: t("ejeProducto"), classe: "eixo txt",
      valor: (g) => g.rotulo || "" },
    { id: "p:grupo", titulo: colGrupo ? colGrupo.titulo : "Grupo", classe: "txt",
      valor: (g) => (colGrupo ? String(g.textos[colGrupo.id] ?? "") : "") },
    { id: "p:prov", titulo: colProv ? colProv.titulo : t("colProvedor"), classe: "txt",
      valor: (g) => (colProv ? String(g.textos[colProv.id] ?? "") : "") },
    /* A MÁSCARA mostra SÓ o que foi escrito à mão, e vazia quando não há: é a
       diferença entre "este produto tem apelido" e "o apelido dele é o nome do
       arquivo". Na coluna do produto já se vê o nome que vale. */
    { id: "p:masc", titulo: t(COLUNA_MASCARA.chave), classe: "txt mascara",
      valor: (g) => String(correcoesDe(g.chaveEdicao)[COLUNA_MASCARA.id] ?? "") },
    { id: "p:ativo", titulo: t("colAtivo"), classe: "ativo", semFunil: true,
      valor: (g) => (estaInativo(g.chaveEdicao) ? "0" : "1") },
  ];
}

/* O contexto do funil desta tela. Ver `CTX_GRADE`: as escolhas são separadas, e o
   repintar é o desta lista — abrir o funil aqui não redesenha a grade de compra. */
const CTX_PRODUTOS = {
  selecoes: () => estado.selecoesProd,
  opcoes: (col) => opcoesDoCadastro(col),
  repintar: (col, desmarcado) => {
    desenharProdutos();
    /* O painel é reaberto no botão da coluna, como faz a grade: o desenho novo
       destruiu o `<th>` em que ele estava ancorado. */
    const cols = colunasDoCadastro();
    const pos = cols.findIndex((c) => String(c.id) === String(col.id));
    const botao = pos >= 0 ? $("th-prod").children[pos].querySelector(".funil") : null;
    if (botao) abrirFunil(cols[pos], botao, desmarcado, CTX_PRODUTOS);
  },
};

/**
 * As opções do funil de uma coluna do cadastro.
 *
 * IGNORA A PRÓPRIA COLUNA no recorte, como o da grade: senão, marcando um valor, a
 * lista passaria a ter só ele e não haveria como voltar a marcar os outros.
 */
function opcoesDoCadastro(col) {
  const vistos = new Set();
  for (const g of filasDoCadastro({ ignorar: col.id })) vistos.add(col.valor(g));
  return [...vistos]
    .sort((a, b) => String(a).localeCompare(String(b), idioma === "pt" ? "pt-BR" : "es-PY"))
    .map((chave) => ({ chave, ordem: chave }));
}

/**
 * As filas do cadastro: todos os produtos, recortados e ordenados.
 *
 * `ignorar` deixa uma coluna de fora do recorte — é o que o funil dela precisa para
 * montar a própria lista.
 */
function filasDoCadastro(opcoes) {
  const ignorar = opcoes && opcoes.ignorar !== undefined ? String(opcoes.ignorar) : null;
  const cols = colunasDoCadastro();
  const busca = semAcento(String(estado.buscaProd || "").trim());

  let filas = montarGrade({ comInativos: true }).filas.filter((g) => {
    /* DESLIGAR NÃO REMONTA A LISTA (ver o clique do interruptor), e é por isso que
       a fila desligada continua à vista mesmo com este teste: ela sai no próximo
       desenho — ao buscar, ao filtrar, ao ordenar, ao trocar de tela. Sumir no
       clique era ruim de um jeito específico: a fila de baixo subia para o lugar do
       cursor, e o clique seguinte caía noutro produto. */
    if (!verInativos && estaInativo(g.chaveEdicao)) return false;
    for (const col of cols) {
      if (String(col.id) === ignorar) continue;
      const marcadas = estado.selecoesProd[String(col.id)];
      if (!marcadas || !marcadas.length) continue;
      if (!marcadas.includes(col.valor(g))) return false;
    }
    if (!busca) return true;
    return semAcento(cols.map((c) => c.valor(g)).join(" ")).includes(busca);
  });

  const col = cols.find((c) => c.id === estado.ordemProd.chave) || cols[1];
  filas = [...filas].sort((a, b) => {
    const r = String(col.valor(a)).localeCompare(String(col.valor(b)),
                                                 idioma === "pt" ? "pt-BR" : "es-PY");
    return (estado.ordemProd.desc ? -r : r) || a.rotulo.localeCompare(b.rotulo);
  });
  return filas;
}

function desenharProdutos() {
  const cols = colunasDoCadastro();
  const todas = montarGrade({ comInativos: true }).filas;
  const filas = filasDoCadastro();

  /* ── O CABEÇALHO: rótulo que ORDENA e funil que FILTRA, o mesmo par da grade.
        O gesto de olhar uma tabela é o mesmo nas duas telas, e aprender dois seria
        um a mais do que o necessário. */
  const trCab = $("th-prod");
  trCab.replaceChildren();
  for (const col of cols) {
    const th = document.createElement("th");
    th.className = col.classe.includes("eixo") ? "eixo" : col.classe.split(" ")[0];

    const b = document.createElement("button");
    b.type = "button";
    b.className = "rotulo-col";
    const titulo = document.createElement("span");
    titulo.className = "titulo-col";
    titulo.textContent = col.titulo;
    b.appendChild(titulo);
    if (estado.ordemProd.chave === col.id) {
      const seta = document.createElement("span");
      seta.className = "seta";
      seta.textContent = estado.ordemProd.desc ? "\u25bc" : "\u25b2";
      b.append(seta);
    }
    /* Ordenar é a CÉLULA INTEIRA, como na grade: o rótulo não cresce (o funil
       encosta nele), e o clique no vazio da coluna é o que se tenta sem pensar. */
    th.onclick = () => {
      estado.ordemProd = (estado.ordemProd.chave === col.id)
        ? { chave: col.id, desc: !estado.ordemProd.desc }
        : { chave: col.id, desc: false };
      desenharProdutos();
    };

    const fileira = document.createElement("div");
    fileira.className = "cab-fileira";
    fileira.appendChild(b);
    if (!col.semFunil) desenharFunil(fileira, col, CTX_PRODUTOS);
    th.appendChild(fileira);
    trCab.appendChild(th);
  }
  const thAcoes = document.createElement("th");
  thAcoes.className = "acoes";
  trCab.appendChild(thAcoes);

  const corpo = $("corpo-prod");
  corpo.replaceChildren();
  if (!filas.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = cols.length + 1;
    td.className = "vazio-lista";
    td.textContent = todas.length ? t("nadaEncontrado") : t("semProdutos");
    tr.appendChild(td);
    corpo.appendChild(tr);
  }

  for (const g of filas) {
    const tr = document.createElement("tr");

    for (const col of cols) {
      const td = document.createElement("td");
      td.className = col.classe;
      if (col.id === "p:ativo") {
        /* O INTERRUPTOR. Ele é a única coisa desta tela que se resolve sem abrir a
           edição, porque é o gesto que se repete: passar os olhos numa lista e
           desligar os que não são assunto.
           O CLIQUE NÃO REMONTA A LISTA: ver `recemMexidos`. Ele muda esta fila, a
           contagem do alto, e mais nada. */
        const chave = document.createElement("button");
        chave.type = "button";
        chave.className = "interruptor";
        chave.setAttribute("role", "switch");
        chave.setAttribute("aria-label", t("colAtivo"));
        chave.appendChild(document.createElement("span"));
        chave.onclick = (ev) => {
          ev.stopPropagation();
          gravarAtivo(g.chaveEdicao);
          marcarFilaDoCadastro(tr, g);
          atualizarContaDoCadastro();
        };
        td.appendChild(chave);
      } else {
        const texto = col.valor(g);
        td.textContent = texto;
        if (texto) td.title = texto;
      }
      tr.appendChild(td);
    }

    const tdAcoes = document.createElement("td");
    tdAcoes.className = "acoes";
    desenharLapis(tdAcoes, g);
    tr.appendChild(tdAcoes);

    if (g.editavel) {
      tr.classList.add("clicavel");
      tr.onclick = () => abrirEditor(g.chaveEdicao);
    }
    marcarFilaDoCadastro(tr, g);
    corpo.appendChild(tr);
  }

  atualizarContaDoCadastro();
  $("rotulo-inativos").textContent = t(verInativos ? "ocultarInativos" : "verInativos");
}

/** Pinta a fila e o interruptor conforme o produto está ligado ou não. */
function marcarFilaDoCadastro(tr, g) {
  const inativo = estaInativo(g.chaveEdicao);
  tr.classList.toggle("inativa", inativo);
  const chave = tr.querySelector(".interruptor");
  if (chave) {
    chave.classList.toggle("ligado", !inativo);
    chave.setAttribute("aria-checked", String(!inativo));
  }
}

function atualizarContaDoCadastro() {
  const todas = montarGrade({ comInativos: true }).filas;
  $("conta-prod").textContent = t("contaProdutos")
    .replace("{n}", fmtInteiro().format(todas.length))
    .replace("{i}", fmtInteiro().format(
      todas.filter((g) => estaInativo(g.chaveEdicao)).length));
}

function desenharTitulo() {
  $("titulo-faixa").textContent = t("titulo");
}

/* ── O FUNIL DE CADA COLUNA ─────────────────────────────────────────────────
   O painel vive no `document.body`, e não dentro do `<th>`, e isso é obrigatório:
   a tabela rola por dentro (`overflow:auto`), e qualquer coisa desenhada dentro
   dela é CORTADA na borda. Um painel de vinte itens dentro do cabeçalho apareceria
   com três linhas e o resto invisível.
   Fora da tabela ele precisa de posição em coordenadas de JANELA, medida a partir
   do botão que o abriu — é o preço de escapar do corte. */

let funilAberto = null;        /* id da coluna com o painel aberto */
/* De QUAL coluna as caixas estao apagadas a mao. Amarrado a coluna, e nao um
   booleano solto: abrindo o funil de outra coluna, o apagado da anterior nao pode
   valer para ela. Ver o interruptor do (Todos), abaixo. */
let funilDesmarcadoDe = null;

/* ---------------------------------------------------------------------------
   O "COMO SE CALCULA" DO SALDO VIRTUAL.

   O painel vive no `document.body`, e não dentro do `<th>`, pela MESMA razão do
   funil: a tabela rola por dentro (`overflow:auto`) e tudo o que se desenha dentro
   dela é cortado na borda. O preço é posicionar em coordenadas de janela.
--------------------------------------------------------------------------- */

let dicaAberta = null;      /* o painel à vista, se houver */

function fecharDicaDoSaldo() {
  if (dicaAberta) dicaAberta.remove();
  dicaAberta = null;
}

/** Uma parcela da conta: o nome da coluna numa pastilha. */
function parcelaDaConta(rotulo) {
  const peca = document.createElement("span");
  peca.className = "conta-parcela";
  peca.textContent = rotulo;
  return peca;
}

/** Um sinal ou um parêntese da conta. */
function sinalDaConta(texto, classe) {
  const op = document.createElement("span");
  op.className = classe || "conta-sinal";
  op.textContent = texto;
  return op;
}

function abrirDicaDoSaldo(botao) {
  fecharDicaDoSaldo();
  const saldo = colunasDoSaldo();
  const cols = colunasNaOrdem();
  const nomeDe = (id) => {
    const c = cols.find((x) => String(x.id) === String(id));
    return c ? c.titulo : String(id);
  };

  const painel = document.createElement("div");
  painel.className = "dica-conta";
  painel.setAttribute("role", "tooltip");

  const rot = document.createElement("b");
  rot.textContent = t("comoSeCalcula");
  painel.appendChild(rot);

  /* A CONTA COM OS NOMES DAS COLUNAS, e não com uma fórmula em letras. Quem lê a
     tela vê `En Stock` e `Pedido Cartera` no cabeçalho; a conta escrita com os
     mesmos nomes se confere olhando para o lado, sem tradução no meio.
     E sai de `colunasDoSaldo`, então acompanha um título renomeado.

     OS PARÊNTESES SÃO ESCRITOS, e não deixados implícitos. A conta é
     `(estoque + a comprar) − pedido`, e sem eles a leitura de quem corre o olho
     pode virar `estoque + (a comprar − pedido)` — que dá o mesmo número aqui, mas
     não é a mesma frase: o que os parênteses dizem é que se soma O QUE VAI HAVER e
     depois se desconta o que já foi prometido.

     A FRASE EXPLICATIVA SAIU a pedido: a conta com os nomes das colunas já é a
     explicação, e a frase embaixo dizia a mesma coisa em português corrido. */
  const conta = document.createElement("div");
  conta.className = "conta";
  conta.append(
    sinalDaConta("(", "conta-parentese"),
    parcelaDaConta(nomeDe(saldo.stock)),
    sinalDaConta("+"),
    parcelaDaConta(nomeDe(saldo.aComprar)),
    sinalDaConta(")", "conta-parentese"),
    sinalDaConta("−"),
    parcelaDaConta(nomeDe(saldo.pedido)));
  painel.appendChild(conta);

  document.body.appendChild(painel);
  dicaAberta = painel;

  /* Ancorado no botão, em coordenadas de JANELA, e trazido para dentro dela: numa
     coluna encostada na borda direita, o painel nasceria metade fora da tela. */
  const r = botao.getBoundingClientRect();
  const largura = painel.offsetWidth;
  const esquerda = Math.min(Math.max(8, r.left + r.width / 2 - largura / 2),
                            innerWidth - largura - 8);
  painel.style.left = esquerda + "px";
  painel.style.top = (r.bottom + 6) + "px";
}

/** O "i" ao lado do rótulo da coluna calculada. */
function desenharInfoDoSaldo(fileira) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "info-col";
  b.title = t("comoSeCalcula");
  b.setAttribute("aria-label", t("comoSeCalcula"));
  b.innerHTML = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor'"
    + " stroke-width='2' stroke-linecap='round' aria-hidden='true'>"
    + "<circle cx='12' cy='12' r='9'/><path d='M12 11v6'/><path d='M12 7.6v.1'/></svg>";
  /* ABRE NO MOUSE E NO FOCO, e alterna no clique: no mouse porque é uma dica e
     dica que exige clique não é lida; no clique porque em tela de toque não há
     mouse; no foco porque quem navega por teclado também pergunta. */
  b.onmouseenter = () => abrirDicaDoSaldo(b);
  b.onmouseleave = fecharDicaDoSaldo;
  b.onfocus = () => abrirDicaDoSaldo(b);
  b.onblur = fecharDicaDoSaldo;
  b.onclick = (ev) => {
    ev.stopPropagation();   /* não ordenar ao pedir a conta */
    if (dicaAberta) fecharDicaDoSaldo(); else abrirDicaDoSaldo(b);
  };
  b.draggable = false;
  b.ondragstart = (ev) => { ev.preventDefault(); ev.stopPropagation(); };
  fileira.appendChild(b);
}

/** O botãozinho de funil, ao lado do rótulo da coluna. */
function desenharFunil(fileira, col, ctx) {
  ctx = ctx || CTX_GRADE;
  const b = document.createElement("button");
  b.type = "button";
  b.className = "funil";
  b.title = t("filtrarColuna");
  b.setAttribute("aria-label", t("filtrarColuna") + ": " + col.titulo);
  /* A coluna com escolha em vigor acende: sem isso, uma tabela recortada por uma
     coluna que saiu da vista parece uma tabela com filas faltando. */
  if ((ctx.selecoes()[String(col.id)] || []).length) b.classList.add("ativo");

  b.innerHTML = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'"
    + " stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>"
    + "<path d='M4 4h16l-6 8v7l-4-2v-5z'/></svg>";

  b.onclick = (ev) => {
    ev.stopPropagation();   /* não ordenar ao abrir o funil */
    if (String(funilAberto) === String(col.id)) return fecharFunil();
    abrirFunil(col, b, false, ctx);
  };
  /* O funil não é alça de arrasto: pegar nele move a coluna sem querer. */
  b.draggable = false;
  b.ondragstart = (ev) => { ev.preventDefault(); ev.stopPropagation(); };

  fileira.appendChild(b);
}

function fecharFunil() {
  funilAberto = null;
  funilDesmarcadoDe = null;
  const painel = $("painel-funil");
  if (painel) painel.remove();
  document.querySelectorAll("#th-cabecalho .funil.aberto")
    .forEach((x) => x.classList.remove("aberto"));
}

/* ---------------------------------------------------------------------------
   O CONTEXTO DO FUNIL.

   O painel de funil nasceu preso à grade: ele lia `estado.selecoes`, pedia as
   opções a `opcoesDoFunil` (que monta a grade) e repintava chamando o desenho da
   grade. A tela de PRODUTOS tem as próprias colunas, a própria lista e o próprio
   recorte — e precisa do mesmo painel.

   Então o que era fixo virou três perguntas que quem abre o funil responde. O
   painel não sabe mais de que tela ele é.

   AS ESCOLHAS SÃO SEPARADAS de propósito: filtrar o cadastro por grupo não recorta
   a tela de compra. São duas leituras, e o filtro é da leitura, não da coluna.
--------------------------------------------------------------------------- */

const CTX_GRADE = {
  selecoes: () => estado.selecoes,
