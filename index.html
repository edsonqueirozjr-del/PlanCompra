  /* O QUE VEIO NESTE ARQUIVO, lido sozinho. A fusão vem depois, para o `+=` da soma
     por código somar só as filas DESTE arquivo — somando em cima do que já estava
     guardado, reimportar a mesma planilha dobraria todo o estoque. */
  const doArquivo = {};
  const nomesDoArquivo = {};
  for (const fila of reconhecido.filas) {
    const chave = String(fila[chaveCol.indice] ?? "").trim();
    if (!chave) continue;
    const item = doArquivo[chave] || (doArquivo[chave] = {});
    for (const c of numericas) {
      const v = fila[c.indice];
      if (typeof v === "number" && Number.isFinite(v)) {
        item[c.titulo] = (item[c.titulo] || 0) + v;
      }
    }
    if (colNome && !nomesDoArquivo[chave]) {
      const nm = normalizarEspacos(fila[colNome.indice]);
      if (nm) nomesDoArquivo[chave] = nm;
    }
  }

  /* ── A FUSÃO ─────────────────────────────────────────────────────────────
     O que estava guardado é a base, e o arquivo escreve em cima do que é dele.
     Item por item e coluna por coluna: `{...oQueHavia, ...oQueVeio}` mantém as
     colunas que este arquivo não trouxe e substitui as que trouxe. */
  const antes = estado.stock || { valores: {}, nomes: {}, colunas: [] };
  const valores = { ...(antes.valores || {}) };
  for (const [chave, item] of Object.entries(doArquivo)) {
    valores[chave] = { ...(valores[chave] || {}), ...item };
  }
  const nomes = { ...(antes.nomes || {}), ...nomesDoArquivo };
  /* AS COLUNAS SÃO A UNIÃO, na ordem: as que já apareciam primeiro, as novas no
     fim. Trocando pela lista deste arquivo, uma planilha com uma coluna só faria
     a outra desaparecer da grade levando os números dela. */
  const colunas = [...(antes.colunas || [])];
  for (const c of numericas) if (!colunas.includes(c.titulo)) colunas.push(c.titulo);

  estado.stock = {
    arquivo: nome,
    importadaEm: Date.now(),
    colunas,
    valores,
    nomes,
  };
  guardarStock();

  const quantos = Object.keys(doArquivo).length;
  anotar("logStock", fmtInteiro().format(quantos) + " " + t("itens"));
  redesenhar();

  /* O SEGUNDO NÚMERO DO AVISO é informação de negócio, não aviso de defeito:
     quantos produtos têm estoque ou pedido e NÃO estão no plano de compra —
     alguém deixou de planejá-los. A conta é contra as filas DA BASE, não contra a
     grade: a grade já inclui esses produtos, e contra ela daria sempre zero. */
  const codigos = Object.keys(doArquivo);
  if (estado.base) {
    const colCodigo = colunasDe("codigo")[0] || null;
    const colNomeBase = colunasDe("nombre")[0] || null;
    const noPlano = new Set(estado.base.filas.map(
      (f) => chaveDeEdicao(f, colCodigo, colNomeBase)));
    const foraDoPlano = codigos.filter((c) => !noPlano.has(c)).length;
    avisar(t("stockOk") + ": " + fmtInteiro().format(codigos.length) + " " + t("itens")
      + (foraDoPlano ? "  ·  " + fmtInteiro().format(foraDoPlano) + " " + t("stockSinPareja") : ""));
  }
}

/**
 * ADOTA a leitura do PLANO DE COMPRA, FUNDINDO com o que já havia.
 *
 * Pela mesma regra do estoque: a planilha mexe no que é dela e o resto fica. Aqui a
 * fusão é POR FILA, e a chave é o código do produto:
 *   · código que veio no arquivo → a fila DELE vence (é a versão nova do plano);
 *   · código que não veio        → a fila que já estava continua na grade.
 *
 * SÓ FUNDE SE A ESTRUTURA FOR A MESMA. Uma fila é um vetor indexado por POSIÇÃO de
 * coluna: misturar filas de dois arquivos com colunas diferentes poria o número de
 * uma coluna embaixo do título de outra, e isso é pior que perder a fila. Estrutura
 * diferente é outro relatório, e aí ele substitui — o que era o comportamento de
 * sempre.
 *
 * AS CORREÇÕES À MÃO NÃO ENTRAM NA CONTA: elas vivem em `estado.edicoes`, com chave
 * de produto, e nenhuma importação as toca. É o que faz o trabalho de uma semana
 * sobreviver à planilha da semana seguinte.
 */
function adotarPlano(nome, lido, reconhecido) {
  const novo = {
    arquivo: nome,
    aba: lido.aba,
    importadaEm: Date.now(),
    colunas: reconhecido.colunas,
    filas: reconhecido.filas,
    /* O mes que a planilha trazia, por item. Vive na BASE, e nao nas correcoes,
       porque e dado do ARQUIVO: uma importacao nova o substitui, enquanto o que a
       pessoa escolheu no seletor continua vencendo em cima dele. */
    mesesDaPlanilha: reconhecido.mesesDaPlanilha || {},
  };

  const antes = estado.base;
  const mesmaEstrutura = antes
    && JSON.stringify(antes.colunas.map((c) => [c.indice, c.titulo]))
       === JSON.stringify(novo.colunas.map((c) => [c.indice, c.titulo]));

  if (mesmaEstrutura) {
    const colCodigo = novo.colunas.find((c) => c.papel === "codigo") || null;
    const colNome = novo.colunas.find((c) => c.papel === "nombre") || null;
    const doArquivo = new Set(novo.filas.map((f) => chaveDeEdicao(f, colCodigo, colNome)));
    const sobreviventes = antes.filas.filter(
      (f) => !doArquivo.has(chaveDeEdicao(f, colCodigo, colNome)));
    novo.filas = [...novo.filas, ...sobreviventes];
    /* Os meses também se fundem: o do arquivo novo vence, o do item que não veio
       continua valendo. */
    novo.mesesDaPlanilha = { ...(antes.mesesDaPlanilha || {}), ...novo.mesesDaPlanilha };
  }

  adotar(novo);
}

/** Adota a base lida. Os filtros da anterior caem, porque o recorte era daquela. */
function adotar(base) {
  estado.base = base;
  estado.selecoes = {};
  estado.busca = "";
  estado.ordem = { chave: null, desc: false };
  $("busca").value = "";
  guardar(base);
  anotar("logPlan", fmtInteiro().format(base.filas.length) + " " + t("filas"));
  redesenhar();
}

/**
 * APAGA OS DOIS RELATÓRIOS e volta à tela de carga com os dois cartões vazios.
 *
 * Apagava só a base, e o resultado era um estado meio apagado: a tela de entrada
 * reaparecia com o cartão do estoque ainda marcado, mostrando o arquivo de uma
 * sessão que já não existe. "Apagar" tem de deixar limpo.
 *
 * O QUE FICA É O QUE FOI CORRIGIDO À MÃO, e a confirmação diz isso. Os relatórios
 * são dado do ERP e voltam com um clique; o que alguém digitou em PMK, A Comprar e
 * no mês de chegada não volta de lugar nenhum. É o mesmo motivo de as três coisas
 * morarem em chaves separadas.
 */
/**
 * Esquece o recorte em vigor: filtros, escolhas de funil e busca.
 *
 * Chamado sempre que um relatório sai. Eles apontam para COLUNAS, e as colunas de um
 * relatório vão embora com ele — um filtro que sobrevive à planilha que o originou
 * recorta a grade por algo que ninguém mais vê.
 */
function esquecerRecortes() {
  estado.selecoes = {};
  estado.busca = "";
  estado.gerado = false;
  $("busca").value = "";
  fecharFunil();
  esconderErro();
}

async function apagarTudo() {
  if (!confirm(t("confirmarBorrar"))) return;
  await Promise.all([remover(CHAVE), remover(CHAVE_STOCK)]);
  estado.base = null;
  estado.stock = null;
  esquecerRecortes();
  anotar("logApagou", "");
  redesenhar();
}

/* ===========================================================================
   13. LIGAR A TELA
=========================================================================== */

/* A altura da barra do topo é MEDIDA e publicada, e não escrita duas vezes: é por
   ela que o bloco de contexto sabe onde se colar ao rolar. Escrita à mão nos dois
   lugares, mudar a barra deixava uma fresta ou uma sobreposição. */
function publicarAlturaDoTopo() {
  const topo = document.querySelector(".topo");
  if (topo) document.documentElement.style.setProperty("--altura-topo", topo.offsetHeight + "px");
}

function ligar() {
  aplicarTema(localStorage.getItem("pc.tema") || "somax");
  aplicarIdioma();
  lerOrdemColunas();
  lerVista();
  lerColunasOcultas();
  lerDiario();
  desenharDiario();
  /* O TEXTO DA BUSCA VOLTA PARA O CAMPO. Sem isto a grade abriria recortada por uma
     palavra que não está escrita em lugar nenhum — filtro invisível é a pior coisa
     que uma tabela pode ter. */
  $("busca").value = estado.busca;
  publicarAlturaDoTopo();
  addEventListener("resize", publicarAlturaDoTopo);

  /* Os dois menus da barra se ligam em `aplicarIdioma`, que é quem os monta.
     O que fica aqui é o FECHAR: clique fora e Esc, como no menu Acciones. */
  addEventListener("mousedown", (ev) => {
    if (escolhaAberta === null) return;
    if (!$("caixa-" + escolhaAberta).contains(ev.target)) fecharEscolhas();
  });
  addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && escolhaAberta !== null) fecharEscolhas();
  });

  /* CADA CARTÃO É UMA ZONA DE ARRASTO PRÓPRIA, e é a diferença que importa: com
     dois alvos, "acendeu" tem de dizer QUAL vai receber o arquivo. Uma área única
     na página inteira acenderia sem informar nada, e o arquivo cairia sempre no
     primeiro relatório — inclusive quando fosse o de estoque.

     Os quatro eventos são necessários: sem o `preventDefault` no `dragover`, o
     navegador ABRE o arquivo em vez de entregá-lo, e o `dragleave` é o que apaga o
     realce quando o arrasto sai sem soltar. */
  const parar = (ev) => { ev.preventDefault(); ev.stopPropagation(); };
  const ligarArrasto = (idCartao, aoReceber) => {
    const area = $(idCartao);
    for (const nome of ["dragenter", "dragover"]) {
      area.addEventListener(nome, (ev) => { parar(ev); area.classList.add("pronto"); });
    }
    area.addEventListener("dragleave", (ev) => { parar(ev); area.classList.remove("pronto"); });
    area.addEventListener("drop", (ev) => {
      parar(ev);
      area.classList.remove("pronto");
      const arquivo = ev.dataTransfer?.files?.[0];
      if (arquivo) aoReceber(arquivo);
    });
  };
  ligarArrasto("cartao-plan", importar);
  ligarArrasto("cartao-stock", importarStock);

  /* Soltar em QUALQUER outro lugar da janela não faz o navegador trocar de
     página: um arrasto que erra o alvo perderia a tela e o que estava filtrado. */
  addEventListener("dragover", (ev) => ev.preventDefault());
  addEventListener("drop", (ev) => ev.preventDefault());

  $("btn-escolher").onclick = () => $("arquivo").click();
  $("btn-escolher-stock").onclick = () => $("arquivo-stock").click();

  /* O MENU DE ACOES. Fecha no clique fora e no Esc, como o funil — e pelo mesmo
     motivo: um menu que fica aberto atras do dedo e um clique errado esperando. */
  const fecharAcoes = () => {
    $("menu-acoes").hidden = true;
    $("btn-acoes").setAttribute("aria-expanded", "false");
  };
  $("btn-acoes").onclick = (ev) => {
    ev.stopPropagation();
    const abrindo = $("menu-acoes").hidden;
    $("menu-acoes").hidden = !abrindo;
    $("btn-acoes").setAttribute("aria-expanded", String(abrindo));
  };
  addEventListener("mousedown", (ev) => {
    if ($("menu-acoes").hidden) return;
    if (!$("btn-acoes").parentElement.contains(ev.target)) fecharAcoes();
  });
  addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !$("menu-acoes").hidden) fecharAcoes();
  });

  /* IMPORTAR volta para a tela dos dois cartoes, com o que ja esta carregado
     marcado. Nao apaga nada: quem quer trocar um dos dois carrega em cima, e quem
     abriu por engano aperta Gerar e volta. */
  $("acao-importar").onclick = () => {
    fecharAcoes();
    estado.gerado = false;
    fecharFunil();
    redesenhar();
  };

  /* `async` e com `await`: `apagarTudo` espera o navegador remover as duas chaves
     do armazenamento. Sem devolver a promessa, quem chama não tem como saber
     quando acabou — e a tela podia ser redesenhada antes de o apagar terminar. */
  $("acao-exportar").onclick = () => { fecharAcoes(); exportarTudo(); };
  $("acao-respaldo").onclick = () => { fecharAcoes(); $("arquivo-respaldo").click(); };
  $("arquivo-respaldo").onchange = (ev) => {
    const arquivo = ev.target.files?.[0];
    ev.target.value = "";
    if (arquivo) importarRespaldo(arquivo);
  };
  $("acao-apagar").onclick = async () => { fecharAcoes(); await apagarTudo(); };

  /* TIRAR UMA PLANILHA SÓ, do cartão dela. Sem confirmação, ao contrário do
     Eliminar datos: aqui a pessoa está na tela de carga, com o botão de escolher
     arquivo logo abaixo — trazer de volta são dois cliques, e o que foi corrigido à
     mão nem é tocado. Confirmar cada uma seria atrito num gesto sem consequência. */
  $("tirar-plan").onclick = async () => {
    await remover(CHAVE);
    estado.base = null;
    esquecerRecortes();
    anotar("logTirouPlan", "");
    redesenhar();
  };
  $("tirar-stock").onclick = async () => {
    await remover(CHAVE_STOCK);
    estado.stock = null;
    esquecerRecortes();
    anotar("logTirouStock", "");
    redesenhar();
  };
  $("arquivo").onchange = (ev) => {
    const arquivo = ev.target.files?.[0];
    /* O campo é limpo para que escolher O MESMO arquivo de novo dispare o evento:
       sem isso, corrigir a planilha e reimportar não faz nada. */
    ev.target.value = "";
    if (arquivo) importar(arquivo);
  };

  $("btn-diario").onclick = (ev) => {
    ev.stopPropagation();
    const abrindo = $("menu-diario").hidden;
    $("menu-diario").hidden = !abrindo;
    $("btn-diario").setAttribute("aria-expanded", String(abrindo));
  };
  addEventListener("mousedown", (ev) => {
    if ($("menu-diario").hidden) return;
    if (!$("caixa-diario").contains(ev.target)) fecharDiario();
  });
  addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !$("menu-diario").hidden) fecharDiario();
  });

  $("busca-prod").oninput = (ev) => { estado.buscaProd = ev.target.value; desenharProdutos(); };
  $("btn-inativos").onclick = () => { verInativos = !verInativos; desenharProdutos(); };
  /* O CADASTRO TEM O PRÓPRIO FUNIL, e fechar ao rolar vale para ele também: o
     ouvinte de rolagem lá embaixo é do documento, então já cobre as duas telas. */

  $("btn-limpar-analise").onclick = limparRecorteDaAnalise;

  $("btn-colunas").onclick = (ev) => {
    ev.stopPropagation();
    const abrindo = $("menu-colunas").hidden;
    $("menu-colunas").hidden = !abrindo;
    $("btn-colunas").setAttribute("aria-expanded", String(abrindo));
  };
  addEventListener("mousedown", (ev) => {
    if ($("menu-colunas").hidden) return;
    if (!$("caixa-colunas").contains(ev.target)) fecharListaDeColunas();
  });
  addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !$("menu-colunas").hidden) fecharListaDeColunas();
  });
  $("btn-stock").onclick = () => $("arquivo-stock").click();
  $("arquivo-stock").onchange = (ev) => {
    const arquivo = ev.target.files?.[0];
    /* Limpo para que escolher O MESMO arquivo de novo dispare o evento: sem isso,
       corrigir a planilha de estoque e reimportar não faria nada — e esta é a
       importação que se repete. */
    ev.target.value = "";
    if (arquivo) importarStock(arquivo);
  };

  $("btn-gerar").onclick = () => { estado.gerado = true; redesenhar(); };

  /* A TELA DE EDITAR: fecha no X, no Cancelar, no fundo e no Esc; grava no
     Guardar e no Enter. São os caminhos que qualquer um tenta sem pensar. */
  $("editar-fechar").onclick   = fecharEditor;
  $("editar-cancelar").onclick = fecharEditor;
  $("editar-salvar").onclick   = salvarEditor;
  $("fundo-editar").onclick = (ev) => {
    /* Só o FUNDO fecha. Sem este teste, um clique dentro da caixa fecharia a tela
       no meio da digitação, porque o evento sobe até aqui. */
    if (ev.target === $("fundo-editar")) fecharEditor();
  };
  addEventListener("keydown", (ev) => {
    if (editandoChave === null) return;
    if (ev.key === "Escape") fecharEditor();
    if (ev.key === "Enter" && ev.target.tagName !== "BUTTON") salvarEditor();
  });

  $("fechar-erro").onclick = esconderErro;
  $("btn-limpar").onclick  = limparFiltros;
  $("btn-ordem").onclick   = () => {
    estado.ordemColunas = null;
    guardarOrdemColunas();
    redesenhar();
  };


  $("busca").oninput = (ev) => { estado.busca = ev.target.value; guardarVista(); redesenhar(); };

  /* FECHAR O FUNIL. `mousedown` e nao `click`: o clique numa linha da tabela ja
     teria acontecido antes de o painel sair da frente, e a pessoa clicaria no
     painel querendo clicar na tabela. */
  addEventListener("mousedown", (ev) => {
    if (funilAberto === null) return;
    const painel = $("painel-funil");
    if (painel && painel.contains(ev.target)) return;
    if (ev.target.closest && ev.target.closest(".funil")) return;  /* o proprio botao alterna */
    fecharFunil();
  });
  addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && funilAberto !== null) fecharFunil();
  });
  /* ROLANDO A PAGINA OU A TABELA, o painel ficaria parado no meio da tela enquanto
     a coluna dele sai de vista: ele esta preso a janela, nao a tabela. Fecha.

     MAS A ROLAGEM DE DENTRO DO PAINEL NAO CONTA. O ouvinte esta em CAPTURA (a
     terceira opcao), que e o unico jeito de ouvir a rolagem de uma caixa interna
     — o evento `scroll` de elemento nao borbulha. O preco e que ele ouve TAMBEM a
     lista do proprio painel: arrastar a barrinha dela fechava o painel que se
     estava usando. O teste do `contains` separa as duas rolagens. */
  addEventListener("scroll", (ev) => {
    if (funilAberto === null) return;
    const painel = $("painel-funil");
    if (painel && ev.target instanceof Node && painel.contains(ev.target)) return;
    fecharFunil();
  }, true);

  /* TUDO VOLTA SOZINHO ao abrir a página: a base importada E o que foi digitado.
     Abrir a ferramenta não pode custar um novo arrasto nem redigitar coluna
     nenhuma — é o que faz o trabalho de uma semana continuar na semana seguinte.

     A base é aceita como está, sem reconhecer de novo: o papel das colunas pode
     ter sido CORRIGIDO à mão no painel de mapeamento, e refazer a leitura jogaria
     essa correção fora a cada recarga.

     As duas leituras vão JUNTAS e não em sequência: são chaves independentes, e
     esperar uma para pedir a outra atrasaria a abertura sem motivo. */
  Promise.all([ler(CHAVE), ler(CHAVE_EDICOES), ler(CHAVE_STOCK)]).then(([base, edicoes, stock]) => {
    if (base && base.filas && base.filas.length) {
      /* AS REGRAS DE COLUNA SÃO REAPLICADAS, e a base guardada é regravada quando
         elas mudam algo. Sem isto, uma base importada por uma versão anterior da
         página mantinha o esquema daquela versão para sempre — e a única saída era
         apagar a base e importar de novo. Ver `renormalizarBase`. */
      if (renormalizarBase(base)) guardar(base);
      estado.base = base;
    }
    if (edicoes && typeof edicoes === "object") estado.edicoes = edicoes;
    /* O estoque volta como estava: ele é a foto da última importação, e reabrir a
       página não pode custar uma nova. */
    if (stock && stock.valores && Array.isArray(stock.colunas)) estado.stock = stock;

    /* COM DADO GUARDADO, A PÁGINA ABRE NA TABELA. O botão Gerar existe para o
       momento da IMPORTAÇÃO — carregou um arquivo ou os dois, confere nos cartões e
       manda gerar. Ele não tem o que fazer numa abertura em que nada foi carregado
       agora: a pessoa que abre a ferramenta na segunda-feira quer a tabela que
       deixou na sexta, e um clique obrigatório antes dela é uma porta que só existe
       para ser aberta. Sem dado nenhum, a tela de carga continua sendo a primeira,
       que é onde ela tem de estar. */
    estado.gerado = Boolean(estado.base) || Boolean(estado.stock);
    redesenhar();
  });
}

ligar();
</script>
