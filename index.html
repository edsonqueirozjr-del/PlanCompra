/* O nome do arquivo pode ser mais largo que o cartão: corta com reticências em vez
   de esticar o cartão e desalinhar os dois. */
.cartao-estado .nome{
  color:var(--accion); font-weight:600; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cartao .ou{font-size:11px; color:var(--tierra-300);}

/* TIRAR ESTA PLANILHA. So aparece no cartao carregado — num cartao vazio nao ha o
   que tirar, e um botao apagado ali seria um alvo que nao faz nada.
   E o unico vermelho da tela de entrada, e e proposital: ele desfaz uma carga. */
.cartao .tirar{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  width:26px; height:26px; padding:0; border:0; border-radius:6px;
  background:transparent; color:var(--tierra-300); cursor:pointer;
  transition:color .15s,background-color .15s;
}
.cartao .tirar svg{width:15px; height:15px;}
.cartao .tirar:hover{color:var(--red-700); background:var(--red-50);}

/* O BOTAO DE GERAR, embaixo dos dois cartoes e mais largo que eles: e o passo
   seguinte, nao um terceiro cartao. Desabilitado enquanto nao houver arquivo
   nenhum — e ele que diz que falta carregar algo antes. */
.btn-gerar{margin-top:20px; height:42px; padding:0 28px; font-size:14px;}


/* ── PASTILHAS E SINAIS ──────────────────────────────────────────────────── */
.pastilha{
  display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px;
  border-radius:999px; font-size:12px; font-weight:600;
  background:var(--somax-50); color:var(--chip);
}

/* A tarja de erro de leitura. Ela conta O QUE deu errado e em QUE arquivo, e não
   "erro ao importar": quem recebe uma planilha de outro sistema precisa saber se
   o problema é o formato, a aba ou a coluna. */
.tarja-erro{
  display:flex; gap:12px; align-items:flex-start;
  border:1px solid color-mix(in srgb,var(--red-700) 40%,transparent);
  background:var(--red-50); color:var(--red-800);
  border-radius:12px; padding:14px 18px; margin-bottom:12px; font-size:13px; line-height:1.6;
}
.tarja-erro b{display:block; margin-bottom:2px;}
.tarja-erro .fechar{margin-left:auto; flex-shrink:0;}

/* O sistema é de ESCRITÓRIO: uma grade de estoque contra pedido não se lê no
   telefone, e fingir que se lê é pior do que dizer que não. */
.so-escritorio{display:none; padding:64px 24px; text-align:center; color:var(--tierra-500); line-height:1.7;}
@media(max-width:719px){
  .so-escritorio{display:block;}
  .pagina{display:none !important;}
}
</style>
</head>
<body>

<!-- ── A BARRA DO TOPO ─────────────────────────────────────────────────────
     A marca, e à direita as duas escolhas que a pessoa faz uma vez e esquece:
     idioma e tema. Elas não moram numa tela de preferências porque são duas, e
     uma tela inteira para duas escolhas é mais navegação do que ajuste. -->
<header class="topo">
  <!-- A MARCA É O MENU DAS TELAS. São duas — a comparação e o cadastro de produtos
       —, e uma barra com dois botões de navegação para duas telas gasta espaço
       permanente num gesto que se faz duas vezes por semana. O logo já é o lugar
       onde se clica para "voltar ao começo" em qualquer aplicação; aqui ele abre a
       lista do que existe. -->
  <div class="escolha" id="caixa-telas">
    <button type="button" class="marca marca-botao" id="btn-telas"
            aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="9" fill="var(--somax-700)"/>
        <path d="M10 13.5h20M10 20h14M10 26.5h16" stroke="var(--firma)" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <span class="marca-nome">Plan de <span>Compra</span></span>
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>
    <div class="menu-acoes menu-escolha" id="menu-telas" hidden></div>
  </div>

  <!-- IDIOMA E TEMA SÃO MENUS, e não seletores nativos.
       Eram dois `<select>` com a setinha redesenhada, e o problema não era só a
       aparência: um `select` com `appearance:none` tem a largura decidida pelo
       navegador a partir da opção mais comprida, e "Somax" saía cortado como
       "Soma▾" — o nome da casa, truncado na barra do topo.
       Aqui é o MESMO padrão do menu Acciones, que já existia três telas abaixo:
       botão de contorno com o valor à vista, painel com as opções e um tique na
       que está valendo. A largura é a do conteúdo, o tema pinta tudo por token, e
       a casa aparece inteira. -->
  <div class="topo-direita">
    <div class="escolha" id="caixa-idioma">
      <button type="button" class="btn btn-contorno" id="btn-idioma"
              aria-haspopup="listbox" aria-expanded="false" aria-label="Idioma">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>
          <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>
        </svg>
        <span id="rotulo-idioma"></span>
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <div class="menu-acoes menu-escolha" id="menu-idioma" role="listbox" hidden></div>
    </div>

    <div class="escolha" id="caixa-tema">
      <button type="button" class="btn btn-contorno" id="btn-tema"
              aria-haspopup="listbox" aria-expanded="false" data-t-aria="tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 3v18"/>
          <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>
        </svg>
        <span id="rotulo-tema"></span>
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <div class="menu-acoes menu-escolha" id="menu-tema" role="listbox" hidden></div>
    </div>
  </div>
</header>
<div class="faixa-assinatura" aria-hidden="true"></div>

<div class="so-escritorio">
  <strong data-t="soEscritorio"></strong>
</div>

<main class="pagina">

  <!-- A tarja de erro de leitura, escondida até haver o que contar. -->
  <div class="tarja-erro" id="tarja-erro" hidden>
    <div>
      <b id="erro-titulo"></b>
      <span id="erro-detalhe"></span>
    </div>
    <button type="button" class="btn btn-fantasma fechar" id="fechar-erro" aria-label="X">&times;</button>
  </div>

  <!-- ── A TELA VAZIA: a porta de entrada de toda sessão ───────────────────
       DOIS CARTÕES, um por relatório, porque são DOIS relatórios e não um.
       A tela antiga pedia "a planilha", no singular, com uma área de arrasto só —
       e a segunda importação só existia depois, escondida num botão da barra. Quem
       abria pela primeira vez carregava um arquivo, via a grade sem estoque e não
       tinha como saber que faltava metade.
       Os cartões dizem o NOME DO ARQUIVO que cada um espera: são dois nomes
       parecidos que saem do mesmo ERP, e trocá-los é o erro natural.
       A ORDEM é indiferente: cada cartão recebe o seu, e a grade abre quando os
       dois estiverem lá. -->
  <section id="tela-vazia">
    <div class="vazio">
      <h2 data-t="vazioTitulo"></h2>

      <div class="cartoes">
        <!-- 1. O PLANO DE COMPRA: quem é o produto e o que se decidiu comprar. -->
        <div class="cartao" id="cartao-plan">
          <div class="cartao-topo">
            <span class="numero">1</span>
            <div class="cartao-nomes">
              <b data-t="cartaoPlan"></b>
            </div>
            <svg class="tique-carga" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
            <button type="button" class="tirar" id="tirar-plan" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              </svg>
            </button>
          </div>
          <div class="cartao-estado" id="estado-plan"></div>
          <button type="button" class="btn btn-primario" id="btn-escolher">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
            </svg>
            <span data-t="escolherArquivo"></span>
          </button>
          <span class="ou" data-t="ouArraste"></span>
        </div>

        <!-- 2. O ESTOQUE E O PEDIDO: quanto existe e quanto já foi pedido. -->
        <div class="cartao" id="cartao-stock">
          <div class="cartao-topo">
            <span class="numero">2</span>
            <div class="cartao-nomes">
              <b data-t="cartaoStock"></b>
            </div>
            <svg class="tique-carga" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
            <button type="button" class="tirar" id="tirar-stock" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              </svg>
            </button>
          </div>
          <div class="cartao-estado" id="estado-stock"></div>
          <button type="button" class="btn btn-primario" id="btn-escolher-stock">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
            </svg>
            <span data-t="escolherArquivo"></span>
          </button>
          <span class="ou" data-t="ouArraste"></span>
        </div>
      </div>

      <!-- GERAR: a grade nao abre sozinha ao carregar. Abrir no instante em que o
           segundo arquivo entra tira a chance de conferir o que entrou — e os
           cartoes existem justamente para isso. O botao acende com o primeiro
           arquivo, porque a grade lista o que houver. -->
      <button type="button" class="btn btn-primario btn-gerar" id="btn-gerar" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/>
          <rect x="14" y="8" width="3" height="10"/>
        </svg>
        <span data-t="gerarDados"></span>
      </button>

    </div>
  </section>

  <!-- ── A TELA COM BASE ─────────────────────────────────────────────────── -->
  <section id="tela-grade" hidden>

    <!-- O bloco que fica preso no alto ao rolar: a faixa e a barra de comandos. -->
    <div class="bloco-preso">
      <!-- A LINHA DO TÍTULO tem dois lados: o nome da tela e, na ponta, QUANDO foi
           a última coisa feita. A data sozinha responde a pergunta que se faz ao
           abrir a página — "isto está atualizado?" —, e o clique abre o resto:
           as dez últimas ações, que é o que responde "atualizado com o quê?". -->
      <div class="linha-titulo">
        <h1 id="titulo-faixa" class="titulo-tela"></h1>
        <div class="caixa-diario" id="caixa-diario">
          <button type="button" class="btn btn-fantasma btn-diario" id="btn-diario"
                  aria-haspopup="true" aria-expanded="false" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3.5 2"/>
            </svg>
            <span id="rotulo-diario"></span>
          </button>
          <div class="menu-acoes menu-diario" id="menu-diario" hidden></div>
        </div>
      </div>

      <div class="barra-filtros">
        <!-- A BUSCA, com a LUPA DENTRO do campo.
             O texto de exemplo já dizia "Buscar producto…", e não bastava: numa
             barra em que todo o resto é botão, um retângulo largo e vazio lê como
             campo de formulário, não como busca. A lupa é o desenho que diz "aqui
             se procura" antes de a palavra ser lida — e continua dizendo depois,
             quando o texto de exemplo já saiu porque alguém digitou. -->
        <div class="caixa-busca">
          <span class="lupa" aria-hidden="true"></span>
          <input type="search" class="campo" id="busca">
        </div>
        <button type="button" class="btn btn-fantasma" id="btn-limpar" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/><line x1="22" y1="2" x2="16" y2="8"/><line x1="16" y1="2" x2="22" y2="8"/>
          </svg>
          <span data-t="limpiar"></span>
        </button>

        <div class="direita">
          <span class="aviso" id="aviso"></span>
          <!-- Aparece SÓ quando a ordem das colunas foi mexida, como o Limpar
               aparece só quando há filtro. Um botão permanente para desfazer algo
               que quase nunca se faz ocupa a barra o tempo todo à espera. -->
          <button type="button" class="btn btn-fantasma" id="btn-ordem" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
            </svg>
            <span data-t="restaurarColunas"></span>
          </button>
          <!-- ATUALIZAR ESTOQUE VEM PRIMEIRO, e é o único em PRIMÁRIO: é a ação
               que se faz toda semana — a base principal entra uma vez, o estoque
               entra sempre. Ele já ficou no meio da fileira, e subir para a frente
               é pô-lo onde a mão vai primeiro.
               OS TRÊS TÊM A MESMA LARGURA. Rótulos de tamanhos diferentes davam
               três caixas de tamanhos diferentes, e uma fileira de botões
               desalinhados lê como três coisas soltas em vez de um grupo de
               comandos. Ver `.direita .btn` no CSS. -->
          <button type="button" class="btn btn-primario" id="btn-stock">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/>
            </svg>
            <span data-t="actualizarStock"></span>
          </button>


          <!-- COLUNAS: quais se veem. Era um interruptor de uma coluna só
               ("Mostrar PMK") e virou uma lista, porque a razão que valia para o
               PMK não é exclusiva dele: numa tela de onze colunas, quem está
               decidindo compra não quer as onze ao mesmo tempo, e a coluna que
               sobra é diferente para cada pessoa e cada semana.
               Fica DEPOIS do Atualizar estoque: aquele é comando de dado e se faz
               toda semana; este é comando de vista. -->
          <div class="caixa-colunas" id="caixa-colunas">
            <button type="button" class="btn btn-contorno" id="btn-colunas"
                    aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <path d="M9.5 4v16"/><path d="M15.5 4v16"/>
              </svg>
              <span data-t="colunasBotao"></span>
              <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </button>
            <div class="menu-acoes menu-colunas" id="menu-colunas" hidden></div>
          </div>

          <!-- AÇÕES: as duas coisas que se fazem RARAMENTE, guardadas atrás de um
               clique. Elas estavam soltas na barra como dois botões permanentes —
               e uma delas é sem volta (apagar). Botão destrutivo à vista o tempo
               todo, ao lado dos que se usam sempre, é convite a errar o clique.
               Atualizar estoque fica FORA do menu de propósito: é semanal, e o que
               se faz sempre não se esconde. -->
          <div class="caixa-acoes">
            <button type="button" class="btn btn-contorno" id="btn-acoes" aria-haspopup="true"
                    aria-expanded="false">
              <span data-t="acciones"></span>
              <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </button>

            <div class="menu-acoes" id="menu-acoes" hidden>
              <button type="button" class="item-acao" id="acao-importar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
                </svg>
                <span data-t="acaoImportar"></span>
              </button>
              <!-- O TRABALHO INTEIRO NUM ARQUIVO. Nada a ver com importar planilha
                   (aquela é o dado que chega do ERP): isto é o que foi decidido em
                   cima dela, para mandar a outra pessoa em outra máquina. -->
              <button type="button" class="item-acao" id="acao-exportar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
                </svg>
                <span data-t="acaoExportar"></span>
              </button>
              <button type="button" class="item-acao" id="acao-respaldo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
                </svg>
                <span data-t="acaoRespaldo"></span>
              </button>
              <button type="button" class="item-acao perigo" id="acao-apagar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                </svg>
                <span data-t="acaoApagar"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>


    <div class="moldura">
      <div class="rolagem" id="rolagem">
        <table>
          <thead>
            <tr class="cabecalho" id="th-cabecalho"></tr>
          </thead>
          <tbody id="corpo"></tbody>
          <!-- O PÉ DA TABELA, e não uma tarja fora dela: é o que faz cada total
               cair embaixo da coluna que ele soma. Preso no fundo da caixa que
               rola, como o cabeçalho está preso no alto. -->
          <tfoot>
            <tr class="pe-fileira" id="pe-tabela"></tr>
          </tfoot>
        </table>
      </div>
    </div>
  </section>

  <!-- ── A TELA DE ANÁLISE ─────────────────────────────────────────────────
       O painel que responde as perguntas de conjunto: QUANDO chega o que se vai
       comprar, DE QUEM, e de QUE grupo. A grade responde produto por produto; aqui
       a mesma base se lê somada.
       A FORMA É A DO PLAN DE VENTAS, e de propósito: quem usa as duas ferramentas
       não deve ter de aprender dois painéis. Faixa verde com os totais em ouro,
       cartões brancos com título em maiúsculas, e a evolução mensal atravessando a
       largura — ela é a leitura principal. -->
  <section id="tela-analise" hidden>
    <div class="faixa-analise">
      <h1 data-t="tituloDaAnalise"></h1>
      <div class="faixa-numeros" id="numeros-analise"></div>
    </div>

    <div class="barra-filtros barra-analise">
      <span class="rot-medida" data-t="medidaAnalisada"></span>
      <div class="escolha" id="caixa-medida">
        <button type="button" class="btn btn-contorno" id="btn-medida"
                aria-haspopup="listbox" aria-expanded="false">
          <span id="rotulo-medida"></span>
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="menu-acoes menu-escolha" id="menu-medida" hidden></div>
      </div>

      <!-- OS QUATRO FILTROS, na ordem em que a pergunta se faz: de que GRUPO, de que
           FORNECEDOR, qual PRODUTO, em que MÊS.
           Cada um é o mesmo funil de seleção múltipla das colunas da grade — com
           busca dentro da lista e o `(Todos)` como interruptor —, e por isso não há
           nada novo para aprender aqui. O rótulo do botão diz o que está escolhido:
           "Todos", o nome quando é um só, ou quantos são.
           ELES SÃO FILTROS DE TELA: recortam TODAS as visões, o ranking incluído. As
           visões ficam de fora do próprio recorte (ver `filasDaAnalise`) porque ali
           o desenho é o caminho de volta; aqui o caminho de volta é o próprio
           botão, que fica escrito na barra. -->
      <div class="filtros-bi" id="filtros-analise"></div>

      <div class="direita">

const t = (chave) => (TEXTOS[idioma] && TEXTOS[idioma][chave]) || chave;

/* ===========================================================================
   2. NÚMERO

   Espanhol do Paraguai e português do Brasil usam ponto para milhar e vírgula
   para decimal: 1.507.059,25. O JavaScript entende o contrário, e é por não
   tratar isso que uma exportação vira uma coluna de texto no Excel e a soma
   não fecha.

   Duas casas NO MÁXIMO, e nenhuma quando são zero: o estoque do ERP vem como
   4935 e como 3220396.711, e a grade não pode ter uma coluna com três casas
   fantasmas por causa de uma fila.
=========================================================================== */

const fmtInteiro = () => new Intl.NumberFormat(idioma === "pt" ? "pt-BR" : "es-PY",
                          { maximumFractionDigits: 0 });

/**
 * Formata para a tela. Zero sai como "0" e ganha a classe apagada na célula.
 *
 * SEMPRE INTEIRO, arredondado. A tela já mostrou os decimais como eles vêm do ERP
 * (28 filas da base têm estoque fracionado), e depois com casas fixas por coluna
 * para as vírgulas alinharem. As duas versões foram recusadas, e a razão é a mesma:
 * numa grade de nove colunas de número, a casa decimal é ruído — ninguém compra
 * 0,12 de um defensivo, e o dígito depois da vírgula não muda decisão nenhuma.
 *
 * ARREDONDA, não corta: `Intl` com zero casas arredonda, então 1.078,6 sai 1.079 e
 * a soma da coluna continua parecendo certa. Cortando, uma coluna de mil filas
 * perderia até quinhentas unidades no total à vista.
 *
 * NAO HA MAIS SAIDA EM TEXTO na tela (o Exportar CSV e o Copiar sairam), entao o
 * arredondamento e o unico numero que se ve. Quem precisa do valor exato abre a
 * planilha de origem, que continua intacta.
 */
function numero(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "";
  return fmtInteiro().format(v);
}

/* ===========================================================================
   3. O LEITOR DE .XLSX, escrito à mão.

   POR QUE À MÃO, e não uma biblioteca por CDN: o protótipo do Plan de Ventas
   carregava a SheetJS de um CDN, e isso significa que o arquivo só funciona com
   internet e com aquele domínio liberado. Numa empresa com VPN, é a diferença
   entre abrir e não abrir. E são 900 KB de biblioteca para ler um zip com dois
   XMLs dentro.

   UM .xlsx É UM ZIP com XMLs. O que precisa ser feito é exatamente isto:

     1. achar o diretório central do zip (a lista de arquivos, no FIM dele)
     2. descomprimir as entradas que interessam
     3. ler três XMLs: o livro (as abas), as strings compartilhadas e a aba

   A descompressão é `DecompressionStream("deflate-raw")`, que o navegador tem
   nativo desde 2022. É o único pedaço que não dava para escrever aqui, e é o
   único que não precisa: ele existe pronto.

   O QUE ESTE LEITOR NÃO FAZ, de propósito: não lê fórmula (lê o RESULTADO dela,
   que é o que está gravado), não lê formato de data (uma data vem como o número
   de série que o Excel guarda) e não lê zip64. Nenhuma das três aparece numa
   base de estoque, e cada uma delas seria código para um caso que não existe.
=========================================================================== */

const ASSINATURA_FIM        = 0x06054b50; /* fim do diretório central */
const ASSINATURA_CENTRAL    = 0x02014b50; /* uma entrada do diretório central */
const ASSINATURA_LOCAL      = 0x04034b50; /* o cabeçalho que precede cada arquivo */

/**
 * Abre o zip e devolve um mapa de nome -> pedaço de bytes ainda comprimido.
 *
 * A leitura começa pelo FIM: o zip guarda o índice no final, e é ele que diz onde
 * cada arquivo está. Procurar o índice varrendo de trás para frente é o que a
 * norma pede, porque depois dele pode haver um comentário de tamanho variável.
 */
function abrirZip(buffer) {
  const bytes = new Uint8Array(buffer);
  const dv = new DataView(buffer);

  /* O comentário final tem no máximo 65535 bytes, então o índice está dentro
     dos últimos 65557. Varrer todo o arquivo seria desperdício. */
  let fim = -1;
  const limite = Math.max(0, bytes.length - 65557);
  for (let i = bytes.length - 22; i >= limite; i--) {
    if (dv.getUint32(i, true) === ASSINATURA_FIM) { fim = i; break; }
  }
  if (fim < 0) throw new Error("no-es-zip");

  const quantas = dv.getUint16(fim + 10, true);
  let p = dv.getUint32(fim + 16, true);

  /* Zip64: quando o arquivo passa de 4 GB, os campos de 32 bits ficam em 0xFFFF
     e o tamanho real vive num registro à parte. Uma base de estoque nunca chega
     lá, então em vez de implementar o formato inteiro a leitura DIZ que não sabe. */
  if (p === 0xffffffff || quantas === 0xffff) throw new Error("zip64");

  const entradas = new Map();
  for (let n = 0; n < quantas; n++) {
    if (dv.getUint32(p, true) !== ASSINATURA_CENTRAL) throw new Error("central-corrompido");

    const metodo    = dv.getUint16(p + 10, true);
    const compTam   = dv.getUint32(p + 20, true);
    const nomeTam   = dv.getUint16(p + 28, true);
    const extraTam  = dv.getUint16(p + 30, true);
    const comentTam = dv.getUint16(p + 32, true);
    const offLocal  = dv.getUint32(p + 42, true);
    const nome      = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nomeTam));

    /* O tamanho do campo extra do cabeçalho LOCAL costuma ser diferente do que
       está aqui no central, e é o local que manda para achar onde os dados
       começam. Confiar no central é o erro clássico de quem escreve isto. */
    if (dv.getUint32(offLocal, true) !== ASSINATURA_LOCAL) throw new Error("local-corrompido");
    const nomeTamL  = dv.getUint16(offLocal + 26, true);
    const extraTamL = dv.getUint16(offLocal + 28, true);
    const inicio    = offLocal + 30 + nomeTamL + extraTamL;

    entradas.set(nome, { metodo, dados: bytes.subarray(inicio, inicio + compTam) });
    p += 46 + nomeTam + extraTam + comentTam;
  }
  return entradas;
}

/** Descomprime uma entrada e devolve o texto. `null` quando ela não existe. */
async function lerEntrada(entradas, nome) {
  const entrada = entradas.get(nome);
  if (!entrada) return null;

  /* Método 0 é "guardado sem comprimir", e acontece em arquivos pequenos. */
  if (entrada.metodo === 0) return new TextDecoder().decode(entrada.dados);
  if (entrada.metodo !== 8) throw new Error("compresion-" + entrada.metodo);

  if (typeof DecompressionStream === "undefined") throw new Error("sin-decompression");

  /* Os bytes vão ao descompressor por um `ReadableStream` de um pedaço só, e não
     por um `Blob`: o Blob era um intermediário que só existia para ter um
     `.stream()`, e é uma peça a mais da plataforma para dar errado. Aqui o dado
     entra direto, e o `Response` é quem junta a saída e a decodifica como UTF-8. */
  const fluxo = new ReadableStream({
    start(controlador) {
      /* A cópia com `slice` é de propósito: `subarray` compartilha memória com o
         buffer do arquivo inteiro, e um stream que recebe uma vista de um bloco
         maior pode ser lido além do que lhe cabe. */
      controlador.enqueue(entrada.dados.slice());
      controlador.close();
    },
  }).pipeThrough(new DecompressionStream("deflate-raw"));

  return await new Response(fluxo).text();
}

/** "BC" -> 54. A coluna vem no atributo `r` da célula, como "BC12". */
function colunaParaIndice(letras) {
  let n = 0;
  for (let i = 0; i < letras.length; i++) n = n * 26 + (letras.charCodeAt(i) - 64);
  return n - 1;
}

/** O texto de um `<si>` ou `<is>`: junta os pedaços de texto rico, se houver. */
function textoDe(no) {
  if (!no) return "";
  const partes = no.getElementsByTagName("t");
  let s = "";
  for (let i = 0; i < partes.length; i++) s += partes[i].textContent;
  return s;
}

function xml(texto) {
  const doc = new DOMParser().parseFromString(texto, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("xml-invalido");
  return doc;
}

/**
 * Lê o .xlsx e devolve `{ aba, filas }` — filas como matriz de valores crus,
 * onde cada célula é string, número ou `null`.
 *
 * A ABA é a PRIMEIRA do livro, e é decisão: uma base de ERP exportada tem uma
 * aba. Se um dia tiver mais, é aqui que entra o seletor, e o painel de
 * mapeamento é onde ele aparece.
 */
async function lerXlsx(buffer) {
  const entradas = abrirZip(buffer);

  /* A aba não se acha pelo nome do arquivo: o livro aponta para ela por um id de
     relação, e o arquivo de relações diz a que caminho aquele id corresponde.
     Chutar "xl/worksheets/sheet1.xml" funciona quase sempre, e "quase" é o que
     faz uma importação falhar num arquivo por mês sem ninguém entender por quê. */
  const livroTexto = await lerEntrada(entradas, "xl/workbook.xml");
  if (!livroTexto) throw new Error("sin-workbook");
  const livro = xml(livroTexto);
  const abas = livro.getElementsByTagName("sheet");
  if (!abas.length) throw new Error("sin-hojas");

  const nomeAba = abas[0].getAttribute("name") || "";
  const idRel   = abas[0].getAttribute("r:id") || abas[0].getAttributeNS(
    "http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");

  let caminho = "xl/worksheets/sheet1.xml";
  const relsTexto = await lerEntrada(entradas, "xl/_rels/workbook.xml.rels");
  if (relsTexto && idRel) {
    const rels = xml(relsTexto).getElementsByTagName("Relationship");
    for (let i = 0; i < rels.length; i++) {
      if (rels[i].getAttribute("Id") !== idRel) continue;
      const alvo = rels[i].getAttribute("Target") || "";
      /* O alvo pode vir relativo à pasta xl/ ("worksheets/sheet1.xml") ou
         absoluto desde a raiz do pacote ("/xl/worksheets/sheet1.xml"). */
      caminho = alvo.startsWith("/") ? alvo.slice(1) : "xl/" + alvo.replace(/^\.\//, "");
      break;
    }
  }

  /* As strings compartilhadas: quando o Excel repete um texto, ele guarda o
     texto UMA vez aqui e a célula fica só com o índice. Esta base não tem o
     arquivo (o exportador gravou tudo inline), e outras têm — as duas formas
     precisam funcionar. */
  const compartilhadas = [];
  const ssTexto = await lerEntrada(entradas, "xl/sharedStrings.xml");
  if (ssTexto) {
    const itens = xml(ssTexto).getElementsByTagName("si");
    for (let i = 0; i < itens.length; i++) compartilhadas.push(textoDe(itens[i]));
  }

  const abaTexto = await lerEntrada(entradas, caminho);
  if (!abaTexto) throw new Error("sin-hoja-datos");

  const filas = [];
  const nosFila = xml(abaTexto).getElementsByTagName("row");
  for (let i = 0; i < nosFila.length; i++) {
    const celulas = nosFila[i].getElementsByTagName("c");
    const fila = [];
    for (let j = 0; j < celulas.length; j++) {
      const c   = celulas[j];
      const ref = c.getAttribute("r") || "";
      const cas = ref.match(/^([A-Z]+)/);
      const col = cas ? colunaParaIndice(cas[1]) : fila.length;
      const tipo = c.getAttribute("t");
      const nosV = c.getElementsByTagName("v");
      const bruto = nosV.length ? nosV[0].textContent : null;

      let valor = null;
      if (tipo === "s") {
        /* Índice na tabela de strings compartilhadas. */
        valor = compartilhadas[Number(bruto)] ?? null;
      } else if (tipo === "inlineStr") {
        valor = textoDe(c.getElementsByTagName("is")[0]);
      } else if (tipo === "str") {
        /* Resultado de FÓRMULA que deu texto. */
        valor = bruto;
      } else if (tipo === "b") {
        valor = bruto === "1";
      } else if (tipo === "e") {
        /* Célula de erro (#N/A, #DIV/0!): vira vazio, e não o texto do erro. */
        valor = null;
      } else if (bruto !== null && bruto !== "") {
        const n = Number(bruto);
        valor = Number.isFinite(n) ? n : bruto;
      }
      fila[col] = valor;
    }
    filas.push(fila);
  }
  return { aba: nomeAba, filas };
}

/* ===========================================================================
   4. O LEITOR DE CSV.

   Existe por DOIS motivos, e não por completude: é a saída para o navegador que
   não tem `DecompressionStream`, e é o que muitos ERPs exportam direto.

   O separador é ADIVINHADO na primeira linha, entre `;` `,` e tab. Fixar em um
   deles é garantir que metade dos arquivos abre numa coluna só: o Excel do
   Paraguai e do Brasil grava com ponto e vírgula, o mundo anglófono com vírgula.
=========================================================================== */

function lerCsv(texto) {
  /* O BOM que o Excel grava no começo é invisível, e sem tirá-lo o primeiro
     cabeçalho fica com um caractere fantasma que nenhuma comparação acerta. */
  if (texto.charCodeAt(0) === 0xfeff) texto = texto.slice(1);

  const primeira = texto.slice(0, texto.search(/\r?\n/) + 1 || texto.length);
  const cont = (ch) => (primeira.split(ch).length - 1);
  const sep = cont(";") >= cont("\t") && cont(";") >= cont(",") ? ";"
            : cont("\t") >= cont(",") ? "\t" : ",";

  /* Máquina de estados, e não `split`: um campo entre aspas pode conter o
     separador e até quebra de linha, e é aí que o `split` corta no lugar errado. */
  const filas = [];
  let fila = [], campo = "", dentro = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (dentro) {
      if (ch === '"') {
        if (texto[i + 1] === '"') { campo += '"'; i++; }  /* aspas dobrada = literal */
        else dentro = false;
      } else campo += ch;
    } else if (ch === '"') {
      dentro = true;
    } else if (ch === sep) {
      fila.push(campo); campo = "";
    } else if (ch === "\n") {
      fila.push(campo); filas.push(fila); fila = []; campo = "";
    } else if (ch !== "\r") {
      campo += ch;
    }
  }
  if (campo !== "" || fila.length) { fila.push(campo); filas.push(fila); }

  return {
    aba: "CSV",
    filas: filas.map((f) => f.map(paraNumeroDeCsv)),
  };
}

/**
 * Um campo de CSV vira número, decidindo QUAL sinal é o decimal.
 *
 * É uma ambiguidade de verdade, não um detalhe: "1.234" é mil duzentos e trinta e
 * quatro num Excel e é um vírgula duzentos e trinta e quatro noutro, e o texto é o
 * mesmo. Sem uma regra explícita, uma coluna de estoque entra na tela multiplicada
 * ou dividida por mil e ninguém percebe, porque os dois números são plausíveis.
 *
 * TRÊS REGRAS, nesta ordem:
 *
 *   Os DOIS sinais presentes  ->  o ÚLTIMO é o decimal, o outro é milhar.
 *                                 Resolve "1.234,5" e "1,234.5" de uma vez, sem
 *                                 precisar saber de que país veio o arquivo.
 *
 *   UM sinal, REPETIDO        ->  é milhar. "1.234.567" não tem duas partes
 *                                 decimais; ninguém escreve isso.
 *
 *   UM sinal, UMA vez         ->  é DECIMAL. Aqui está a escolha, e ela é do
 *                                 idioma: em espanhol do Paraguai e português do
 *                                 Brasil a vírgula é decimal, e "1.234" com ponto
 *                                 sozinho se lê milhar.
 *
 * A REGRA ANTERIOR ERRAVA no arquivo que esta tela exporta. Ela só aceitava
 * vírgula decimal com uma ou duas casas, e o total de estoque desta base sai com
 * três ("3220396,711"): reimportar o próprio CSV virava 3.220.396.711, mil vezes
 * o valor certo. Uma ferramenta que não consegue ler o que ela mesma escreve é o
 * tipo de defeito que só aparece no dia em que alguém precisa dela.
 */
function paraNumeroDeCsv(v) {
  const s = String(v ?? "").trim();
  if (s === "") return null;
  /* Só tenta converter o que é dígito e separador: "PROD-0000010" fica texto. */
  if (!/^-?[\d.,]+$/.test(s)) return s;

  const pontos = (s.match(/\./g) || []).length;
  const virgulas = (s.match(/,/g) || []).length;

  let limpo;
  if (pontos && virgulas) {
    const decimal = s.lastIndexOf(".") > s.lastIndexOf(",") ? "." : ",";
    const milhar = decimal === "." ? "," : ".";
    limpo = s.split(milhar).join("").replace(decimal, ".");
  } else if (pontos > 1 || virgulas > 1) {
    limpo = s.replace(/[.,]/g, "");
  } else {
    limpo = s.replace(",", ".");
  }

  const n = Number(limpo);
  return Number.isFinite(n) ? n : s;
}

/* ===========================================================================
   5. RECONHECER AS COLUNAS.

   O problema real: a próxima planilha não vai ter as colunas desta. E esta já é
   um caso difícil — o cabeçalho está PARTIDO em duas filas, porque quem exportou
   fez um pivot:

       fila 1:            | Medidas  | En Stock | Pedido Cartera
       fila 2:  ItemCode  | ItemName |          |
       fila 3:  PROD-...  | INTIMIDAR| 4935     | 5468

   COMO A PRIMEIRA FILA DE DADO É ACHADA: é a primeira em que há dois ou mais
   números. Cabeçalho é texto; dado de estoque é número. Contar dois, e não um,
   evita cair numa fila de título que tenha um ano solto.

   COMO O CABEÇALHO É MONTADO: para cada coluna, vale o texto MAIS BAIXO acima do
   dado — o mais perto dele. Juntar tudo de cima para baixo daria "Medidas
   ItemName" na coluna B; pegar só a primeira fila deixaria a coluna A sem nome.
   O mais baixo dá exatamente ItemCode, ItemName, En Stock, Pedido Cartera.

   COMO O PAPEL DE CADA COLUNA É DECIDIDO: pelo CONTEÚDO, nunca pelo nome do
   cabeçalho. Nome de coluna muda de idioma, de sistema e de humor; conteúdo não.
   Coluna com 70% ou mais de números é MEDIDA. Das colunas de texto, a de valores
   mais curtos e todos distintos é o CÓDIGO, e a mais comprida é o NOME.
=========================================================================== */

/**
 * O PAPEL de cada coluna da planilha, decidido na leitura.
 *
 *   codigo    identifica a fila e e a chave das correcoes
 *   nombre    o nome do produto, que rotula a fila
 *   medida    numero que vem do ERP e e FATO: estoque, pedido. Ninguem corrige.
 *   editable  numero que e DECISAO: o que planejar, o que comprar. Corrigivel.
 *   texto     grupo, provedor, e o que mais vier
 *
 * `medida` e `editable` aparecem iguais na grade e somam iguais no total. A unica
 * diferenca e que a segunda abre para digitar quando o botao Editar esta ligado.
 */


/**
 * QUAIS COLUNAS DE NÚMERO NASCEM EDITÁVEIS.
 *
 * Pelo TÍTULO, e é o único lugar do reconhecimento em que o título manda — em
 * todo o resto quem decide é o conteúdo. Aqui não há alternativa: "1.056.020" na
 * coluna de estoque e "994.940" na coluna a comprar são o mesmo tipo de dado, e
 * nada no número diz que um é fato e o outro é decisão. Quem diz é o nome.
 *
 * E quando o nome não disser, o painel de mapeamento corrige em dois cliques —
 * que é justamente por que ele existe.
 */
const TITULO_EDITAVEL = /comprar|compra|ajustad|pmk|pedir|sugerid/i;

/* ---------------------------------------------------------------------------
   AS COLUNAS DE MÊS DA PLANILHA, e por que elas somem da grade.

   A base real trouxe DUAS colunas para a mesma coisa, e nenhuma delas utilizável
   como estava:

     "Chegada Estimada"  o nome certo, a coluna VAZIA
     "Enero"             o nome errado, e é ela que tem o dado:
                         "Septiembre", "Octubre", "Noviembre"

   Alguém exportou uma planilha de planejamento mensal, o cabeçalho da coluna do
   mês ficou congelado em "Enero", e a coluna criada depois para corrigir isso
   nunca foi preenchida.

   AS DUAS SOMEM DA GRADE, e no lugar delas fica UMA coluna — a Chegada Estimada,
   com o seletor dos doze meses. Duas colunas para um dado é o que produziu este
   problema, e repeti-las na tela seria carregar o defeito para frente.

   O DADO DA "ENERO" NÃO SE PERDE: ele entra como valor inicial do seletor. São
   117 meses já preenchidos, e descartá-los obrigaria alguém a redigitar um por um
   o que já estava certo no arquivo. Quem quiser trocar, troca no seletor.

   COMO ELAS SÃO ACHADAS, e é por CONTEÚDO antes de título: uma coluna de texto
   cujos valores são nomes de mês É uma coluna de mês, chame-se ela como se
   chamar. O título só é consultado para achar a coluna VAZIA, que não tem
   conteúdo para delatá-la.
--------------------------------------------------------------------------- */

/**
 * O título de uma coluna de CHEGADA que veio vazia.
 *
 * Só o título serve para achá-la, porque não há conteúdo para delatá-la — é
 * exatamente o campo que ninguém preencheu.
 */
const TITULO_DE_CHEGADA = /chegada|llegada|estimad|\bmes\b|\bm[eê]s\b/i;

/**
 * UMA COLUNA CHAMADA COM O NOME DE UM MÊS sai da grade, e o conteúdo dela não
 * muda essa decisão.
 *
 * A base real trouxe "Enero" cheia de nomes de mês, e o conteúdo já bastaria para
 * reconhecê-la. Mas a mesma exportação pode trazer "Enero" cheia de NÚMEROS — é o
 * que sobra de uma planilha de planejamento com uma coluna por mês, da qual só a
 * primeira veio. Nesse caso o conteúdo não delata nada: são números como os de
 * estoque, e a coluna entraria na grade como se fosse uma medida, somando na faixa
 * um total que não quer dizer nada.
 *
 * Então quem decide aqui é o TÍTULO, e é a única regra do arquivo em que ele
 * decide sozinho. O motivo é que "Enero" não é o nome de nada nesta tela: numa
 * lista de compra não existe coluna chamada janeiro.
 */
const TITULO_MES_DO_ANO = /^\s*(enero|ene\.?|janeiro|jan\.?)\s*$/i;

/**
 * De nome de mês para número, nos dois idiomas e também abreviado.
 *
 * Montado uma vez, na carga. `Intl` dá os nomes de cada idioma, e a chave é o nome
 * sem acento e em minúscula — é o que faz "Setembro", "setembro" e "SETEMBRO"
 * caírem todos no mesmo lugar.
 */
const MESES_POR_NOME = (() => {
  const mapa = new Map();
  for (const local of ["es-PY", "pt-BR"]) {
    for (let m = 1; m <= 12; m++) {
      const data = new Date(2026, m - 1, 1);
      for (const estilo of ["long", "short"]) {
        /* O "short" vem com ponto em alguns idiomas ("sept."): sem tirá-lo, o
           "sep" que a planilha traz não casaria. */
        mapa.set(chaveDeMes(new Intl.DateTimeFormat(local, { month: estilo }).format(data)), m);
      }
    }
  }
  return mapa;
})();

/**
 * O texto de um mês reduzido à forma que serve de chave: sem acento, minúsculo,
 * sem espaço estranho e sem o ponto da abreviatura.
 *
 * Declarada como `function` de propósito: `MESES_POR_NOME` a chama durante a
 * própria carga, e uma `const` ainda não teria valor nesse instante.
 */
function chaveDeMes(texto) {
  return String(texto ?? "")
    .replace(/[\u00a0\u2000-\u200a\u202f\u205f\u3000]/g, " ")
    .replace(/\s+/g, " ").trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/\.$/, "");
}

/** O número do mês que um valor de célula representa, ou 0. */
function mesDoTexto(valor) {
  if (typeof valor === "number") return valor >= 1 && valor <= 12 ? valor : 0;
  const limpo = chaveDeMes(valor);
  return limpo ? (MESES_POR_NOME.get(limpo) || 0) : 0;
}

function reconhecer(filas) {
  /* Fila vazia não conta para nada: uma linha em branco entre o título e o
     cabeçalho é comum, e ela deslocaria a contagem toda. */
  const cheia = (f) => f && f.some((v) => v !== null && v !== undefined && v !== "");
  const eNumero = (v) => typeof v === "number" && Number.isFinite(v);

  let primeiraDeDado = -1;
  for (let i = 0; i < filas.length; i++) {
    if (!cheia(filas[i])) continue;
    if (filas[i].filter(eNumero).length >= 2) { primeiraDeDado = i; break; }
  }
  /* Sem duas colunas de número em fila nenhuma, ainda vale tentar: a segunda
     fila cheia passa a ser o dado, e o mapeamento fica a cargo de quem olha. */
  if (primeiraDeDado < 0) {
    const cheias = filas.map((f, i) => (cheia(f) ? i : -1)).filter((i) => i >= 0);
    if (cheias.length < 2) return null;
    primeiraDeDado = cheias[1];
  }

  const dados = filas.slice(primeiraDeDado).filter(cheia);
  const largura = Math.max(0, ...filas.map((f) => (f ? f.length : 0)));

  /* O cabeçalho: o texto mais BAIXO acima da primeira fila de dado. */
  const titulos = [];
  for (let c = 0; c < largura; c++) {
    let titulo = "";
    for (let i = primeiraDeDado - 1; i >= 0; i--) {
      const v = filas[i] ? filas[i][c] : null;
      if (v !== null && v !== undefined && String(v).trim() !== "") {
        titulo = String(v).trim();
        break;
      }
    }
    titulos.push(titulo);
  }

  const classificado = classificarColunas(titulos, dados);
  if (!classificado) return null;
  return { ...classificado, filas: dados };
}

/**
 * O PERFIL e o PAPEL de cada coluna, a partir dos titulos e das filas de dado.
 *
 * Vive separada da deteccao de cabecalho porque tem DOIS chamadores, e o segundo
 * e a razao de ela existir: ao ABRIR a pagina com uma base guardada, as colunas
 * sao reclassificadas por estas mesmas regras.
 *
 * POR QUE ISSO IMPORTA: a base fica no navegador entre sessoes. Antes, ela era
 * aceita exatamente como estava guardada — e uma base importada por uma versao
 * anterior da pagina carregava o esquema DAQUELA versao para sempre. Foi o que
 * fez a coluna "Enero" continuar na tela depois de a regra que a descarta existir:
 * a regra nova nunca era aplicada ao que ja estava guardado, e a unica saida era
 * apagar a base e importar de novo.
 *
 * Aceitar a base como estava tinha um motivo, e ele deixou de existir: havia um
 * painel para corrigir o papel das colunas a mao, e reclassificar jogava essa
 * correcao fora a cada recarga. O painel saiu; a classificacao passa a ser sempre
 * automatica, e portanto sempre a atual.
 */
function classificarColunas(titulos, dados) {
  const eNumero = (v) => typeof v === "number" && Number.isFinite(v);
  const largura = Math.max(titulos.length, ...dados.map((f) => (f ? f.length : 0)));

  /* O perfil de cada coluna, medido no dado e não adivinhado no nome. */
  const perfis = [];
  for (let c = 0; c < largura; c++) {
    let numeros = 0, preenchidas = 0, soma = 0, meses = 0;
    const distintos = new Set();
    for (const f of dados) {
      const v = f[c];
      if (v === null || v === undefined || v === "") continue;
      preenchidas++;
      if (eNumero(v)) numeros++;
      else { distintos.add(String(v)); soma += String(v).length; }
      if (mesDoTexto(v)) meses++;
    }
    const textos = preenchidas - numeros;
    perfis.push({
      indice: c,
      titulo: titulos[c] || ("#" + (c + 1)),
      preenchidas,
      /* Que fracao dos valores desta coluna e NOME DE MES. E por este numero que
         a coluna "Enero" cheia de "Septiembre" se delata, sem depender do titulo. */
      mesesReconhecidos: preenchidas ? meses / preenchidas : 0,
      proporcaoNumerica: preenchidas ? numeros / preenchidas : 0,
      /* Comprimento médio e unicidade: é o par que separa código de nome. */
      comprimentoMedio: textos ? soma / textos : 0,
      todosDistintos: textos > 0 && distintos.size === textos,
    });
  }

  /* AS COLUNAS DE MÊS: achadas por conteúdo (a maioria dos valores é nome de mês)
     ou, quando a coluna está vazia, pelo título. Elas saem da grade e viram o
     valor inicial do seletor de Chegada Estimada. Ver o bloco de comentário em
     `TITULO_DE_MES`. */
  const deMes = perfis.filter((p) => {
    if (p.proporcaoNumerica >= 0.7) return false;   /* número não é nome de mês */
    if (p.mesesReconhecidos >= 0.6) return true;    /* "Septiembre", "Octubre"… */
    /* Coluna VAZIA com nome de campo de chegada: ninguém a preencheu. */
    return p.preenchidas === 0 && TITULO_DE_CHEGADA.test(p.titulo);
  });
  /* Só quem TEM mês serve de valor inicial para o seletor. */
  const indicesDeMes = deMes.filter((p) => p.mesesReconhecidos >= 0.6).map((p) => p.indice);

  /* TRÊS razões para uma coluna não chegar à tela:
       não tem NADA em fila nenhuma           ela não existe
       é coluna de mês/chegada                virou o seletor
       chama-se com o nome de um mês          ver `TITULO_MES_DO_ANO` */
  const fora = new Set([
    ...deMes.map((p) => p.indice),
    ...perfis.filter((p) => TITULO_MES_DO_ANO.test(p.titulo)).map((p) => p.indice),
  ]);
  const usadas = perfis.filter((p) => p.preenchidas > 0 && !fora.has(p.indice));
  if (!usadas.length) return null;

  const papeis = {};
  for (const p of usadas) {
    if (p.proporcaoNumerica < 0.7) { papeis[p.indice] = "texto"; continue; }
    /* Coluna de número: FATO ou DECISÃO. Ver `TITULO_EDITAVEL`. */
    papeis[p.indice] = TITULO_EDITAVEL.test(p.titulo) ? "editable" : "medida";
  }

  /* Entre as de texto, o CÓDIGO é a curta e sem repetição; o NOME é a comprida.
     Havendo só uma coluna de texto, ela é o NOME: sem nome a fila não se lê, e
     um código sozinho numa grade de 329 filas não diz nada a ninguém. */
  const textuais = usadas.filter((p) => papeis[p.indice] === "texto");
  if (textuais.length === 1) {
    papeis[textuais[0].indice] = "nombre";
  } else if (textuais.length > 1) {
    const porNome = [...textuais].sort((a, b) => b.comprimentoMedio - a.comprimentoMedio);
    papeis[porNome[0].indice] = "nombre";
    const candidatas = textuais.filter((p) => p.indice !== porNome[0].indice);
    const codigo = candidatas.find((p) => p.todosDistintos) || candidatas[0];
    if (codigo) papeis[codigo.indice] = "codigo";
  }

  /* O MES DE CADA FILA, tirado das colunas de mes antes de elas desaparecerem.
     Guardado por CHAVE DO ITEM (o codigo), como as correcoes, para o valor
     reencontrar o produto na proxima importacao mesmo em outra ordem. */
  const colCodigo = usadas.find((p) => papeis[p.indice] === "codigo") || null;
  const colNome   = usadas.find((p) => papeis[p.indice] === "nombre") || null;
  const mesesDaPlanilha = {};
  if (indicesDeMes.length) {
    for (const f of dados) {
      let mes = 0;
      for (const i of indicesDeMes) { mes = mesDoTexto(f[i]); if (mes) break; }
      if (!mes) continue;
      const codigo = colCodigo ? String(f[colCodigo.indice] ?? "").trim() : "";
      const chave = codigo || normalizarEspacos(colNome ? f[colNome.indice] : "");
      if (chave) mesesDaPlanilha[chave] = mes;
    }
  }

  return {
    colunas: usadas.map((p) => ({ indice: p.indice, titulo: p.titulo, papel: papeis[p.indice] })),
    mesesDaPlanilha,
  };
}

/**
 * Reaplica as regras de coluna a uma base que veio do armazenamento.
 *
 * Devolve `true` quando algo mudou, para o chamador poder regravar.
 *
 * Os TÍTULOS são reconstruídos a partir das colunas guardadas, e não relidos do
 * arquivo — o arquivo não está mais aqui, só as filas de dado. Isso basta: título
 * e conteúdo são tudo de que a classificação precisa.
 *
 * As COLUNAS DE MÊS que sobraram na base antiga são achadas de novo pelo conteúdo
 * ("Abril", "Septiembre") e o mês delas é recolhido antes de elas saírem — então
 * quem tinha o mês na planilha não perde nada ao abrir a página atualizada, e não
 * precisa reimportar.
 */
function renormalizarBase(base) {
  if (!base || !Array.isArray(base.colunas) || !Array.isArray(base.filas)) return false;

  const titulos = [];
  for (const c of base.colunas) titulos[c.indice] = c.titulo;
  /* Buraco no meio (coluna já descartada antes) fica como texto vazio, e não
     `undefined`: as expressões de título fazem `test()` no valor. */
  for (let i = 0; i < titulos.length; i++) if (titulos[i] == null) titulos[i] = "";

  const refeito = classificarColunas(titulos, base.filas);
  if (!refeito) return false;

  const antes = JSON.stringify(base.colunas);
  base.colunas = refeito.colunas;

  /* O mês recolhido agora manda: ele saiu das mesmas filas, com as regras de
     hoje. O que já estava guardado é mantido só onde o novo não achou nada. */
  base.mesesDaPlanilha = { ...(base.mesesDaPlanilha || {}), ...refeito.mesesDaPlanilha };

  return JSON.stringify(base.colunas) !== antes;
}

/* ===========================================================================
   6. ONDE A BASE FICA GUARDADA.

   IndexedDB, e não localStorage: localStorage tem 5 MB e guarda texto, e uma
   base de dez mil filas passa disso. Também é o que o protótipo do Plan de
   Ventas já usava, e continuar no mesmo lugar poupa uma migração no dia em que
   isto virar código de verdade.

   Guardar a base é o que faz recarregar a página não custar um novo arrasto —
   e é por isso que existe o botão de APAGAR, com confirmação: dado da Somax que
   fica no navegador tem de ter uma saída explícita.
=========================================================================== */

const BANCO = "plan-compra", ARMAZEM = "base";

/**
 * DUAS CHAVES no mesmo armazém, e a separação é a decisão importante.
 *
 * `atual` guarda o que veio da PLANILHA. `edicoes` guarda o que foi DIGITADO na
 * tela. Se as duas coisas morassem juntas, importar a base nova apagaria o
 * trabalho de quem digitou — e importar a base nova é exatamente o que se faz
 * toda semana, porque estoque e pedido mudam. É a mesma ideia do preço que
 * congela no plano do Plan de Ventas: o que a pessoa decidiu não se recalcula
 * porque o cadastro andou.
 *
 * As edições são casadas por CÓDIGO DO ITEM (o `ItemCode`), não pela posição da
 * fila: a exportação do ERP não sai na mesma ordem duas vezes, e por posição o
 * valor digitado no DESTROYER apareceria no PALAS na semana seguinte.
 */
const CHAVE = "atual", CHAVE_EDICOES = "edicoes", CHAVE_STOCK = "stock";

function abrirBanco() {
  return new Promise((ok, falha) => {
    const pedido = indexedDB.open(BANCO, 1);
    pedido.onupgradeneeded = () => pedido.result.createObjectStore(ARMAZEM);
    pedido.onsuccess = () => ok(pedido.result);
    pedido.onerror = () => falha(pedido.error);
  });
}

async function gravar(chave, valor) {
  try {
    const db = await abrirBanco();
    await new Promise((ok, falha) => {
      const tx = db.transaction(ARMAZEM, "readwrite");
      tx.objectStore(ARMAZEM).put(valor, chave);
      tx.oncomplete = ok; tx.onerror = () => falha(tx.error);
    });
    db.close();
  } catch (e) {
    /* Navegação privada bloqueia IndexedDB. Não guardar é ruim; não ABRIR a
       planilha por causa disso seria pior, então o erro só é registrado. */
    console.warn("no se pudo guardar:", chave, e);
  }
}

async function ler(chave) {
  try {
    const db = await abrirBanco();
    const valor = await new Promise((ok, falha) => {
      const p = db.transaction(ARMAZEM, "readonly").objectStore(ARMAZEM).get(chave);
      p.onsuccess = () => ok(p.result ?? null);
      p.onerror = () => falha(p.error);
    });
    db.close();
    return valor;
  } catch { return null; }
}

async function remover(chave) {
  try {
    const db = await abrirBanco();
    await new Promise((ok) => {
      const tx = db.transaction(ARMAZEM, "readwrite");
      tx.objectStore(ARMAZEM).delete(chave);
      tx.oncomplete = ok; tx.onerror = ok;
    });
    db.close();
  } catch { /* nada a fazer: sem banco, não havia o que apagar */ }
}

/* ---------------------------------------------------------------------------
   O TRABALHO INTEIRO NUM ARQUIVO: exportar e importar.

   Nada a ver com importar planilha. A planilha é o DADO QUE CHEGA do ERP; isto é o
   TRABALHO — as duas planilhas mais tudo o que foi decidido em cima delas: código
   corrigido, máscara de nome, fornecedor, grupo, PMK, A Comprar, mês de chegada,
   produto desligado, ordem das colunas, colunas escondidas. Mandar a planilha para
   outra pessoa manda o ponto de partida; mandar isto manda o trabalho.

   POR QUE JSON, e não Excel ou txt:

   · ELE VOLTA IGUAL. É a forma exata do que a ferramenta guarda, então o que sai é
     o que entra — sem conversão, sem arredondamento, sem "qual coluna era esta".
     Excel obrigaria a achatar as correções em linhas e colunas, e a volta seria uma
     adivinhação: uma máscara vazia e uma máscara apagada viram a mesma célula.
   · ELE NÃO CUSTA DEPENDÊNCIA. `JSON.stringify` e `JSON.parse` vêm no navegador.
     Escrever xlsx exigiria um escritor de ZIP — a página só sabe LER — e isso é
     código novo para resolver um problema que não é o desta função.
   · ELE É UM ARQUIVO DE SALVAMENTO, não um relatório. Quem quer relatório usa o
     Copiar para planilha, que é outro caminho e continua lá.

   O que se perde: não se abre no Excel para conferir à mão. É o preço certo — este
   arquivo é para a ferramenta ler, não para uma pessoa editar.

   E ELE TEM DADO DA EMPRESA DENTRO. O `.gitignore` bloqueia `*.json` justamente por
   isso: o arquivo é para trocar entre pessoas, nunca para entrar no repositório.
--------------------------------------------------------------------------- */

const MARCA_RESPALDO = "plan-de-compra";
const VERSAO_RESPALDO = 1;

/** Tudo o que a ferramenta sabe, num objeto só. */
function montarRespaldo() {
  return {
    app: MARCA_RESPALDO,
    versao: VERSAO_RESPALDO,
    em: Date.now(),
    base: estado.base,
    stock: estado.stock,
    edicoes: estado.edicoes,
    /* AS PREFERÊNCIAS DE VISTA VÃO JUNTO. Elas não são dado, mas são trabalho: quem
       arrastou as colunas e escondeu três delas arrumou a tela para o jeito de
       trabalhar da casa, e isso é o que a outra pessoa quer receber. */
    vista: {
      ordem: estado.ordem,
      selecoes: estado.selecoes,
      busca: estado.busca,
      ordemColunas: estado.ordemColunas,
      ocultas: colunasOcultas ? [...colunasOcultas] : null,
    },
    diario: estado.diario,
  };
}

/**
 * Baixa o arquivo. O nome leva a DATA, porque vão existir vários: quem manda o
 * trabalho de hoje e o de semana que vem não quer os dois chamados igual.
 */
function exportarTudo() {
  const dados = JSON.stringify(montarRespaldo(), null, 1);
  const arquivo = new Blob([dados], { type: "application/json" });
  const url = URL.createObjectURL(arquivo);
  const a = document.createElement("a");
  const d = new Date();
  const doisDigitos = (x) => String(x).padStart(2, "0");
  a.href = url;
  a.download = MARCA_RESPALDO + "-" + d.getFullYear()
    + doisDigitos(d.getMonth() + 1) + doisDigitos(d.getDate()) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  /* O endereço do Blob é liberado depois: revogando na mesma linha, o navegador às
     vezes não chega a começar a baixa. */
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  anotar("logExportou", "");
  avisar(t("respaldoOk"));
}

/**
 * Adota um arquivo de respaldo. SUBSTITUI TUDO, e por isso pergunta antes.
 *
 * A PENEIRA É DURA: sem a marca do aplicativo, o arquivo não é lido. É um arquivo que
 * chega de fora, e trocar a base inteira por um JSON qualquer que alguém arrastou
 * seria perder o trabalho sem nem uma mensagem.
 */
async function importarRespaldo(arquivo) {
  esconderErro();
  try {
    const lido = JSON.parse(await arquivo.text());
    if (!lido || lido.app !== MARCA_RESPALDO) {
      return mostrarErro(t("erroRespaldo"), t("erroRespaldoDet"));
    }
    if (!confirm(t("confirmarRespaldo"))) return;

    estado.base = (lido.base && lido.base.filas) ? lido.base : null;
    estado.stock = (lido.stock && lido.stock.valores) ? lido.stock : null;
    estado.edicoes = (lido.edicoes && typeof lido.edicoes === "object") ? lido.edicoes : {};
    estado.diario = Array.isArray(lido.diario) ? lido.diario.slice(0, DIARIO_MAX) : [];

    const v = lido.vista || {};
    estado.ordem = (v.ordem && typeof v.ordem === "object")
      ? { chave: v.ordem.chave ?? null, desc: Boolean(v.ordem.desc) }
      : { chave: null, desc: false };
    estado.selecoes = (v.selecoes && typeof v.selecoes === "object") ? v.selecoes : {};
    estado.busca = typeof v.busca === "string" ? v.busca : "";
    estado.ordemColunas = Array.isArray(v.ordemColunas) ? v.ordemColunas : null;
    colunasOcultas = Array.isArray(v.ocultas) ? new Set(v.ocultas.map(String)) : null;

    /* GRAVA TUDO, e só depois desenha: quem importou o trabalho de outra pessoa
       fecha o navegador e espera encontrá-lo amanhã. */
    await Promise.all([
      estado.base ? guardar(estado.base) : remover(CHAVE),
      estado.stock ? guardarStock() : remover(CHAVE_STOCK),
      guardarEdicoes(),
    ]);
    guardarVista();
    guardarOrdemColunas();
    guardarColunasOcultas();
    try {
      localStorage.setItem(CHAVE_DIARIO, JSON.stringify(estado.diario));
    } catch (e) { /* aba privada */ }

    estado.gerado = Boolean(estado.base) || Boolean(estado.stock);
    estado.tela = "grade";
    $("busca").value = estado.busca;
    anotar("logImportou", "");
    redesenhar();
    avisar(t("respaldoLido"));
  } catch (e) {
    console.error(e);
    mostrarErro(t("erroRespaldo"), t("erroRespaldoDet"));
  }
}

const guardar          = (base) => gravar(CHAVE, base);
const guardarEdicoes   = () => gravar(CHAVE_EDICOES, estado.edicoes);
const guardarStock     = () => gravar(CHAVE_STOCK, estado.stock);

/* ===========================================================================
   7. O ESTADO DA TELA.

   Um objeto só, e a tela é sempre uma FUNÇÃO dele: mudou o estado, redesenha.
   Guardar pedaços de verdade em variáveis soltas é o que faz duas partes da tela
   discordarem sobre qual filtro está em vigor.
=========================================================================== */

const estado = {
  base: null,      /* { arquivo, aba, importadaEm, colunas, filas } — da PLANILHA */
  edicoes: {},     /* ItemCode -> { titulo da coluna: valor } — CORRIGIDO na tela */
  stock: null,     /* a planilha de estoque, colada por código. Ver `COLUNAS_STOCK` */
  /* A grade abre no botão GERAR, não ao terminar de carregar. Carregar e olhar são
     dois momentos: os cartões existem para conferir o que entrou antes de a tela
     trocar. Fica `true` até a próxima limpeza. */
  gerado: false,
  ordemColunas: null,  /* a ordem arrastada à mão, ou null para a natural */
  busca: "",
  /* id da coluna -> lista de valores MARCADOS no funil. Lista vazia (ou chave
     ausente) quer dizer SEM RESTRIÇÃO, e não "nada": uma tabela sem fila nenhuma
     não responde pergunta nenhuma, então não existe como excluir tudo. */
  selecoes: {},
  /* ASCENDENTE por padrão, porque o padrão é alfabético: de A a Z é a ordem em que
     se procura um nome numa lista. */
  ordem: { chave: null, desc: false },
  /* As dez últimas ações que mexeram no dado. Ver `anotar`. */
  diario: [],
  /* Em qual tela se está: "grade" ou "produtos". Não é guardada no navegador de
     propósito — abrir a ferramenta é abrir a comparação, que é o trabalho; o
     cadastro é uma visita. */
  tela: "grade",
  buscaProd: "",
  /* O recorte e a ordem DO CADASTRO, separados dos da grade: filtrar o cadastro por
     grupo não pode recortar a tela de compra. São duas leituras. */
  selecoesProd: {},
  /* O RECORTE DA ANÁLISE: uma dimensão de cada tipo. Ele não é guardado no
     navegador — é uma pergunta que se faz e se desfaz na sessão, e reabrir a
     ferramenta com um gráfico recortado por um clique de semana passada seria
     mostrar um número parcial como se fosse o total. */
  /* AS CHAVES SÃO AS DOS FUNIS, e não nomes soltos: o painel de funil lê e escreve
     `ctx.selecoes()[String(col.id)]`, então guardar o recorte com os ids das
     dimensões faz o funil da análise funcionar sem uma linha de tradução. */
  recorteAnalise: { "a:grupo": [], "a:provedor": [], "a:produto": [], "a:mes": [] },
  ordemProd: { chave: "p:nome", desc: false },
};

/* ---------------------------------------------------------------------------
   AS TRÊS COLUNAS QUE NÃO VÊM DA PLANILHA.

   Elas são DIGITADAS na tela, e é por isso que existem aqui e não no
   reconhecimento de colunas: a planilha do ERP traz o que a empresa TEM (estoque)
   e o que os clientes JÁ PEDIRAM (pedido em cartera). O que ela não traz, e nem
   poderia, é a DECISÃO de compra — e decisão não se importa, se toma.

   Não há importação para elas, de propósito: a estrutura fica de pé desde já, e
   quem preenche é quem decide, no site.

     PMK        o número que vem do planejamento comercial (Plan de Marketing)
     ajustado   a correção que quem compra faz sobre ele
     aComprar   o que vai virar pedido ao fornecedor

   Os ids são TEXTO ("pmk"), enquanto as colunas da planilha são NÚMERO (o índice
   da coluna no Excel). Não é descuido: é o que deixa as duas famílias
   conviverem na mesma grade sem uma poder ser confundida com a outra.
--------------------------------------------------------------------------- */

/**
 * A ÚNICA coluna que não existe na planilha: QUANDO A COMPRA CHEGA.
 *
 * Ela é a razão de a tela existir e não ser a planilha: um `.xlsx` diz o que
 * comprar, e não diz quando aquilo entra. Sem ela, saber que faltam 994.940 não
 * responde a pergunta que vem depois — dá para esperar?
 *
 * É O MÊS, e não o dia. Compra de insumo agrícola se planeja por mês: ninguém
 * sabe (nem precisa saber) que o navio atraca no dia 15. Um campo de data pedindo
 * dia e ano para uma informação que é "setembro" faz inventar um dia qualquer, e
 * aí o dado passa a mentir uma precisão que não tem.
 *
 * Por ser uma escolha entre doze, é um SELETOR e não um campo de digitar: as doze
 * opções já vêm prontas, ninguém escreve "setembro" errado, e a escolha é de um
 * clique. É guardada como NÚMERO de 1 a 12 — o nome do mês muda com o idioma, o
 * número não, e é ele que ordena na ordem do calendário.
 *
 * O id leva `@` na frente para nunca colidir com o título de uma coluna da
 * planilha: as correções das colunas do arquivo são guardadas PELO TÍTULO, e uma
 * planilha com uma coluna chamada "llegada" sobrescreveria esta.
 */
const COLUNA_CHEGADA = { id: "@llegada", chave: "colLlegada" };

/* ---------------------------------------------------------------------------
   O ESTOQUE, QUE VEM DE OUTRA PLANILHA E ENTRA TODA SEMANA.

   São DOIS arquivos, e é por isso que são duas importações:

     Base_a_comprar_CORRIGIDO.xlsx   quem é o produto e o que se decidiu comprar.
                                     Entra uma vez, e é a BASE.
     Base Stock y Pedido.xlsx        quanto existe e quanto já foi pedido. Entra
                                     TODA SEMANA, porque é isso que muda.

   O que impede de juntar as duas num arquivo só é o ritmo: a base carrega grupo,
   provedor e as decisões de compra, e recarregá-la para atualizar estoque
   significaria trazer decisões velhas de volta. O estoque entra por cima, casado
   pelo CÓDIGO, e não toca em nada além das próprias colunas.

   AS COLUNAS DO ESTOQUE SÃO VIRTUAIS: elas não existem na base, existem no
   `estado.stock` e são desenhadas ANTES do PMK — que é onde a leitura pede por
   elas: o que tem, o que pediram, e só então o que se planejou e o que se compra.

   O ESTOQUE É UMA FOTO, e por isso a importação SUBSTITUI a anterior inteira em
   vez de mesclar item por item. Mesclando, um produto que saiu da planilha de
   estoque (foi descontinuado) ficaria para sempre com o número da semana passada,
   e ninguém descobre olhando a tela.
--------------------------------------------------------------------------- */

/** O prefixo que marca uma coluna vinda do arquivo de estoque. */
const PREFIXO_STOCK = "@stock:";

const idDeStock = (titulo) => PREFIXO_STOCK + titulo;
const ehColunaDeStock = (id) => String(id).startsWith(PREFIXO_STOCK);

/**
 * SALDO VIRTUAL: o que sobra depois de entregar o que já foi pedido.
 *
 *     (En Stock + A Comprar) − Pedido Cartera
 *
 * É a única coluna CALCULADA da tela, e é a que responde a pergunta que a grade
 * existe para responder: comprando o que se decidiu comprar, este produto DÁ para
 * atender a carteira? Positivo sobra, NEGATIVO falta — e um saldo negativo é o
 * aviso de que o `A Comprar` daquela fila está curto.
 *
 * Ela substituiu uma `Cantidad Total` que somava estoque com pedido. Aquela soma
 * dizia "quanto deste produto está envolvido", que não é decisão nenhuma: ninguém
 * compra em função dela. Esta entra na decisão, e por isso vem DEPOIS do mês — no
 * fim da fila, onde a leitura termina e a conclusão aparece.
 *
 * DEPENDE DO `A COMPRAR`, que é editado: mexer nele muda o saldo na hora. É o que
 * torna a tela um instrumento de decisão em vez de um relatório.
 */
const COLUNA_SALDO = { id: "@saldo", chave: "colSaldoVirtual" };

/**
 * As três colunas que entram na conta do saldo, achadas pelo título.
 *
 * Estoque e pedido vêm do arquivo de estoque; `A Comprar` é a coluna de decisão da
 * base. Faltando qualquer uma, o saldo não é calculado — meia conta com nome de
 * total seria pior que coluna nenhuma.
 */
function colunasDoSaldo() {
  const doStock = colunasDeStock();
  const daBase = colunasNumericas();
  /* PELO NOME DO ARQUIVO nas duas listas: o rótulo da coluna de estoque é traduzido
     ("Em Estoque"), e `/stock/i` não casa com ele. Procurar pelo que se lê faria a
     conta do saldo desaparecer só porque a tela mudou de língua. */
  const achar = (padrao) => doStock.find((c) => padrao.test(c.tituloArquivo || c.titulo))
                         || daBase.find((c) => padrao.test(c.titulo));
  const stock = achar(/stock/i);
  const pedido = achar(/pedido/i);
  const { aComprar } = colunasDaTrava();
  /* Os ids diferem: coluna do arquivo de estoque usa `@stock:titulo`, coluna da
     base usa o índice. Cada uma devolve o seu, e quem soma não precisa saber. */
  return {
    stock: stock ? (stock.id ?? stock.indice) : null,
    pedido: pedido ? (pedido.id ?? pedido.indice) : null,
    aComprar: aComprar ? aComprar.indice : null,
    completa: Boolean(stock && pedido && aComprar),
  };
}

/**
 * A MASCARA DO NOME: o nome que o produto tem NA TELA, quando o do arquivo nao
 * serve.
 *
 * O ERP exporta nomes como vieram do cadastro — "CORVUS 608 - 20 Litros",
 * "PARAQUAT SOMAX 240 SL - 20 lt" —, e quem le a grade nem sempre reconhece o
 * produto por ali. A mascara deixa escrever o nome de uso sem tocar na planilha.
 *
 * NAO E A CHAVE. O item continua identificado pelo CODIGO: mudar o nome na tela nao
 * pode desligar o estoque, o mes nem as correcoes daquele item. Por isso ela e
 * guardada como uma correcao qualquer, e a chave dela e o codigo — nunca o nome.
 *
 * VAZIA VOLTA AO NOME DO ARQUIVO, como todo campo desta tela.
 */
const COLUNA_MASCARA = { id: "@mascara", chave: "colMascara" };

/**
 * O CODIGO CORRIGIDO A MAO.
 *
 * Editar o codigo NAO e cosmetico, e por isso ele pede confirmacao: o cruzamento
 * com a planilha de estoque acontece POR CODIGO, e trocar o codigo troca com que
 * item aquele produto casa. E o gesto de quem descobriu que o plano de compra veio
 * com o codigo errado e quer que ele encontre o estoque certo.
 *
 * A CHAVE DO ARMAZENAMENTO CONTINUA SENDO O CODIGO DO ARQUIVO, e nunca o novo.
 * Se ela mudasse junto, a propria correcao que troca o codigo passaria a viver
 * debaixo do codigo novo — e na proxima importacao, quando a fila voltasse com o
 * codigo antigo, nada seria encontrado. O arquivo e a ancora; a correcao e o que
 * se le em cima dele.
 */
const CORRECAO_CODIGO = "@codigo";

/* ---------------------------------------------------------------------------
   PRODUTO ATIVO OU INATIVO.

   As planilhas trazem o cadastro inteiro do ERP, e boa parte dele não é assunto de
   compra: item descontinuado, embalagem que saiu de linha, código criado por
   engano. Eles não somem do arquivo, e por isso apareciam na grade toda semana,
   ocupando fila e entrando nos totais.

   INATIVO É DECISÃO DE QUEM COMPRA, e por isso mora nas correções à mão, junto do
   resto: sobrevive à reimportação, e a planilha não o desfaz.

   A AUSÊNCIA É O ATIVO — só o inativo é guardado. É a diferença entre gravar uma
   marca em trinta produtos e gravar trezentas em todos os outros para dizer o
   óbvio, e é o que faz um cadastro novo já nascer inteiro na grade.
--------------------------------------------------------------------------- */

const CORRECAO_INATIVO = "@inativo";

const estaInativo = (chave) => Boolean(correcoesDe(chave)[CORRECAO_INATIVO]);

/**
 * Grava o ligado/desligado de um produto, e mais nada.
 *
 * Separado do redesenho porque as duas telas querem coisas diferentes: na de
 * produtos a fila fica no lugar e só apaga (ver `recemMexidos`), e em qualquer outro
 * caminho a grade tem de ser refeita.
 */
function gravarAtivo(chave) {
  const atual = { ...correcoesDe(chave) };
  if (atual[CORRECAO_INATIVO]) delete atual[CORRECAO_INATIVO];
  else atual[CORRECAO_INATIVO] = 1;

  if (Object.keys(atual).length) estado.edicoes[chave] = atual;
  else delete estado.edicoes[chave];
  guardarEdicoes();
  anotar(atual[CORRECAO_INATIVO] ? "logInativou" : "logAtivou", rotuloDeChave(chave));
}

/** Liga ou desliga um produto e refaz a tela. */
function alternarAtivo(chave) {
  gravarAtivo(chave);
  redesenhar();
}

/** O nome que se mostra de um produto, achado pela chave de edição. */
function rotuloDeChave(chave) {
  const g = montarGrade({ comInativos: true }).filas.find((f) => f.chaveEdicao === chave);
  return g ? g.rotulo : String(chave);
}

/** As colunas de número que a tela CALCULA ou COLA, e que não existem na base. */
const ehNumericaVirtual = (id) =>
  ehColunaDeStock(id) || String(id) === COLUNA_SALDO.id;

/**
 * A COLUNA DE AÇÕES: o lápis que abre a tela de editar aquele produto.
 *
 * É a PRIMEIRA coluna, e não a última. A última é o lugar natural de uma ação em
 * formulário, e aqui seria o pior lugar: a grade tem dez colunas e rola de lado,
 * então o lápis ficaria fora da vista justamente quando se está lendo o nome do
 * produto para decidir se o edita. Na frente, ele está sempre onde a fila começa.
 *
 * Não tem rótulo no cabeçalho: uma palavra ali nomearia uma coluna que não é dado.
 */
const COLUNA_ACOES = { id: "@acoes" };

/* ---------------------------------------------------------------------------
   NOMES DE COLUNA TROCADOS NA EXIBIÇÃO.

   O ERP exporta "PMK - Ajustado Compra", que é comprido e come a largura de duas
   colunas de número. Na tela ela se chama "PMK Compra".

   O NOME DO ARQUIVO CONTINUA SENDO A IDENTIDADE. As correções à mão são guardadas
   POR TÍTULO DE COLUNA, e renomear a chave apagaria tudo o que já foi corrigido:
   quem digitou em "PMK - Ajustado Compra" na semana passada não encontraria mais o
   valor. Por isso a coluna da grade leva os dois nomes — `titulo` para mostrar e
   `tituloArquivo` para casar com o que está guardado.

   A trava do PMK também continua achando a coluna: ela procura em
   `colunasNumericas()`, que são as colunas DO ARQUIVO, com o nome original.
--------------------------------------------------------------------------- */

/* E OS NOMES TAMBÉM TROCAM DE LÍNGUA. As planilhas saem do ERP em espanhol, e no
   português a tela ficava metade traduzida: "Buscar con palavra chave" em cima de
   uma coluna "En Stock". O cabeçalho é texto de SISTEMA — ele nomeia uma medida, não
   um produto —, e por isso ele se traduz. O que NUNCA se traduz é o conteúdo: nome
   de produto, de grupo e de fornecedor vêm da planilha e ficam como estão.

   A chave de cada linha é a CHAVE DE TEXTO, resolvida em `t()` na hora de mostrar:
   é o que faz o rótulo acompanhar a troca de idioma sem a página recarregar. */
const RENOMES = [
  [/^\s*pmk\b/i,              "colPmk"],
  [/stock|estoque/i,          "colEnStock"],
  [/pedido/i,                 "colPedido"],
  [/^\s*[aá]\s*comprar\b/i,   "colAComprar"],
  [/^\s*c[oó]digo\b/i,        "colCodigo"],
  [/^\s*(provedor|proveedor|fornecedor)\b/i, "colProvedor"],
];

/** O nome que a coluna mostra. Sem regra que case, é o nome do arquivo mesmo. */
function rotuloDaColuna(titulo) {
  for (const [padrao, chave] of RENOMES) if (padrao.test(titulo)) return t(chave);
  return titulo;
}

/**
 * As colunas que o arquivo de estoque trouxe, na ordem em que vieram nele.
 *
 * ELAS TAMBÉM TRADUZEM O RÓTULO, como as da base: em português a tela mostrava
 * "Código · Grupo · Fornecedor" e, ao lado, "En Stock" e "Pedido Cartera" — metade
 * traduzida. O nome do arquivo continua dentro do `id` (`@stock:En Stock`) e em
 * `tituloArquivo`, e é por ele que se casa o valor guardado; o `titulo` é só o que
 * se lê.
 */
const STOCK_CANONICAS = ["En Stock", "Pedido Cartera"];

function colunasDeStock() {
  if (!estado.base && !estado.stock) return [];
  const doArquivo = (estado.stock && Array.isArray(estado.stock.colunas))
    ? estado.stock.colunas : [];
  const cols = doArquivo.map((titulo) => ({
    id: idDeStock(titulo), titulo: rotuloDaColuna(titulo), tituloArquivo: titulo,
    tipo: "num", deStock: true,
  }));

  /* AS DUAS CANÔNICAS EXISTEM SEMPRE, zeradas enquanto o arquivo não vem: a
     estrutura da tela é fixa (ver `CANONICAS`), e estoque e pedido são metade da
     pergunta que ela responde. `valorDeStock` já devolve 0 para item que não está
     no arquivo, então a coluna nasce zerada sem nenhum caso especial.
     SÓ NÃO NASCE se a coluna já existe — no arquivo de estoque OU na base, e aí é
     a da base que apresenta o número. */
  const naBase = colunasDaBase();
