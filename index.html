<!DOCTYPE html>
<html lang="es" data-theme="somax">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan de Compra</title>
<meta name="description" content="Cruce de stock y pedido en cartera por producto. Prototipo sin servidor.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23005c2d'/%3E%3Cpath d='M8 11h16M8 16h11M8 21h13' stroke='%23fcbf0b' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">

<style>
/* ===========================================================================
   PLAN DE COMPRA — protótipo de tela única, sem servidor e sem dependência.

   Nasce como o Plan de Ventas nasceu: um arquivo HTML que abre com dois cliques,
   guarda a base no navegador e serve de ESPECIFICAÇÃO VIVA. O que se decide aqui
   vendo a tela de pé é o que depois se reconstrói em código de verdade.

   TRÊS COISAS QUE ESTE ARQUIVO NÃO FAZ, e todas as três são decisões:

     NÃO CARREGA NADA DA REDE. Nem fonte, nem biblioteca, nem CDN. O leitor de
     .xlsx é escrito aqui embaixo sobre `DecompressionStream`, que todo navegador
     moderno já tem. O arquivo funciona offline, dentro de uma VPN e no GitHub
     Pages sem nenhuma diferença.

     NÃO CARREGA DADO DA SOMAX. Nenhuma planilha vai para o repositório: a base
     entra por arrasto na hora do uso e fica só no navegador de quem abriu
     (IndexedDB). É o que permite o repositório ser público sem vazar estoque.

     NÃO INVENTA REGRA DE COMPRA. Ela mostra o CRUZAMENTO cru que a planilha
     traz — estoque e pedido, por produto — com total, ordenação, filtro e
     exportação. A conta do quanto comprar entra depois, decidida vendo isto
     funcionando, e é por isso que existe um lugar reservado para ela
     (`REGRA_DE_COMPRA`, lá embaixo no script).

   ---------------------------------------------------------------------------
   OS TOKENS DE COR, copiados do Plan de Ventas.

   Nenhuma regra de estilo conhece cor: ela pede um TOKEN pelo PAPEL que a cor
   cumpre. Trocar de tema é trocar o valor do token, nunca o seletor. É o que faz
   um tema novo custar um bloco de CSS em vez de uma varredura pelo arquivo.

     superficie   fundo de caixa, cartão, campo e tabela
     tierra-50    fundo da PÁGINA, atrás das caixas
     tierra-100   separador de linha e realce de passagem do mouse
     tierra-200   a borda de tudo
     tierra-300   placeholder e ícone apagado
     tierra-500   texto secundário: rótulo de coluna, legenda
     tierra-700   texto do corpo
     tierra-900   texto forte, título, número de destaque
     somax-700    SUPERFÍCIE da identidade: a faixa do topo da grade
     somax-500    SUPERFÍCIE do botão primário, que leva texto branco
     somax-100/50 realce claro: linha marcada, pastilha
     accion       cor de TEXTO e de ícone da ação, sobre a superfície
     oro-*        acento e aviso
     azul-*       a ação de CRIAR, que não se confunde com os verdes
     red-*        erro e ação sem volta

   `accion` existe separado de `somax-700` por um motivo que só aparece no tema
   escuro: para o branco ler em cima de uma cor ela precisa ser escura, e para
   ela ler em cima de uma caixa escura precisa ser clara. Um token não cumpre os
   dois papéis, então são dois. Nos temas claros os dois têm o mesmo valor.
=========================================================================== */

:root{
  --superficie:#ffffff;
  --somax-900:#003d1e; --somax-800:#004a24; --somax-700:#005c2d; --somax-600:#006733;
  --somax-500:#007739; --somax-400:#2e9159; --somax-100:#dbebe1; --somax-50:#eaf4ee;
  --accion:#005c2d; --accion-clara:#007739; --chip:#005c2d;
  --oro-500:#f2b704; --oro-600:#d19e03; --oro-700:#7a5c02; --desfazer:#7a5c02;
  --firma:#f2b704;
  --azul-600:#1b63b5; --azul-700:#17518f;
  --tierra-900:#17251e; --tierra-700:#365044; --tierra-500:#66736c; --tierra-300:#a3b0a8;
  --tierra-200:#dde5df; --tierra-100:#e8efea; --tierra-50:#f4f6f3;
  --borda-forte:#d7e2da;
  --faixa-grid:var(--somax-50); --faixa-grid-texto:#53635b;
  --red-50:#fef2f2; --red-100:#fee2e2; --red-200:#fecaca; --red-700:#b91c1c; --red-800:#991b1b;

  /* A LUPA, desenhada UMA vez.
     Ela aparece em dois lugares — a busca larga do topo e o filtro de cada coluna
     de texto — e por isso não é marcação: é uma máscara de CSS. Como máscara, a
     cor vem do `currentColor` de quem a usa, então ela acompanha o tema e acende
     no foco sem existir um segundo arquivo para o estado aceso. Um `<svg>` colado
     nos dois lugares seria duas cópias para manter iguais. */
  --icone-lupa: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><line x1='20.5' y1='20.5' x2='16.2' y2='16.2'/></svg>");

  /* O TIQUE da caixa de marcar. Máscara, pelo mesmo motivo da lupa: a cor sai de
     quem a usa, e `center` centra sem conta em pixels. */
  --icone-tique: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>");

  --fonte:"Segoe UI",system-ui,-apple-system,sans-serif;
  /* As medidas verticais do grid, as mesmas do Plan de Ventas: 37px na fila de
     dado, 36px em toda faixa de comando (cabeçalho, filtro, campo, botão). */
  --altura-linha:37px; --altura-campo:36px;
  /* 20px de respiro de cada lado da célula, 40 entre colunas. Menos que isso e o
     número da direita encosta no rótulo da esquerda da coluna vizinha. */
  --respiro:20px;
  /* O RESPIRO DA GRADE e MENOR que o da pagina. Sao 20px de cada lado em onze
     colunas: 440px de folga, um quarto de uma tela de 1800px gasto em margem
     interna, e a tabela nascia com rolagem lateral. Os 13px continuam separando
     as colunas com clareza — o separador vertical de cada uma ja faz esse
     trabalho — e devolvem 154px ao dado. */
  --respiro-grade:13px;

  /* O SEPARADOR DE COLUNA, num token só.
     Ele vale no cabeçalho, na faixa de filtro e nas filas de dado — as três — e é
     isso que faz a linha da coluna correr de cima a baixo sem degrau. Estava
     escrito à mão em cada regra, e a do cabeçalho ficou de fora: o resultado era
     coluna separada no dado e emendada no rótulo.
     A cor é o `tierra-100` a 70%, quase no limite do visível. Ele existe para o
     olho não escorregar de uma coluna para a outra em tabela larga, e só: mais
     forte, a tabela vira uma grade quadriculada. */
  --separador-coluna:color-mix(in srgb, var(--tierra-100) 70%, transparent);

  /* AS CORES DAS CATEGORIAS, para a tela de análise.
     São as do painel de análises do Plan de Ventas, na ordem em que ele as usa:
     terra, azul, ouro e verde primeiro — as quatro que se distinguem à primeira
     vista, inclusive impressas em cinza — e depois as outras quatro, que só entram
     quando há mais de quatro grupos.
     ELAS NÃO SÃO A COR DA MARCA. O verde da casa é a cor da AÇÃO (botão, funil
     aceso, tarja) e usá-lo para "Herbicidas" faria a barra de um grupo qualquer
     parecer o comando principal da tela. */
  --cat-1:#6b4423; --cat-2:#1b63b5; --cat-3:#d19e03; --cat-4:#2e9159;
  --cat-5:#8d6e4a; --cat-6:#4f8fd6; --cat-7:#b98a2e; --cat-8:#5aa87a;

  /* O CAMPO TRAVADO: cinza NEUTRO, e não a tarja da grade.
     Ele usava `faixa-grid`, que é o verde palidíssimo da tabela, e verde é a cor
     da IDENTIDADE aqui — a mesma família do botão de ação e da tarja do
     cabeçalho. Num campo que existe para dizer "isto não se digita", a cor da
     ação diz o contrário. O cinza é o que qualquer formulário usa para
     desabilitado, e a fonte e a tinta continuam sendo as nossas. */
  --travado-fundo:#eceeef; --travado-borda:#dcdfe1; --travado-texto:#5f6a6f;
}

/* ── TEMA CLARO: a identidade é GRAFITE, e o acento vira LARANJA ─────────── */
[data-theme="claro"]{
  --superficie:#ffffff;
  --tierra-900:#171b1e; --tierra-700:#3a4247; --tierra-500:#5c666e; --tierra-300:#8b9298;
  --tierra-200:#dfe3e7; --tierra-100:#eff1f3; --tierra-50:#f8f9fa;
  --somax-900:#22282b; --somax-800:#2d3438; --somax-700:#3a4247; --somax-600:#465055;
  --somax-500:#414a4f; --somax-400:#7d878d; --somax-100:#e7e9ea; --somax-50:#f4f5f6;
  --accion:#3a4247; --accion-clara:#414a4f; --chip:#2d3438;
  --oro-500:#e8730f; --oro-600:#c85f08; --oro-700:#8f4206; --desfazer:#8f4206;
  --firma:#e8730f;
  --faixa-grid:var(--somax-50); --faixa-grid-texto:#5c666e;
  --borda-forte:#d3d8dc;
  --travado-fundo:#eceef0; --travado-borda:#dde1e4; --travado-texto:#5c666e;
}

/* ── TEMA ESCURO: a identidade é AMEIXA, longe do verde para não parecer o
      tema padrão com a luz apagada. A escala do OURO se INVERTE aqui: o 700 é o
      tom CLARO, feito para ser texto sobre fundo escuro. ─────────────────── */
[data-theme="escuro"]{
  --superficie:#1d1a24;
  --tierra-900:#f2f0f7; --tierra-700:#d2ccdd; --tierra-500:#aaa2bf; --tierra-300:#867e9c;
  --tierra-200:#39344a; --tierra-100:#282433; --tierra-50:#131118;
  --somax-900:#2b1c38; --somax-800:#3a2549; --somax-700:#6a4494; --somax-600:#7a4fa8;
  --somax-500:#5d3a85; --somax-400:#a98cd0; --somax-100:#33274a; --somax-50:#241d33;
  --accion:#c5a5e8; --accion-clara:#d9c4f2; --chip:#cdb3ee;
  --oro-500:#ffa838; --oro-600:#e88f1c; --oro-700:#ffc670; --desfazer:#e88f1c;
  --firma:#8a5fbe;
  --azul-600:#5aa9f0; --azul-700:#7cbcf5;
  --faixa-grid:var(--somax-50); --faixa-grid-texto:#aaa2bf;
  --borda-forte:#443d59;
  /* No escuro, "cinza" é um cinza ESCURO: mais fundo que a superfície, para o
     campo travado ler como um poço e não como uma pastilha acesa. */
  --travado-fundo:#26232e; --travado-borda:#332e3e; --travado-texto:#9a93a8;
  --red-50:#331519; --red-100:#421a20; --red-200:#5e242b; --red-700:#f2617a; --red-800:#f5849a;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--fonte); font-size:14px;
  background:var(--tierra-50); color:var(--tierra-700);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;}
[hidden]{display:none !important;}

/* O seletor nativo desenha a setinha com uma cor que ele decide, e ela não lê
   variável de CSS: no tema escuro ela ficava preta sobre a caixa escura. Aqui ela
   é redesenhada como imagem de fundo, e aí segue o tema. */
select{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px), calc(100% - 10px) calc(50% + 1px);
  background-size:5px 5px,5px 5px; background-repeat:no-repeat;
  padding-right:28px;
}

/* ── A BARRA DO TOPO ─────────────────────────────────────────────────────────
   56px, a mesma altura do Plan de Ventas. Ela fica PRESA no alto e publica a
   própria altura em `--altura-topo`: é por esse valor que o bloco de contexto
   (faixa e filtros) sabe onde se colar quando a página rola. */
.topo{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:16px; height:56px;
  padding:0 16px; background:var(--superficie);
  border-bottom:1px solid var(--tierra-200);
}
@media(min-width:640px){ .topo{padding:0 32px;} }
.marca{display:flex; align-items:center; gap:10px; min-width:0;}
/* A MARCA COMO BOTÃO: nada de aparência de botão em repouso — ela continua sendo a
   assinatura da tela, e um contorno em volta do logo o transformaria num comando
   entre comandos. O que diz que ali se clica é a setinha e o fundo que acende. */
.marca-botao{
  border:0; background:transparent; padding:4px 8px 4px 4px; border-radius:8px;
  font:inherit; color:inherit; cursor:pointer;
}
.marca-botao:hover{background:var(--tierra-100);}
.marca-botao .caret{width:14px; height:14px; color:var(--tierra-300); flex-shrink:0;}
.marca-botao:hover .caret{color:var(--tierra-700);}
#caixa-telas .menu-escolha{left:0; right:auto; min-width:250px;}
.marca svg{height:30px; width:auto; flex-shrink:0;}
.marca-nome{font-size:16px; font-weight:700; color:var(--tierra-900); white-space:nowrap;}
/* O NOME DA CASA EM UMA TINTA SÓ. "Compra" era verde e o resto preto, e isso saiu
   a pedido: a cor de ação já é a do botão primário e do funil aceso, e gastá-la
   numa palavra do título é gastá-la onde ela não pede clique nenhum. O quadradinho
   verde ao lado já assina a marca. */
.marca-nome span{color:inherit;}
/* A faixa de acento embaixo da barra: 6px, a assinatura da casa. Ela é o único
   uso do dourado em área grande, e por isso é fina. */
.faixa-assinatura{height:6px; background:var(--firma);}
.topo-direita{margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0;}

/* ── COMANDOS ────────────────────────────────────────────────────────────────
   Uma altura só, 36px, para campo, seletor e botão. Havia quatro medidas
   circulando para a mesma coisa no protótipo antigo e nada se alinhava com nada. */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:var(--altura-campo); padding:0 14px; border-radius:6px;
  border:1px solid transparent; font-size:13px; font-weight:600;
  cursor:pointer; white-space:nowrap;
  transition:background-color .15s,border-color .15s,color .15s;
}
.btn svg{width:16px; height:16px; flex-shrink:0;}
.btn-primario{background:var(--somax-500); color:#fff;}
.btn-primario:hover{background:var(--somax-600);}
.btn-contorno{background:var(--superficie); border-color:var(--tierra-200); color:var(--tierra-700);}
.btn-contorno:hover{background:var(--tierra-50); border-color:var(--borda-forte);}
/* A ação SEM VOLTA em vermelho, e só ela. É o que faz a cor querer dizer algo. */
.btn-perigo{background:transparent; color:var(--red-700);}
.btn-perigo:hover{background:var(--red-50);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-fantasma{background:transparent; color:var(--tierra-500); padding:0 10px;}
.btn-fantasma:hover{background:var(--tierra-100); color:var(--tierra-900);}

.campo{
  height:var(--altura-campo); padding:0 10px;
  border:1px solid var(--tierra-200); border-radius:6px;
  /* `background-color`, e NAO o atalho `background`: o atalho apaga o
     `background-image` da regra de `select` logo acima, e com ele ia embora a
     setinha para baixo. Um seletor sem seta se le como campo de digitar. */
  background-color:var(--superficie); color:var(--tierra-900); font-size:13px;
}
.campo:focus{outline:none; border-color:var(--somax-500);}
.campo::placeholder{color:var(--tierra-300);}
/* A SETINHA DO `datalist` SAI, e as SUGESTÕES FICAM.
   O campo de provedor é um `input` com `datalist`, e o navegador desenha por conta
   dele uma seta na ponta — a mesma seta do `select`, num campo que NÃO é um
   seletor: ele aceita fornecedor novo, e a seta prometia uma lista fechada.
   Escondendo só o indicador, digitar continua abrindo as sugestões (é o teclado
   que as chama, não a seta), e o campo volta a se parecer com o que é: um campo de
   escrever que ajuda quem escreve. */
.campo[list]::-webkit-calendar-picker-indicator{display:none !important;}


/* ── A PÁGINA ─────────────────────────────────────────────────────────────── */
.pagina{padding:12px 16px 16px;}
@media(min-width:640px){ .pagina{padding:12px 32px 16px;} }

/* O BLOCO CONGELADO: a faixa colorida e a barra de filtros.
   Rolando para ver o fim da lista, as duas subiam e saíam de vista, e com elas o
   recorte em vigor e o total contra o qual tudo se lê — dava para estar olhando
   uma lista de um filtro que não se lembra mais qual é. Presas no alto, ficam.
   O recuo negativo com o mesmo recuo positivo faz o fundo atravessar a margem da
   página: sem ele, o conteúdo apareceria pela fresta ao rolar. */
.bloco-preso{
  position:sticky; top:var(--altura-topo,56px); z-index:30;
  margin:0 -16px; padding:4px 16px 12px; background:var(--tierra-50);
}
@media(min-width:640px){ .bloco-preso{margin:0 -32px; padding:4px 32px 12px;} }

/* O TÍTULO DA TELA, em tinta normal e sem cartão.
   Ele morava num cartão verde de ponta a ponta com seis totais dentro (produtos,
   estoque, pedido, PMK, a comprar, saldo virtual). Os dois saíram a pedido, e a
   razão é a mesma: os totais já vivem congelados na faixa do cabeçalho, cada um na
   coluna que ele soma — repetidos aqui em cima eram a mesma conta duas vezes, e o
   verde por baixo deles pintava um bloco de 90px de altura que empurrava a tabela
   para fora da tela antes de a primeira fila aparecer.
   O que resta é o nome da tela, que é o que um título tem de fazer. */
/* A linha do título: nome à esquerda, "atualizado em" na ponta direita. */
.linha-titulo{
  display:flex; align-items:center; gap:12px; margin-bottom:10px;
}
.linha-titulo .titulo-tela{margin:0; flex:1;}
.caixa-diario{position:relative; flex:0 0 auto;}
/* O RELÓGIO É INFORMAÇÃO, não comando: peso de nota, tinta apagada, sem contorno.
   Em botão de contorno ele entraria na fileira de comandos da barra de baixo e
   pediria clique como as três ações — e ele não pede: ele responde. */
.btn-diario{
  font-weight:400; font-size:12px; color:var(--tierra-500); padding:0 8px;
  height:28px; border-radius:6px;
}
.btn-diario svg{width:14px; height:14px; opacity:.8;}
.btn-diario:hover{color:var(--tierra-900); background:var(--tierra-100);}

/* ── O DIÁRIO: as dez últimas coisas feitas ─────────────────────────────────
   Painel ancorado no relógio, do jeito do menu Acciones. Ele fica FORA da caixa
   que rola (a linha do título está acima dela), então aqui `absolute` basta — não
   precisa do endereço de janela que o funil precisa. */
.menu-diario{
  /* 430px, e não 320: em 320 o nome de um produto quebrava em duas linhas e a
     anotação virava um bloco de três — três linhas por ação, dez ações, e a lista
     que existe para se ler de relance passava a se ler devagar. Aqui cabe
     "BRAVONIL - 20 Lt" numa linha, que é o caso normal. */
  width:430px; max-width:calc(100vw - 32px);
  padding:12px 10px 10px; max-height:60vh; overflow:auto;
}
.menu-diario > b{
  display:block; padding:0 8px; margin-bottom:6px;
  font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.04em; color:var(--tierra-500);
}
/* CADA ANOTAÇÃO É UM BLOCO COM RESPIRO, e não uma linha de tabela.
   Ela tinha 6px em cima e embaixo e um traço entre uma e outra: dez blocos de texto
   encostados, com o traço fazendo o trabalho que o espaço deveria fazer. Com 10px
   de respiro e o traço mais claro, a lista se lê em blocos — que é como ela é. */
.diario-item{
  display:flex; align-items:flex-start; gap:14px;
  padding:10px 8px; border-radius:8px;
  border-top:1px solid var(--tierra-100);
  font-size:13px; color:var(--tierra-700);
}
.diario-item:first-of-type{border-top:0;}
.diario-item:hover{background:var(--faixa-grid);}
/* A HORA em largura fixa e dígitos de mesma medida: dez linhas de hora que não
   alinham na vertical viram dez linhas que se leem uma por uma. Alinhada pelo alto,
   e não pela base: o bloco ao lado tem duas linhas, e a hora pertence à primeira. */
.diario-item .quando{
  flex:0 0 auto; width:88px; padding-top:1px;
  font-size:12px; color:var(--tierra-500); font-variant-numeric:tabular-nums;
}
.diario-item .oque{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
.diario-item .oque b{color:var(--tierra-900); font-weight:600; line-height:1.35;}
/* O detalhe e as pastilhas na MESMA linha, quebrando juntos se faltar largura. */
.diario-linha{display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-width:0;}
.diario-detalhe{
  color:var(--tierra-500); font-size:12px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;
}
/* AS PASTILHAS do que mudou. Menores que as da conta do saldo: ali elas são a
   fórmula, aqui são uma etiqueta no meio da frase. */
.diario-linha .conta-parcela{font-size:11px; padding:2px 7px; font-weight:600;}
.diario-vazio{margin:0; padding:4px 0 6px; font-size:13px; color:var(--tierra-500);}

/* ── A LISTA DE COLUNAS ──────────────────────────────────────────────────────
   Mesmas linhas do funil, com a mesma caixa de marcar: as duas respondem à mesma
   pergunta ("o que fica à vista?"), e duas aparências para o mesmo gesto seriam
   duas coisas para aprender. */
.caixa-colunas{position:relative;}
.menu-colunas{width:250px; padding:10px 6px 6px;}
.menu-colunas > b{
  display:block; padding:0 6px; margin-bottom:6px;
  font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.04em; color:var(--tierra-500);
}
.lista-colunas{display:flex; flex-direction:column; max-height:340px; overflow-y:auto;}
.lista-colunas .funil-item:disabled{opacity:.45; cursor:default;}
.lista-colunas .funil-item:disabled:hover{background:transparent;}


.titulo-tela{
  margin:0 0 10px; font-size:20px; font-weight:700; line-height:1.4;
  color:var(--tierra-900);
  min-width:0; white-space:nowrap; overflow:clip; text-overflow:ellipsis;
  overflow-clip-margin:6px;
}

.barra-filtros{display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
.barra-filtros .direita{margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0;}
/* OS BOTÕES DA DIREITA TÊM A MESMA LARGURA, e o conteúdo de cada um vai para a
   ESQUERDA da caixa. São três comandos do mesmo grupo, e com a largura do rótulo
   cada um a fileira ficava serrilhada — "Acciones" curtinho ao lado de "Actualizar
   stock". Igualados, eles se leem como um grupo; e o ícone alinhado à esquerda faz
   os três ícones caírem na mesma coluna vertical, que é o que de fato alinha a
   fileira aos olhos. O caret do Acciones vai para a ponta oposta. */
.barra-filtros .direita .btn{min-width:172px; justify-content:flex-start;}
.barra-filtros .direita .btn .caret{margin-left:auto;}
.aviso{font-size:13px; color:var(--tierra-500);}

/* ── O CAMPO DE BUSCA ────────────────────────────────────────────────────────
   A LARGURA É LIMITADA, e isso é metade do conserto. O campo esticava por toda a
   sobra da barra — uns oitocentos pixels numa tela grande — e um retângulo dessa
   largura não se lê como campo de busca: lê como área de texto. Um campo tem o
   tamanho do que se escreve nele, e num nome de produto 380px bastam.

   O piso de 200px existe para a lupa e o texto de exemplo caberem juntos quando a
   barra aperta; abaixo disso o campo quebra para a linha de baixo, que é melhor
   que um campo em que nada se lê. */
.caixa-busca{position:relative; flex:0 1 380px; min-width:200px;}
.caixa-busca .campo{width:100%; padding-left:34px;}

/* A LUPA, nos dois tipos de campo de busca.
   É DESENHO, não conteúdo: `pointer-events:none` faz o clique atravessar e cair no
   campo. Sem isso, clicar exatamente na lupa — que é o gesto natural de quem quer
   buscar — não põe o cursor em lugar nenhum.
   A cor sai de `background`, porque numa máscara é o fundo que fica visível
   através do desenho. */
.lupa{
  position:absolute; top:50%; transform:translateY(-50%);
  pointer-events:none; background:currentColor;
  mask:var(--icone-lupa) center / contain no-repeat;
  color:var(--tierra-300);
}
.caixa-busca .lupa{left:10px; width:16px; height:16px;}

/* Com o foco, a lupa acompanha a borda e passa ao verde da ação: o campo inteiro
   responde como uma peça só, em vez de a borda acender e o ícone ficar apagado.
   Vai em `:focus-within` do CONTÊINER, e não num combinador de irmão a partir do
   campo: a lupa vem ANTES do input no HTML, e `~` só alcança irmão posterior. */
.caixa-busca:focus-within .lupa{color:var(--accion-clara);}

/* O X de limpar que o navegador desenha no `type=search` é cinza-escuro fixo e não
   lê variável de CSS: no tema escuro ele virava um borrão preto sobre a caixa
   escura. Escondido, quem limpa usa o botão Limpar da barra, que limpa TAMBÉM os
   filtros de coluna — o X nativo limparia só este campo e deixaria a grade
   recortada por um filtro que a pessoa acha que acabou de tirar. */
.caixa-busca .campo::-webkit-search-cancel-button{display:none;}

/* ── A GRADE ─────────────────────────────────────────────────────────────────
   A moldura fecha a caixa nos quatro lados, e o `overflow:hidden` é o que faz o
   canto arredondado valer para o conteúdo: sem ele a faixa do cabeçalho passa
   reto por cima da curva. */
.moldura{
  border:1px solid var(--tierra-200); border-radius:12px;
  background:var(--superficie); overflow:hidden;
}
/* A ALTURA DA CAIXA QUE ROLA: tudo o que a janela tem, menos o que está acima dela
   e uma folga no pé.
   Os 250px de antes eram uma reserva chutada, e sobravam 140px de vazio embaixo da
   moldura numa janela de 804px — quase quatro filas de dado desperdiçadas em toda
   abertura da tela. Os 126px são medidos: a tarja de assinatura, o respiro da
   página, o título, a barra de comandos, as bordas da moldura e 16px de folga no
   pé. `--altura-topo` continua de fora da conta porque ela é medida em tempo de
   execução — a barra de cima muda de altura com o idioma. */
.rolagem{overflow:auto; max-height:calc(100vh - var(--altura-topo,56px) - 126px); min-height:240px;}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:14px;}

/* As DUAS faixas do topo — cabeçalho e filtro/total — ficam presas dentro da
   caixa que rola e se leem como um bloco só: rótulo em cima, campo embaixo, na
   mesma altura de 36px. Foi por isso que o separador vertical saiu delas: com os
   traços, o topo lia como uma fileira de etiquetas em vez de uma faixa. */
thead th{
  position:sticky; z-index:2; background:var(--faixa-grid);
  height:var(--altura-campo); padding:0 var(--respiro-grade);
  text-align:left; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; color:var(--faixa-grid-texto); white-space:nowrap;
}
/* O SEPARADOR DE COLUNA vale nas DUAS faixas do topo, e não só nas filas de dado:
   é o que continua a linha da coluna do rótulo até o último valor. Sem ele aqui, a
   coluna aparecia separada no dado e emendada no cabeçalho. */
thead th{border-right:1px solid var(--separador-coluna);}

thead tr.cabecalho th{top:0; border-bottom:1px solid var(--tierra-200);}
thead th.num{text-align:right;}
/* AS COLUNAS DE VALOR TÊM MAIS RESPIRO que as de texto: 18px de cada lado contra
   13px. Elas encolhem até o CONTEÚDO, e o conteúdo delas é o número mais comprido
   que a coluna tem — no respiro de 13px o total do pé chegava a encostar nos dois
   lados da célula e a coluna lia como apertada, o que ela estava.
   Nas de texto os 13px bastam: elas ficam com a sobra da tabela e nunca chegam ao
   mínimo numa janela normal. Os 5px a mais em seis colunas saem justamente dali. */
thead th.num, tbody td.num, tfoot td.num,
thead th.mes, tbody td.mes, tfoot td.mes{padding-left:18px; padding-right:18px;}

/* ── O PÉ DA TABELA ──────────────────────────────────────────────────────────
   A contagem de filas e o TOTAL de cada coluna, cada um embaixo da coluna dele.
   Os totais moravam numa segunda faixa presa sob o cabeçalho; desceram a pedido, e
   o `sticky bottom` é o que mantém o que eles tinham lá: rolando trezentas filas,
   o total continua à vista. Mesma tarja do cabeçalho — as duas emolduram o dado,
   uma abrindo e a outra fechando. */
tfoot td{
  position:sticky; bottom:0; z-index:2; background:var(--faixa-grid);
  height:var(--altura-campo); padding:0 var(--respiro-grade);
  border-top:1px solid var(--tierra-200);
  border-right:1px solid var(--separador-coluna);
  color:var(--faixa-grid-texto);
}
tfoot td:last-child{border-right:0;}
/* A CONTAGEM guarda o corpo que ela tinha na tarja de fora: 13px, apagada, com o
   número em destaque. Ela não é um total — é a escala deles. */
tfoot td.conta-filas{font-size:13px; white-space:nowrap;}
tfoot td.conta-filas b{color:var(--tierra-900);}

/* AS LARGURAS. A tabela tem 100% da largura, e sem instrução nenhuma o navegador
   REPARTE isso em partes iguais: com quatro colunas, o nome e o código ficavam
   com um quarto da tela cada e os números iam parar a meia tela do nome que eles
   medem — o olho tinha de atravessar um vazio para ligar um ao outro.

   `width:1%` não faz a coluna ter 1%: faz ela encolher até o CONTEÚDO, porque a
   largura mínima do conteúdo sempre ganha de um pedido menor que ela. É o jeito
   de dizer "esta coluna pede o mínimo" numa tabela de largura automática.

   Quem fica com a sobra é o NOME, que é a coluna que de fato precisa dela: numa
   base de insumos os nomes vão a quarenta caracteres. O piso de 240px existe para
   ele não ser esmagado quando há muitas medidas. */
thead th.num, tbody td.num,
thead th.cod, tbody td.cod{width:1%;}
/* GRUPO E PROVEDOR TAMBÉM PEDEM O MÍNIMO. Só o PRODUTO fica com a sobra.
   Sem isto, a folga da tabela era repartida entre as três colunas de texto na
   proporção do conteúdo delas, e numa janela larga o Grupo chegava a 312px para
   apresentar "Nutricion Especial" — enquanto o nome do produto, que é o que de
   fato precisa de espaço, aparecia cortado. `max-width` não resolve: no cálculo
   automático de tabela ele não participa da distribuição da sobra, só o mínimo do
   conteúdo e a largura PEDIDA participam. Pedindo 1%, elas saem da divisão. */
thead th.txt:not(.eixo), tbody td.txt:not(.eixo){width:1%;}
/* Quem fica com a SOBRA da largura é a coluna do EIXO (o nome do produto), e por
   isso o piso está nela e não na primeira coluna da tabela. Era `:first-child`
   quando o nome era a primeira; com o código na frente, aquele seletor passou a
   engordar a coluna do código, que precisa do mínimo. */
thead th.eixo, tbody td.eixo{min-width:190px;}

/* AS COLUNAS DIGITADAS têm PISO de largura, e as da planilha não.
   O motivo é que só nelas o conteúdo não manda: uma coluna de planilha encolhe
   até o maior número que ela tem, e isso basta. Uma coluna de CAMPO encolhe até o
   CABEÇALHO, porque a célula está vazia enquanto ninguém digitou — e "PMK" tem
   três letras. O resultado era um campo de 40px em que "190.000" aparecia como
   "19": o número entrava certo e a pessoa lia errado, que é a pior combinação.
   Os 104px cabem nove dígitos com o separador de milhar, no respiro da grade. */
/* E TODAS AS COLUNAS DE VALOR TÊM PISO, não só as digitadas.
   Antes só as de campo tinham, e as de planilha encolhiam até o número mais
   comprido que traziam: com o rótulo quebrado em duas linhas, "PEDIDO / CARTERA"
   em cima de 101px de coluna lia como coluna apertada — e era. Os 120px dão a
   folga que faltava, e ela sai das colunas de texto, que ficam com a sobra da
   tabela e nunca chegam ao mínimo numa janela normal. */
thead th.num, tbody td.num{min-width:120px;}
thead th.edt, tbody td.edt{min-width:120px;}
/* O cabeçalho é um BOTÃO de ordenar, e ele diz isso ao passar o mouse. */
/* A célula do cabeçalho é uma FILEIRA: o rótulo, que ordena, e o funil, que
   filtra. O rótulo toma o espaço que sobra para a área de clique dele ser a
   coluna inteira menos o funil.

   O FLEX VAI NUM INVÓLUCRO, e NUNCA no `<th>`. Pondo `display:flex` na célula, ela
   deixa de ser `table-cell` e SAI do algoritmo de tabela: as nove colunas
   empilharam uma embaixo da outra, cada uma numa linha. É o tipo de regra que
   parece inofensiva e desmonta a tabela inteira. */
thead tr.cabecalho th .cab-fileira{
  display:flex; align-items:center; gap:2px; height:100%;
}
thead th .rotulo-col{
  /* NÃO CRESCE. Com `flex:1` ele empurrava o funil para o fim da coluna, e numa
     coluna larga o funil aparecia a trezentos pixels do nome que ele filtra —
     lia como um ícone solto na faixa, sem dono. Encostado no rótulo, o par
     "GRUPO ▽" se lê como uma peça só. A sobra da coluna vai DEPOIS do funil, pela
     margem automática dele. */
  flex:0 1 auto; min-width:0; height:100%; border:0; background:transparent; cursor:pointer;
  font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit;
  display:flex; align-items:center; gap:5px; padding:0;
  overflow:hidden;
}
/* O TÍTULO QUEBRA EM DUAS LINHAS, e é isso que faz a tabela caber na tela.
   Com `nowrap`, cada coluna pedia a largura do título inteiro escrito de uma vez:
   "PEDIDO CARTERA" pedia 163px para apresentar números de 68px, e onze colunas
   assim somavam mais que a janela — a tabela nascia com rolagem lateral e a última
   coluna, o Saldo Virtual, ficava fora da vista.
   Quebrando, a coluna passa a pedir a maior PALAVRA do título, e o rótulo cabe nos
   36px da faixa em duas linhas de 11px sem empurrar nada. */
thead th .titulo-col{
  min-width:0; white-space:normal; overflow-wrap:break-word; line-height:1.15;
}
/* COLUNA DE NUMERO: o funil vai para a ESQUERDA e o rotulo para a direita.
   Era `justify-content:flex-end` no rotulo, e nao bastava: o rotulo terminava
   encostado no funil, e o funil ficava depois dele — entao a palavra parava uns
   20px antes da borda e nao alinhava com os numeros embaixo. Invertendo a fileira,
   a direita da palavra e a direita da coluna, exatamente como o numero. */
thead tr.cabecalho th.num .cab-fileira{flex-direction:row-reverse;}
thead th.num .rotulo-col{justify-content:flex-end;}
/* Quebrado, o título de número alinha as DUAS linhas à direita: sem isto a segunda
   linha começa na esquerda do bloco e o rótulo deixa de casar com a coluna de
   valores que ele nomeia. */
thead th.num .titulo-col{text-align:right;}
thead th .rotulo-col:hover{color:var(--accion);}

/* O FUNIL. Apagado em repouso para não competir com o rótulo — são nove colunas, e
   nove funis escuros no alto viram uma fileira de ícones que se lê antes dos nomes.
   Acende ao passar o mouse, e fica VERDE quando a coluna tem escolha em vigor:
   nesse caso ele é a única pista de que a tabela está recortada, e aí ele tem de
   ser visto sem procurar. */
thead th .funil{
  /* A MARGEM AUTOMÁTICA À DIREITA é o que empurra a sobra da coluna para depois do
     funil, em vez de para entre ele e o rótulo. */
  flex:0 0 auto; margin-right:auto; display:flex; align-items:center; justify-content:center;
  width:20px; height:20px; padding:0; border:0; border-radius:4px;
  background:transparent; color:var(--tierra-300); cursor:pointer;
  transition:color .15s,background-color .15s;
}
thead th .funil svg{width:13px; height:13px;}
/* SEM FUNDO em estado nenhum: o que muda e a cor do simbolo.
   O fundo branco no hover e no aberto abria uma pastilha clara na tarja verde do
   cabecalho — a mesma coisa que fez a borda e o fundo sairem dos campos de busca
   logo abaixo. A faixa e uma tarja continua; tudo que se pinta dentro dela vira
   remendo. O simbolo passando ao verde da acao basta para dizer que esta ativo. */
thead th .funil:hover{color:var(--tierra-700);}
thead th .funil.ativo{color:var(--accion-clara);}
thead th .funil.aberto{color:var(--accion-clara);}
.seta{font-size:9px; opacity:.9;}

/* ── O "i" DA COLUNA CALCULADA e o painel da conta ───────────────────────────
   Mesmo peso do funil: apagado em repouso, aceso ao passar o mouse. Ele é uma
   OFERTA de explicação, não um aviso — aceso o tempo todo, leria como se houvesse
   algo errado com a coluna. */
thead th .info-col{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  width:20px; height:20px; padding:0; border:0; border-radius:4px;
  background:transparent; color:var(--tierra-300); cursor:help;
  transition:color .15s;
}
thead th .info-col svg{width:14px; height:14px;}
thead th .info-col:hover, thead th .info-col:focus-visible{color:var(--accion-clara); outline:none;}
/* Na coluna de valor a fileira é invertida (o rótulo à direita), então o "i" cai à
   esquerda do rótulo — e é a margem dele que empurra a sobra da coluna. */
thead tr.cabecalho th.num .info-col{margin-right:0; margin-left:auto;}

.dica-conta{
  /* A LARGURA É A DA CONTA, e não um número fixo. Eram 290px, e a conta quebrava:
     "Pedido Cartera" caía numa segunda linha e a fórmula deixava de se ler como uma
     fórmula — `( a + b )` em cima e `− c` embaixo é outra frase. Pedindo
     `max-content`, o painel tem exatamente a largura de uma linha; o teto existe
     para uma coluna de nome comprido não empurrar o painel fora da tela. */
  position:fixed; z-index:80; padding:12px 14px;
  width:max-content; max-width:min(560px, calc(100vw - 24px));
  background:var(--superficie); border:1px solid var(--tierra-200);
  border-radius:10px; box-shadow:0 8px 24px rgb(0 0 0 / .16);
  /* A faixa do cabeçalho é maiúscula, apertada e 11px; o painel volta ao corpo do
     texto normal, porque aqui se lê uma frase e não um rótulo. */
  font-size:12px; font-weight:400; text-transform:none; letter-spacing:0;
  color:var(--tierra-700); text-align:left; line-height:1.5;
  pointer-events:none;   /* a dica não rouba o mouse de quem está indo para a tabela */
}
.dica-conta > b{
  display:block; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.04em; color:var(--tierra-500); margin-bottom:8px;
}
/* A CONTA. As parcelas quebram linha se precisarem, e por isso os sinais são peças
   próprias: numa quebra, o "+" acompanha a parcela que ele soma. */
/* Sem borda embaixo e sem margem: a conta é a última coisa do painel desde que a
   frase explicativa saiu, e um traço no pé de um painel fecha o que já acabou.
   E SEM QUEBRA: a fórmula vive numa linha, ou deixa de ser uma fórmula. */
.dica-conta .conta{
  display:flex; flex-wrap:nowrap; align-items:center; gap:6px;
}
.conta-parcela{
  padding:3px 8px; border-radius:5px;
  background:var(--faixa-grid); color:var(--tierra-900);
  font-size:12px; font-weight:600; white-space:nowrap;
}
.conta-sinal{
  font-size:14px; font-weight:700; color:var(--accion-clara);
  font-variant-numeric:tabular-nums;
}
/* OS PARÊNTESES são maiores e apagados: eles agrupam, e agrupar se vê pela forma,
   não pela tinta. Do peso dos sinais, competiriam com o `+` e o `−`. */
.conta-parentese{
  font-size:19px; font-weight:400; color:var(--tierra-300); margin:0 -2px;
}

/* ── A COLUNA DE ACOES ───────────────────────────────────────────────────────
   Largura do gesto, e nada mais: 40px cabem o lapis com respiro dos dois lados.
   O respiro padrao da celula (20px de cada lado) daria 76px para um icone. */
thead th.acoes, tbody td.acoes{width:40px; min-width:40px; padding:0; text-align:center;}
tbody td.acoes{color:var(--tierra-300);}
.lapis{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;}
.lapis svg{width:15px; height:15px;}
/* A FILA CLICAVEL: a maozinha na fila inteira, e o lapis acende junto ao passar o
   mouse. E o par que diz "esta fila abre" sem precisar de legenda. */
tbody tr.clicavel{cursor:pointer;}
tbody tr.clicavel:hover td.acoes{color:var(--accion-clara);}

/* ── O MENU DE ACOES ────────────────────────────────────────────────────────
   Ancorado no botao, e nao um painel de janela como o funil: sao dois itens e ele
   nao rola nem escapa da tela. `position:relative` na caixa e o que o prende. */
.caixa-acoes{position:relative;}
.caixa-acoes .caret{width:14px; height:14px; margin-left:-2px;}
.menu-acoes{
  position:absolute; top:calc(100% + 4px); right:0; z-index:70; min-width:210px;
  background:var(--superficie); border:1px solid var(--tierra-200);
  border-radius:10px; box-shadow:0 8px 24px rgb(0 0 0 / .16);
  padding:4px; display:flex; flex-direction:column;
}
.item-acao{
  display:flex; align-items:center; gap:10px; width:100%;
  height:36px; padding:0 10px; border:0; border-radius:6px;
  background:transparent; font:inherit; font-size:13px; color:var(--tierra-700);
  cursor:pointer; text-align:left; white-space:nowrap;
}
.item-acao svg{width:15px; height:15px; flex-shrink:0;}
.item-acao:hover{background:var(--faixa-grid); color:var(--tierra-900);}
/* A acao SEM VOLTA em vermelho, e separada por um traco: ela e a unica do menu que
   nao se desfaz, e o traco existe para o dedo nao escorregar de uma para a outra. */
.item-acao.perigo{color:var(--red-700); margin-top:4px; border-top:1px solid var(--tierra-100);
  border-radius:0 0 6px 6px; padding-top:0; height:40px;}
.item-acao.perigo:hover{background:var(--red-50); color:var(--red-800);}

/* ── OS MENUS DE ESCOLHA (idioma e tema) ─────────────────────────────────────
   Mesmo painel do Acciones, com duas diferenças que vêm de serem uma ESCOLHA e não
   uma lista de ações: são estreitos (os rótulos são uma palavra) e a opção em vigor
   leva um TIQUE. Sem a marca, um menu de escolha não diz o que está escolhido — e
   aí a pessoa clica na que já valia para descobrir. */
.escolha{position:relative;}
.escolha .caret{width:14px; height:14px; margin-left:-2px; opacity:.75;}
.escolha > .btn > svg:first-child{opacity:.75;}
.menu-escolha{min-width:170px;}
.item-escolha{
  display:flex; align-items:center; gap:8px; width:100%;
  height:34px; padding:0 10px; border:0; border-radius:6px;
  background:transparent; font:inherit; font-size:13px; color:var(--tierra-700);
  cursor:pointer; text-align:left; white-space:nowrap;
}
.item-escolha:hover{background:var(--faixa-grid); color:var(--tierra-900);}
/* O TIQUE ocupa lugar SEMPRE, aceso ou apagado: aparecendo só na escolhida, ele
   empurrava o rótulo dela 22px para a direita e a lista lia como desalinhada. */
.item-escolha .tique{
  flex:0 0 auto; width:14px; height:14px; background:currentColor;
  mask:var(--icone-tique) center / contain no-repeat;
  color:var(--accion-clara); opacity:0;
}
.item-escolha.agora{color:var(--tierra-900); font-weight:600;}
.item-escolha.agora .tique{opacity:1;}

/* ── A TELA DE EDITAR ────────────────────────────────────────────────────────
   Fundo escurecido e a caixa no centro. O fundo nao e enfeite: ele e o que diz que
   o resto da tela esta esperando, e e a area de clique que fecha. */
.fundo-modal{
  position:fixed; inset:0; z-index:90;
  display:flex; align-items:center; justify-content:center; padding:20px;
  background:rgb(0 0 0 / .38);
}
/* LARGA o bastante para os três campos caberem LADO A LADO. Empilhados, a tela
   ficava alta e estreita e a decisão parecia um formulário de cadastro; as três
   coisas são decididas JUNTAS (o planejado, o que comprar e quando chega), e lado a
   lado elas se leem numa varredura. */
.modal{
  width:100%; max-width:700px; background:var(--superficie);
  border-radius:14px; box-shadow:0 16px 44px rgb(0 0 0 / .24);
  display:flex; flex-direction:column; overflow:hidden;
}
.modal-topo{
  display:flex; align-items:flex-start; gap:12px;
  padding:16px 18px; border-bottom:1px solid var(--tierra-100);
}
/* O X GRANDE. Ele era um botao fantasma no corpo de 13px, e o "x" desenhado nesse
   tamanho e um risco de tres pixels: dava para nao achar onde fechar. */
#editar-fechar{
  flex:0 0 auto; width:32px; height:32px; padding:0;
  font-size:26px; line-height:1; color:var(--tierra-500);
}
#editar-fechar:hover{color:var(--tierra-900); background:var(--tierra-100);}
.modal-nomes{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:0 7px;
  min-width:0; flex:1;
}
.modal-nomes b{font-size:15px; color:var(--tierra-900); line-height:1.35;}
/* O CÓDIGO IGUAL AO NOME: mesmo corpo, mesmo peso, mesma família e A MESMA TINTA.
   Ele era 12px e monoespaçado, o que o fazia ler como nota de rodapé do nome — e
   ele não é nota, é a outra metade da identidade. Chegou a ficar num cinza mais
   claro para o nome liderar, e isso saiu a pedido: as duas metades da identidade
   têm o mesmo peso, e o que as separa é o ponto entre elas. */
.modal-nomes #editar-codigo{
  font-size:15px; font-weight:700; line-height:1.35; color:var(--tierra-900);
}
.modal-nomes .ponto{color:var(--tierra-300); font-size:15px; font-weight:700;}

/* OS FATOS, em leitura: fundo da faixa do grid, para se lerem como o mesmo dado
   que esta na tabela atras — e nao como campos que alguem esqueceu de abrir. */
/* A FAIXA DE FATOS SAIU. Ela mostrava estoque, pedido e total em leitura no alto
   da tela, e saiu a pedido: a tela de editar ficou com uma coisa só, que são os
   campos. Os números continuam na fila da grade, atrás da tela — e é de lá que se
   leem, sem repetição.
--------------------------------------------------------------------------- */

.modal-campos{
  display:grid; grid-template-columns:repeat(3, 1fr);
  gap:16px; padding:18px;
}
@media(max-width:620px){ .modal-campos{grid-template-columns:1fr;} }
.campo-rotulado{display:flex; flex-direction:column; gap:5px; min-width:0;}
/* Atravessa as tres colunas da grade. `1 / -1` e da primeira a ultima, sem
   depender de quantas colunas ha — se um dia forem quatro, ele continua inteiro. */
.campo-rotulado.largo{grid-column:1 / -1;}

/* ── O PAR NOME / MÁSCARA ────────────────────────────────────────────────────
   Uma linha inteira com DUAS coisas: à esquerda o nome que a planilha traz, em
   leitura, e à direita a máscara que se escreve. Os dois em MEIA LARGURA cada, e
   não um terço: são nomes de produto, e num terço da linha não se lê nenhum dos
   dois — que é justamente o que a comparação exige. */
.par-mascara{
  grid-column:1 / -1;
  display:grid; grid-template-columns:1fr 1fr; gap:16px;
}
@media(max-width:620px){ .par-mascara{grid-template-columns:1fr;} }

/* ── O CAMPO COM BOTÃO AO LADO ───────────────────────────────────────────────
   É o código: o campo toma a linha e o botão de destravar fica na ponta. */
.campo-com-botao{display:flex; align-items:center; gap:6px; min-width:0;}
.campo-com-botao .campo{flex:1; min-width:0;}
.btn-destravar{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  width:var(--altura-campo); height:var(--altura-campo); padding:0;
  border:1px solid var(--tierra-200); border-radius:6px;
  background:var(--superficie); color:var(--tierra-500); cursor:pointer;
  transition:color .15s,border-color .15s;
}
.btn-destravar:hover{color:var(--accion); border-color:var(--borda-forte);}
/* GRAVANDO, ele é PRIMÁRIO. O botão é o mesmo em dois estados, e sem a mudança de
   peso os dois pareceriam o mesmo gesto: quem destravou precisa ver que o próximo
   clique COMETE a troca, e não que ele destrava de novo. */
.btn-destravar.gravar{
  background:var(--accion); border-color:var(--accion); color:#fff;
}
.btn-destravar.gravar:hover{background:var(--accion-clara); border-color:var(--accion-clara); color:#fff;}
.btn-destravar svg{width:15px; height:15px;}

/* O CAMPO EM LEITURA. Ele não é um campo desligado à espera de habilitar: é um
   FATO, e por isso se parece com o dado da tabela e não com o campo ao lado —
   fundo da tarja, sem a promessa de contorno branco de quem aceita digitação. */
.campo[readonly]{
  background:var(--travado-fundo); color:var(--travado-texto);
  border-color:var(--travado-borda); cursor:default;
}
.campo[readonly]:focus{box-shadow:none; border-color:var(--travado-borda);}
.campo-rotulado > span{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
  color:var(--tierra-500);
}
/* Numero alinhado a DIREITA no campo, como na grade: quem confere um valor
   corrigido compara com a coluna, e a virgula tem de cair no mesmo lugar. */
#editar-pmk, #editar-comprar{text-align:right; font-variant-numeric:tabular-nums;}

.modal-acoes{
  display:flex; justify-content:flex-end; gap:8px;
  padding:14px 18px; border-top:1px solid var(--tierra-100); background:var(--tierra-50);
}

/* ── O PAINEL DO FUNIL ───────────────────────────────────────────────────────
   Vive no `body`, fora da tabela, porque a tabela rola por dentro e cortaria ele
   na borda. Por isso é `fixed`: a posição é medida em coordenadas de janela a
   partir do botão que o abriu (ver `posicionarFunil`).
   O `z-index` fica acima do cabeçalho preso (30) e da barra do topo (50). */
.painel-funil{
  position:fixed; z-index:80; width:280px;
  background:var(--superficie); border:1px solid var(--tierra-200);
  border-radius:10px; box-shadow:0 8px 24px rgb(0 0 0 / .16);
  display:flex; flex-direction:column; overflow:hidden;
}
.funil-busca{position:relative; padding:8px; border-bottom:1px solid var(--tierra-100);}
.funil-busca .campo{width:100%; padding-left:32px;}
.funil-busca .lupa{left:19px; width:15px; height:15px;}

/* A lista rola: uma coluna de produto tem cento e oito valores distintos, e um
   painel de cento e oito linhas não caberia em tela nenhuma. */
.funil-lista{max-height:260px; overflow-y:auto; padding:4px;}

.funil-item{
  display:flex; align-items:center; gap:9px; width:100%;
  padding:0 8px; height:30px; border:0; border-radius:6px;
  background:transparent; font:inherit; font-size:13px; color:var(--tierra-900);
  cursor:pointer; text-align:left;
}
.funil-item:hover{background:var(--faixa-grid);}
.funil-item .rot{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
/* O (TODOS) fica separado do resto por um traço, e em negrito: ele não é um valor
   da lista, é o comando que mexe na lista toda. */
.funil-todos{font-weight:700; border-bottom:1px solid var(--tierra-100); border-radius:6px 6px 0 0;}

/* A CAIXA DE MARCAR, desenhada à mão e não um `<input type=checkbox>`: a caixa
   nativa não aceita cor de tema em todo navegador, e aqui ela precisa ser o verde
   da casa nos três temas. */
.funil-item .caixa{
  flex:0 0 auto; position:relative; width:16px; height:16px;
  border:1.5px solid var(--tierra-300); border-radius:4px; background:var(--superficie);
}
.funil-item .caixa.marcada{background:var(--somax-500); border-color:var(--somax-500);}

/* O TIQUE é uma MÁSCARA, e não uma borda em L girada.
   Era um retângulo de 5x9 com duas bordas, rodado 45 graus. Ele desenha um tique
   correto e é impossível de CENTRAR: girado, o desenho ocupa uma caixa diagonal
   maior que ele, e a posição tem de ser acertada a olho em pixels — foi por isso
   que ele saía torto e encostado no canto de cima.
   Como máscara, `center` centra de verdade: o navegador resolve a conta, e o tique
   fica no meio da caixa em qualquer tamanho, tema ou zoom. */
.funil-item .caixa.marcada::after{
  content:""; position:absolute; inset:0; background:#fff;
  mask:var(--icone-tique) center / 11px 11px no-repeat;
}

.funil-vazio{padding:14px 10px; text-align:center; font-size:13px; color:var(--tierra-500);}
/* O pé conta quantos de quantos estão marcados: é o número que diz se o recorte é
   de dois valores ou de dois menos. */
.funil-pe{
  padding:7px 12px; border-top:1px solid var(--tierra-100);
  background:var(--faixa-grid); font-size:12px; color:var(--faixa-grid-texto);
}

/* ── ARRASTAR A COLUNA ───────────────────────────────────────────────────────
   A mãozinha ABERTA no cabeçalho (`grab`), e não o dedo de clicar: ela é a dica de
   que a coluna se move. O clique continua ordenando — os dois gestos convivem, e é
   a mãozinha que revela o segundo, que ninguém adivinha.
   `user-select:none` impede que o arrasto comece selecionando o texto do rótulo:
   sem isso, metade das tentativas pinta a palavra em azul em vez de pegar a coluna. */
thead tr.cabecalho th{cursor:grab; user-select:none;}
thead tr.cabecalho th:active{cursor:grabbing;}

/* A COLUNA NA MÃO some pela metade: é o que diz qual está sendo movida. */
thead tr.cabecalho th.na-mao{opacity:.4;}

/* O TRAÇO DO DESTINO, do lado em que a coluna vai entrar.
   É `::after` e não `box-shadow` porque a faixa do cabeçalho já usa o box-shadow
   para marcar as colunas editáveis, e as duas se sobreporiam — uma apagaria a
   outra. O `th` é `position:sticky`, que já serve de referência para o absoluto. */
thead tr.cabecalho th.alvo-antes::after,
thead tr.cabecalho th.alvo-depois::after{
  content:""; position:absolute; top:0; bottom:0; width:3px;
  background:var(--somax-500);
}
thead tr.cabecalho th.alvo-antes::after{left:0;}
thead tr.cabecalho th.alvo-depois::after{right:0;}

/* O TOTAL, no pé, na coluna que ele soma: MESMO corpo do dado, em negrito. Maior,
   ele competia com os valores que resume. */
.total{
  text-align:right; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;
  white-space:nowrap; color:var(--tierra-900);
}

tbody td{
  height:var(--altura-linha); padding:0 var(--respiro-grade);
  border-top:1px solid var(--tierra-100);
  border-right:1px solid var(--separador-coluna);
  color:var(--tierra-700);
}
tbody td:last-child, thead th:last-child{border-right:0;}
/* Nome NUNCA quebra em duas linhas: um nome comprido dobrava a altura só daquela
   fila e a tabela virava um serrote. Corta com reticências, e só a partir de
   280px — com o corte a qualquer largura, nome curto também ganhava reticências. */
/* O CORTE COMECA EM 190px, e nao em 280: e o que faz a tabela caber na tela sem
   rolagem lateral, e o que paga o piso das colunas de valor. Os nomes de insumo vao
   a quarenta caracteres e nenhuma largura razoavel os mostra inteiros — quem precisa
   do nome curto tem a MASCARA DO PRODUTO na tela de editar, que e para isto.
   O CORTE SO VALE NO APERTO: numa janela larga as colunas de texto ficam com a
   sobra da tabela e passam bem dos 190px. */
tbody td.txt{max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
/* NÚMERO aparece inteiro, sempre. Sem corte e sem largura máxima de propósito:
   reticências num nome ainda se entendem pelo começo, num valor não ("1.507…"
   não diz se são milhares ou milhões). Quem cede espaço é o texto. */
tbody td.num{
  text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;
  color:var(--tierra-900);
}
/* A CANTIDAD TOTAL em negrito, de cima a baixo: ela e a unica coluna CALCULADA da
   grade — a soma do que existe com o que ja foi pedido. O peso separa o total das
   parcelas que estao ao lado dele, do mesmo jeito que a fila de total se separa
   das filas de dado. */
thead th.calc .rotulo-col, tbody td.calc{font-weight:700;}
/* O CÓDIGO tem o MESMO corpo e a mesma tinta das outras colunas de texto.
   Ele era menor (13px) e mais apagado (`tierra-500`), de quando vinha atrás do nome
   e servia de nota de pé. Agora ele é a PRIMEIRA coluna, e é por ele que se confere
   o item contra o ERP: colocá-lo na frente e continuar escrevendo-o mais claro que
   tudo o resto seria dar destaque de lugar e tirar de leitura.
   O que fica dele é o que não é enfeite: nunca quebra nem corta (um código cortado
   deixa de identificar o item) e os dígitos alinham na vertical. */
tbody td.cod{white-space:nowrap; font-variant-numeric:tabular-nums;}

/* ── AS CÉLULAS QUE SE DIGITAM ────────────────────────────────────────────────
   O campo tem CONTORNO, ao contrário do filtro do cabeçalho, que é sem borda. A
   diferença é o que ele quer dizer: o filtro se dissolve na faixa porque ele é um
   comando da tabela; estes três são o DADO, e um dado que se pode alterar precisa
   parecer alterável antes de a pessoa clicar. Sem contorno, uma coluna de números
   editáveis fica idêntica à coluna de estoque, que ninguém pode mudar.

   Ele ocupa a célula inteira: um campo menor que a célula deixa uma faixa em volta
   onde o clique não pega, e numa grade de centenas de filas isso é errar o alvo o
   tempo todo. */
tbody td .campo-celula{
  width:100%; height:29px; padding:0 8px; text-align:right;
  border:1px solid var(--tierra-200); border-radius:5px;
  background:var(--superficie); color:var(--tierra-900);
  font:inherit; font-variant-numeric:tabular-nums; outline:none;
  transition:border-color .15s,box-shadow .15s;
}
tbody td .campo-celula:hover{border-color:var(--borda-forte);}
tbody td .campo-celula:focus{
  border-color:var(--somax-500);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--somax-500) 22%,transparent);
}
/* O campo de DATA é mais largo que o de número: além dos dez caracteres da data,
   o navegador desenha o ícone do calendário dentro dele. Sem espaço, ou o ícone
   cobre o ano ou a data é cortada. */
/* O SELETOR DE MÊS na célula. Alinhado à esquerda, como todo texto, e com espaço
   à direita para a setinha que o navegador desenha. */
tbody td .campo-mes{
  text-align:left; padding-right:26px; cursor:pointer;
  background-position:calc(100% - 13px) calc(50% + 1px), calc(100% - 8px) calc(50% + 1px);
}
/* `width:1%` com piso: encolhe até o piso e para. Sem o `width`, a coluna do mês
   não casa a regra das colunas de número (a classe dela é `mes`, não `num`) e passa
   a ser a única sem dica de largura — então absorve TODA a sobra da tabela e fica
   com o triplo do tamanho que precisa, enquanto o nome do produto aparece cortado.
   Quem fica com a sobra tem de ser o nome.
   O piso cabe "Septiembre", que é o mês mais comprido dos dois idiomas, mais a
   setinha, no respiro de 13px da grade. */
thead th.edt-mes, tbody td.edt-mes{width:1%; min-width:128px;}
tbody td.mes{white-space:nowrap;}

/* SEM MARCA VISUAL no que foi corrigido à mão. Houve um ponto verde no canto da
   célula, e ele saiu a pedido: numa coluna em que se corrige metade das filas, uma
   fileira de pontos vira ruído — e o número que importa é o que vale hoje, não a
   história dele.
   A DICA DO MOUSE fica: quem quiser conferir o que a planilha trazia passa o
   mouse, e isso não pinta nada na tela. */

/* Enquanto a edição está aberta, o cabeçalho das colunas que abriram ganha um
   traço no alto: é o que mostra, sem legenda, quais colunas responderam ao botão
   Editar. As de fato (estoque, pedido) seguem exatamente como estavam. */
thead tr.cabecalho th.editavel{box-shadow:inset 0 2px 0 var(--somax-500);}
tbody tr:hover td{background:var(--faixa-grid);}
/* Zero em cinza claro. Numa grade de centenas de filas o zero é ruído: ele
   precisa estar lá (a fila toda em zero é uma resposta que nenhuma outra tela
   dá), mas não competindo com o dado que tem valor. */
.zero{color:var(--tierra-300);}
.vazio-lista{padding:36px var(--respiro); text-align:center; color:var(--tierra-500);}

/* ── A TELA DE ANÁLISE ───────────────────────────────────────────────────────
   A FAIXA VERDE COM OS TOTAIS EM OURO é a assinatura do painel de análises do Plan
   de Ventas, e ela volta aqui inteira. Na tela da comparação ela saiu a pedido — lá
   os totais já vivem no pé de cada coluna, e a faixa repetia a conta. Aqui não há
   coluna nenhuma: a faixa É onde os totais moram. */
.faixa-analise{
  margin-bottom:14px; padding:16px 24px; border-radius:12px; color:#fff;
  background:linear-gradient(135deg,var(--somax-600),var(--somax-800));
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
  gap:14px 40px;
}
.faixa-analise h1{
  margin:0; font-size:19px; font-weight:700; line-height:1.35; min-width:0;
}
.faixa-numeros{display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 34px;}
.faixa-numero{display:flex; flex-direction:column; gap:2px;}
.faixa-numero .rot{
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  opacity:.8; white-space:nowrap;
}
/* O OURO nos números, e só neles: é o que faz a faixa ter um assunto. Ele é a cor
   de assinatura da casa, e aqui ela nomeia o total — não um estado nem uma ação. */
.faixa-numero .val{
  font-size:20px; font-weight:700; color:var(--firma);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}

.barra-analise{margin-bottom:14px; gap:10px;}
/* ── OS QUATRO FILTROS DA ANÁLISE ────────────────────────────────────────────
   Cada um é uma pastilha com o rótulo da dimensão, o valor escolhido e o funil. Ela
   acende quando há recorte — o mesmo verde do funil aceso na grade, e querendo dizer
   a mesma coisa: "esta tela está recortada por aqui". */
.filtros-bi{display:flex; flex-wrap:wrap; align-items:center; gap:8px; min-width:0;}
.filtro-bi{
  display:inline-flex; align-items:center; gap:8px;
  height:32px; padding:0 6px 0 11px; border-radius:8px;
  border:1px solid var(--tierra-200); background:var(--superficie);
  font-size:12px; max-width:280px;
}
.filtro-bi .rot{
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  color:var(--tierra-500); white-space:nowrap;
}
.filtro-bi b{
  color:var(--tierra-900); font-weight:600; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.filtro-bi.ativo{
  border-color:color-mix(in srgb, var(--accion-clara) 45%, transparent);
  background:var(--somax-50);
}
/* O funil aqui é sempre visível: ele é o jeito de abrir o filtro, e não uma pista
   discreta ao lado de um rótulo como no cabeçalho da tabela. */
.filtro-bi .funil{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  width:22px; height:22px; padding:0; border:0; border-radius:5px;
  background:transparent; color:var(--tierra-300); cursor:pointer;
}
.filtro-bi .funil svg{width:13px; height:13px;}
.filtro-bi .funil:hover{color:var(--tierra-700);}
.filtro-bi.ativo .funil, .filtro-bi .funil.aberto{color:var(--accion-clara);}
.barra-analise .rot-medida{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  color:var(--tierra-500);
}

/* ── A GRADE DOS CARTÕES ─────────────────────────────────────────────────────
   SEIS COLUNAS, e não duas: é o menor número que se divide em 2 (3+3) e em 3
   (2+2+2), e é o que permite as duas fileiras terem contagens diferentes de cartão
   com UM sistema de calhas só — as bordas de cima e de baixo continuam alinhadas.

   A ALTURA VEM DA JANELA. As duas fileiras repartem o que sobra depois da faixa e
   da barra de comandos, cada cartão cresce até o tamanho da sua célula e o conteúdo
   dele se estica ou rola por dentro. Era altura de conteúdo, e o painel terminava
   com um vazio embaixo em tela grande e com rolagem em tela pequena.
   O PISO de 210px por fileira é o que impede o gráfico de virar um risco numa
   janela baixa: abaixo disso a página rola, que é o comportamento honesto. */
.grade-cartoes{
  display:grid; grid-template-columns:repeat(6, minmax(0, 1fr));
  grid-template-rows:repeat(2, minmax(210px, 1fr));
  gap:14px; padding-bottom:16px;
  height:calc(100vh - var(--altura-topo,56px) - 200px);
}
@media(max-width:1100px){
  /* Estreito, as três de baixo não caberiam lado a lado sem virar tirinhas: a grade
     volta a ser de duas colunas e a altura volta a ser a do conteúdo. */
  .grade-cartoes{
    grid-template-columns:repeat(2, minmax(0, 1fr));
    grid-template-rows:auto; height:auto;
  }
}
@media(max-width:760px){ .grade-cartoes{grid-template-columns:1fr;} }

/* O CARTÃO É UMA COLUNA FLEX: o título tem a altura dele e o corpo fica com o
   resto. É o que faz o conteúdo saber quanto espaço ele tem. */
.cartao-bi{
  background:var(--superficie); border:1px solid var(--tierra-200);
  border-radius:12px; overflow:hidden; min-width:0; min-height:0;
  display:flex; flex-direction:column;
}
.cartao-bi > div{flex:1; min-height:0; display:flex; flex-direction:column;}
.cartao-bi.metade{grid-column:span 3;}
.cartao-bi.terco{grid-column:span 2;}
@media(max-width:1100px){
  .cartao-bi.metade, .cartao-bi.terco{grid-column:span 1;}
}
@media(max-width:760px){
  .cartao-bi.metade, .cartao-bi.terco{grid-column:1 / -1;}
}
/* O TÍTULO DO CARTÃO usa a tarja do grid: os cartões e a tabela são a mesma
   ferramenta, e o cabeçalho de um bloco de dado tem a mesma cara em toda ela. */
.cartao-bi > h2{
  margin:0; padding:0 16px; height:var(--altura-campo);
  display:flex; align-items:center;
  background:var(--faixa-grid); border-bottom:1px solid var(--tierra-200);
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  color:var(--faixa-grid-texto);
}

/* ── AS BARRAS VERTICAIS (evolução) ──────────────────────────────────────────
   Em CSS e não em SVG: são doze colunas de altura proporcional, e um `flex` com
   `align-items:flex-end` já é exatamente isso. O SVG entraria para desenhar a
   ROSCA, onde a geometria não sai de caixas.
   AS LINHAS DE GRADE ficam ATRÁS, em `repeating-linear-gradient`: elas existem para
   o olho estimar o valor sem ler o número, e não para serem lidas — daí serem quase
   invisíveis. */
.barras{
  flex:1; min-height:0; display:flex; flex-direction:column;
  padding:18px 16px 12px;
}
/* A ÁREA DO GRÁFICO fica com a altura que o cartão tiver: `flex:1` em vez dos 210px
   fixos de antes. O piso existe para a barra continuar sendo uma barra numa janela
   baixa. */
.barras-area{
  position:relative; flex:1; min-height:120px;
  display:flex; align-items:flex-end; gap:6px; padding-left:52px;
}
.barras-grade{
  position:absolute; inset:0 0 0 52px; pointer-events:none;
  border-bottom:1px solid var(--tierra-200);
  background-image:repeating-linear-gradient(to top,
    var(--tierra-100) 0 1px, transparent 1px 25%);
}
/* A ESCALA à esquerda: quatro marcas, do zero ao teto arredondado. */
.barras-escala{
  position:absolute; left:0; top:0; bottom:0; width:48px;
  display:flex; flex-direction:column; justify-content:space-between;
  font-size:10px; color:var(--tierra-300); text-align:right;
  font-variant-numeric:tabular-nums;
}
/* `position:relative` E `z-index` porque a grade de fundo é ABSOLUTA: num mesmo
   contexto de empilhamento, elemento posicionado pinta por cima de elemento comum —
   e a linha de grade atravessava as barras em vez de ficar atrás delas. */
.barra-col{
  position:relative; z-index:1;
  flex:1 1 0; min-width:0; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end; height:100%; gap:4px;
}
.barra-col .val{
  font-size:11px; font-weight:700; color:var(--tierra-900);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
/* A BARRA em si. `min-height` de 2px para um mês com valor pequeno mas não-zero
   continuar aparecendo: barra invisível lê como mês sem nada, e são coisas
   diferentes. */
.barra-col .haste{
  width:100%; max-width:54px; min-height:2px; border-radius:4px 4px 0 0;
  background:var(--somax-600);
}
.barra-col.vazia .haste{background:var(--tierra-100); min-height:2px;}
.barra-col.vazia .val{color:var(--tierra-300);}
.barras-pes{
  display:flex; gap:6px; padding-left:52px; margin-top:6px;
}
.barras-pes span{
  flex:1 1 0; min-width:0; text-align:center;
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  color:var(--tierra-500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ── A ROSCA ─────────────────────────────────────────────────────────────────
   Desenhada com UM círculo por fatia e `stroke-dasharray`: o traço de cada um cobre
   a fração dele da circunferência e o `stroke-dashoffset` o gira até o lugar. É a
   forma de fazer rosca em SVG sem calcular arco nenhum à mão. */
/* A ROSCA E A LEGENDA são DUAS PEÇAS LADO A LADO, centradas no cartão — e não uma
   rosca à esquerda com a legenda esticada até a borda direita. Esticada, cada linha
   ficava com o nome de um lado e o número do outro, separados por um vazio de duzentos
   pixels: para saber quanto é "Fungicidas" o olho tinha de atravessar o cartão.
   A LEGENDA É UMA CAIXA COM CONTORNO, do tamanho do conteúdo. É o desenho do painel
   de análises do Plan de Ventas, e a razão dele é essa: a caixa segura as três
   colunas juntas, e aí a linha se lê inteira sem varredura. */
/* AS TRÊS DISTÂNCIAS SÃO IGUAIS: da borda até a rosca, da rosca até a legenda, e da
   legenda até a outra borda. É o que `space-evenly` faz — ele reparte a sobra em
   partes iguais ANTES, ENTRE e DEPOIS dos itens, e é a única forma de as três
   folgas serem a mesma sem escrever nenhuma delas à mão.
   Com `center` a folga do meio era o `gap` (30px) e as das pontas eram metade da
   sobra (uns 95px cada) — três distâncias diferentes num cartão de duas peças.
   O `gap` fica como PISO: numa janela estreita, a sobra é zero e ele é o que impede
   as duas peças de se encostarem. */
.rosca{
  flex:1; min-height:0; overflow:auto;
  display:flex; flex-wrap:wrap; align-content:center; align-items:center;
  justify-content:space-evenly; gap:22px 24px; padding:22px 10px;
}
.rosca svg{flex:0 0 auto; width:190px; height:190px; transform:rotate(-90deg);}
.rosca-legenda{
  flex:0 1 auto; min-width:0;
  display:flex; flex-direction:column;
  /* Sem respiro à esquerda e à direita: são as bordas das colunas que marcam onde
     cada uma começa, e um respiro por fora as deixaria soltas dentro da caixa. */
  padding:8px 0; border:1px solid var(--tierra-200); border-radius:10px;
  background:var(--superficie); overflow:hidden;
}
/* A PRIMEIRA e a ÚLTIMA célula da fila ganham o respiro da caixa. */
.rosca-item .bolinha{margin-left:13px;}
.rosca-item .pct{margin-right:13px;}
.rosca-item{
  display:flex; align-items:center;
  height:27px; font-size:12px; color:var(--tierra-700);
}
/* BOLINHA REDONDA, e não quadradinho: na referência ela é um ponto, e o ponto é o
   que não compete com a pastilha de nome de coluna que existe em outras telas. */
.rosca-item .bolinha{
  flex:0 0 auto; width:9px; height:9px; border-radius:50%; margin-right:9px;
}
.rosca-item .nome{
  flex:1 1 auto; min-width:96px; padding-right:14px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
/* O SEPARADOR ENTRE AS COLUNAS, como na referência. As filas se tocam (não há `gap`
   entre elas), então a borda de cada célula emenda com a de cima e a de baixo e as
   três colunas ficam divididas por uma linha contínua — a mesma linha fina que
   separa duas colunas na tabela, e pelo mesmo motivo: o olho não escorrega de uma
   coluna para a outra.
   AS DUAS COLUNAS DE NÚMERO têm largura fixa e dígitos de mesma medida: é o que faz
   as vírgulas e os "%" caírem na mesma vertical em todas as filas. */
.rosca-item .val{
  flex:0 0 auto; min-width:96px; padding:0 12px; text-align:right;
  border-left:1px solid var(--tierra-100);
  font-weight:700; color:var(--tierra-900); font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.rosca-item .pct{
  flex:0 0 auto; width:46px; padding-left:11px; text-align:right;
  border-left:1px solid var(--tierra-100);
  color:var(--tierra-500); font-variant-numeric:tabular-nums;
}

/* ── AS BARRAS HORIZONTAIS ───────────────────────────────────────────────────
   O nome à esquerda em largura fixa, a barra no meio, o valor à direita: é a forma
   do "grupo de estoque" do Plan de Ventas, e ela funciona porque as três colunas
   alinham na vertical em todas as linhas. */
.barras-h{
  flex:1; min-height:0; overflow:auto;
  padding:14px 16px; display:flex; flex-direction:column; gap:8px;
}
.barra-h{display:flex; align-items:center; gap:10px; font-size:12px;}
.barra-h .nome{
  flex:0 0 128px; min-width:0; color:var(--tierra-700);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.barra-h .trilha{
  flex:1; min-width:0; height:20px; border-radius:5px;
  background:var(--faixa-grid); position:relative; overflow:hidden;
}
.barra-h .cheio{height:100%; border-radius:5px; min-width:3px;}
/* A PORCENTAGEM fica DEPOIS da barra, na parte clara da trilha. Quando a barra é
   quase toda a trilha não há "depois", e aí ela entra DENTRO, em branco: escrita em
   tinta escura sobre o cheio escuro, ela simplesmente desaparecia — foi o que
   aconteceu com a primeira linha, a maior de todas. */
.barra-h .pct{
  position:absolute; top:0; bottom:0; display:flex; align-items:center;
  font-size:10px; font-weight:700; color:var(--tierra-700);
  padding-left:6px; font-variant-numeric:tabular-nums;
}
.barra-h .pct.dentro{
  padding-left:0; padding-right:7px; color:#fff;
  transform:translateX(-100%);
}
.barra-h .val{
  flex:0 0 auto; min-width:96px; text-align:right; font-weight:700;
  color:var(--tierra-900); font-variant-numeric:tabular-nums;
}

/* ── O RANKING ───────────────────────────────────────────────────────────────
   Uma tabela de verdade, com a mesma fila de 37px da grade. Ela rola por dentro:
   são trezentos produtos, e um cartão de trezentas filas não é um cartão. */
/* O RANKING ROLA POR DENTRO do cartão, e a altura é a do cartão: são trezentos
   produtos, e a lista tem de caber onde ela está. */
.ranking{flex:1; min-height:0; overflow:auto;}
.ranking table{width:100%; border-collapse:separate; border-spacing:0; font-size:13px;}
.ranking td{
  height:var(--altura-linha); padding:0 14px;
  border-top:1px solid var(--tierra-100); color:var(--tierra-700);
}
.ranking tr:first-child td{border-top:0;}
.ranking tr.clicavel{cursor:pointer;}
.ranking tr.clicavel:hover td{background:var(--faixa-grid);}
.ranking tr.apagado td{opacity:.32;}
.ranking td.pos{
  width:1%; color:var(--tierra-300); font-variant-numeric:tabular-nums;
  padding-right:0;
}
.ranking td.nome{max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ranking td.val{
  width:1%; text-align:right; font-weight:700; color:var(--tierra-900);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.ranking td.pct{
  width:1%; text-align:right; color:var(--tierra-500);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.bi-vazio{padding:30px 16px; text-align:center; font-size:13px; color:var(--tierra-500);}

/* ── O CRUZAMENTO: o que se clica e o que fica apagado ───────────────────────
   O CURSOR é a única pista de que ali se clica antes do primeiro clique. Um destaque
   permanente nos doze meses e nas cinco fatias encheria os cartões de convite. */
.barra-col.clicavel, .rosca-item.clicavel, .barra-h.clicavel{cursor:pointer;}
.barra-col.clicavel:hover .haste{filter:brightness(1.15);}
.barra-h.clicavel:hover{background:var(--faixa-grid);}
/* NA LEGENDA o hover pinta a FILA INTEIRA, bordas de coluna inclusive: pintar só as
   células deixaria três retângulos com frestas brancas entre eles. */
.rosca-item.clicavel:hover{background:var(--faixa-grid);}
.rosca-item.clicavel:hover .val, .rosca-item.clicavel:hover .pct{
  border-color:var(--tierra-200);
}
/* APAGADO, e não escondido: o valor não escolhido continua na tela porque é dele que
   se sai — escondê-lo tiraria o caminho de volta e faria o gráfico parecer outro. */
.barra-col.apagado, .rosca-item.apagado, .barra-h.apagado{opacity:.32;}
.rosca-item{border-radius:6px;}
.barra-h{border-radius:6px; padding:2px 4px; margin:-2px -4px;}


/* ── A TELA DE PRODUTOS ──────────────────────────────────────────────────────
   Mesma moldura, mesma tarja de cabeçalho, mesmas medidas de fila da grade: são
   duas telas da mesma ferramenta, e a segunda não é lugar de inventar outra
   aparência. O que ela tem de próprio é o interruptor e a fila apagada do inativo.
   A coluna da MÁSCARA fica em itálico e apagada quando vazia — ela é o único campo
   desta tela que pode não ter valor e isso ser o certo. */
#tela-produtos thead th{cursor:default;}
#tela-produtos td.mascara{color:var(--tierra-500);}
#tela-produtos th.ativo, #tela-produtos td.ativo{
  width:1%; min-width:70px; text-align:center; padding:0 var(--respiro-grade);
}
/* A FILA DO INATIVO fica APAGADA, e não escondida nem riscada: ela continua sendo
   um produto, e o que mudou é que ele saiu do assunto. Riscada leria como apagada
   do cadastro, que é outra coisa (e coisa que esta tela não faz). */
#tela-produtos tr.inativa td{color:var(--tierra-300);}
#tela-produtos tr.inativa td.cod, #tela-produtos tr.inativa td.eixo{color:var(--tierra-300);}

/* ── O INTERRUPTOR ───────────────────────────────────────────────────────────
   Desenhado à mão, como a caixa de marcar do funil e pelo mesmo motivo: o controle
   nativo não aceita a cor do tema em todo navegador. Aqui a forma importa mais que
   nos outros — um interruptor tem de parecer um interruptor, porque a pergunta que
   ele responde é "ligado ou desligado", e não "marcado ou não". */
.interruptor{
  display:inline-flex; align-items:center; flex-shrink:0;
  width:38px; height:22px; padding:0 2px; border:0; border-radius:11px;
  background:var(--tierra-200); cursor:pointer;
  transition:background-color .18s;
}
.interruptor > span{
  width:18px; height:18px; border-radius:50%; background:var(--superficie);
  box-shadow:0 1px 2px rgb(0 0 0 / .25);
  transition:transform .18s;
}
.interruptor.ligado{background:var(--somax-500);}
.interruptor.ligado > span{transform:translateX(16px);}
.interruptor:hover{background:var(--tierra-300);}
.interruptor.ligado:hover{background:var(--somax-600);}


/* ── A TELA VAZIA ────────────────────────────────────────────────────────────
   Ela é o começo de TODA sessão, porque a base não vem no arquivo. Então ela não
   é um erro: é a porta de entrada, e por isso ocupa a página inteira e diz em uma
   frase o que fazer. */
/* A caixa de fora NÃO tem moldura nem tracejado: quem recebe arquivo são os dois
   cartões, e um tracejado em volta de tudo prometia um alvo que não existe.
   Ela ocupa a ALTURA QUE SOBRA da janela, e não uma altura fixa: com altura
   cravada, numa tela grande sobrava um palmo de fundo vazio embaixo, e a porta de
   entrada da ferramenta parecia um cartão perdido no meio da página. */
.vazio{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; text-align:center;
  min-height:calc(100vh - 150px); padding:40px 24px;
}
.vazio h2{margin:0; font-size:23px; font-weight:700; color:var(--tierra-900);}
.vazio p{margin:0; max-width:56ch; color:var(--tierra-500); line-height:1.65;}
.vazio .nota{font-size:12px; color:var(--tierra-300); max-width:58ch; margin-top:6px; line-height:1.6;}

/* ── OS DOIS CARTÕES DE CARGA ────────────────────────────────────────────────
   Lado a lado em tela larga, um sobre o outro quando não cabem. Larguras iguais e
   fixas em `1 1 300px`: os dois relatórios têm o mesmo peso na abertura, e um
   cartão maior que o outro sugeriria que um é o principal. */
.cartoes{
  display:flex; flex-wrap:wrap; gap:16px; justify-content:center;
  margin-top:18px; width:100%; max-width:760px;
}
.cartao{
  flex:1 1 300px; display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:20px; border:2px dashed var(--tierra-200); border-radius:14px;
  background:var(--superficie); transition:border-color .15s,background-color .15s;
}
/* ARRASTANDO SOBRE ELE: o cartão acende. É por cartão e não pela página inteira —
   com dois alvos, "acendeu" tem de dizer QUAL vai receber. */
.cartao.pronto{border-color:var(--somax-500); background:var(--somax-50);}
/* CARREGADO: a moldura fecha (deixa de ser tracejada) e fica verde. O tracejado
   quer dizer "falta algo aqui", e depois de carregado não falta mais. */
.cartao.carregado{border-style:solid; border-color:var(--somax-100); background:var(--somax-50);}

.cartao-topo{display:flex; align-items:center; gap:10px; width:100%; text-align:left;}
/* O NÚMERO não é ordem obrigatória — a ordem de carga é indiferente. Ele existe
   para os dois cartões se distinguirem numa frase ("carreguei o 1, falta o 2"). */
.cartao-topo .numero{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:50%;
  background:var(--tierra-100); color:var(--tierra-500);
  font-size:12px; font-weight:700;
}
.cartao.carregado .numero{background:var(--somax-500); color:#fff;}
.cartao-nomes{display:flex; flex-direction:column; min-width:0; flex:1;}
.cartao-nomes b{font-size:14px; color:var(--tierra-900);}
/* O NOME DO ARQUIVO em fonte de máquina: são dois nomes parecidos do mesmo ERP, e
   a fonte de código faz o olho comparar caractere por caractere em vez de ler. */
.cartao-nomes .arquivo{
  font-size:11px; color:var(--tierra-500); font-family:ui-monospace,Consolas,monospace;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cartao .tique-carga{
  flex:0 0 auto; width:18px; height:18px; color:var(--accion-clara);
  opacity:0; transition:opacity .15s;
}
.cartao.carregado .tique-carga{opacity:1;}

/* O ESTADO: vazio antes de carregar, e depois o arquivo que entrou com a contagem.
   Altura mínima reservada para o cartão não pular de tamanho ao carregar. */
.cartao-estado{
  /* COLUNA, e não linha. Em linha, o nome do arquivo e a contagem viravam dois
     itens do flex lado a lado e se sobrepunham — o `<br>` entre eles não quebra
     nada dentro de um flex, ele é só mais um item que não desenha coisa alguma.
     Por isso são dois elementos empilhados, sem `<br>`. */
  min-height:36px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:1px;
  font-size:12px; line-height:1.4; color:var(--tierra-500); padding:0 4px;
  width:100%; min-width:0;
}
